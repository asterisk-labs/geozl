<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="A Zarr chunk passes through three kinds of codec before it is stored, array to array, array to bytes and bytes to bytes. By default Zarr 3 uses bytes then zstd. With GeoZL, geozl takes the array to bytes step and nothing follows it. Zarr 2 has filters and one compressor, all numcodecs codecs, and zarr-python hands the compressor the chunk as an array, so geozl works there as the compressor."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.ttl{fill:#111111;font:600 13px "IBM Plex Mono",monospace}
.sub{fill:#5C6370;font:500 10.5px "IBM Plex Mono",monospace}
.col{fill:#5C6370;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.04em;text-anchor:middle}
.step{fill:#111111;font:600 12px "IBM Plex Mono",monospace;text-anchor:middle}
.none{fill:#9AA0A8;font:500 11px "IBM Plex Mono",monospace;text-anchor:middle}
.cap{fill:#111111;font:500 11.5px "IBM Plex Mono",monospace}
.box{fill:#FFFFFF;stroke:#111111;stroke-width:1.3}
.on{fill:color-mix(in srgb,#492AE8 12%,#FFFFFF);stroke:#492AE8;stroke-width:1.5}
.empty{fill:none;stroke:#B8BDC4;stroke-width:1.1;stroke-dasharray:4 3}
.ar{stroke:#111111;stroke-width:1.3;fill:none}
.sep{stroke:#D5D9DF;stroke-width:1}
.cell{stroke:#111111;stroke-width:1}
]]></style>
<defs><marker id="z-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="col" x="262" y="28">ARRAY TO ARRAY</text>
<text class="col" x="414" y="28">ARRAY TO BYTES</text>
<text class="col" x="566" y="28">BYTES TO BYTES</text>

<text class="ttl" x="20" y="66">Zarr 3</text>
<text class="sub" x="20" y="82">default</text>
<g transform="translate(130 56)"><rect class="cell" x="0" y="0" width="10" height="10" style="fill:#B9D3E8"/><rect class="cell" x="10" y="0" width="10" height="10" style="fill:#8FB8DA"/><rect class="cell" x="0" y="10" width="10" height="10" style="fill:#D2E3F1"/><rect class="cell" x="10" y="10" width="10" height="10" style="fill:#B9D3E8"/></g>
<line class="ar" x1="156" y1="66" x2="196" y2="66" marker-end="url(#z-ah)"/>
<rect class="empty" x="202" y="51" width="120" height="30" rx="3"/><text class="none" x="262" y="70">none</text>
<line class="ar" x1="326" y1="66" x2="348" y2="66" marker-end="url(#z-ah)"/>
<rect class="box" x="354" y="51" width="120" height="30" rx="3"/><text class="step" x="414" y="70">bytes</text>
<line class="ar" x1="478" y1="66" x2="500" y2="66" marker-end="url(#z-ah)"/>
<rect class="box" x="506" y="51" width="120" height="30" rx="3"/><text class="step" x="566" y="70">zstd</text>
<line class="ar" x1="630" y1="66" x2="664" y2="66" marker-end="url(#z-ah)"/>
<rect class="box" x="670" y="55" width="20" height="22" rx="2"/><line class="ar" x1="674" y1="62" x2="686" y2="62"/><line class="ar" x1="674" y1="66" x2="686" y2="66"/><line class="ar" x1="674" y1="70" x2="682" y2="70"/>

<text class="ttl" x="20" y="136">Zarr 3</text>
<text class="sub" x="20" y="152">with GeoZL</text>
<g transform="translate(130 126)"><rect class="cell" x="0" y="0" width="10" height="10" style="fill:#B9D3E8"/><rect class="cell" x="10" y="0" width="10" height="10" style="fill:#8FB8DA"/><rect class="cell" x="0" y="10" width="10" height="10" style="fill:#D2E3F1"/><rect class="cell" x="10" y="10" width="10" height="10" style="fill:#B9D3E8"/></g>
<line class="ar" x1="156" y1="136" x2="196" y2="136" marker-end="url(#z-ah)"/>
<rect class="empty" x="202" y="121" width="120" height="30" rx="3"/><text class="none" x="262" y="140">none</text>
<line class="ar" x1="326" y1="136" x2="348" y2="136" marker-end="url(#z-ah)"/>
<rect class="on" x="354" y="121" width="120" height="30" rx="3"/><text class="step" x="414" y="140">geozl</text>
<line class="ar" x1="478" y1="136" x2="500" y2="136" marker-end="url(#z-ah)"/>
<rect class="empty" x="506" y="121" width="120" height="30" rx="3"/><text class="none" x="566" y="140">none</text>
<line class="ar" x1="630" y1="136" x2="664" y2="136" marker-end="url(#z-ah)"/>
<rect class="box" x="670" y="125" width="20" height="22" rx="2"/><line class="ar" x1="674" y1="132" x2="686" y2="132"/><line class="ar" x1="674" y1="136" x2="686" y2="136"/><line class="ar" x1="674" y1="140" x2="682" y2="140"/>

<line class="sep" x1="20" y1="178" x2="700" y2="178"/>

<text class="ttl" x="20" y="214">Zarr 2</text>
<text class="sub" x="20" y="230">numcodecs only</text>
<g transform="translate(130 204)"><rect class="cell" x="0" y="0" width="10" height="10" style="fill:#B9D3E8"/><rect class="cell" x="10" y="0" width="10" height="10" style="fill:#8FB8DA"/><rect class="cell" x="0" y="10" width="10" height="10" style="fill:#D2E3F1"/><rect class="cell" x="10" y="10" width="10" height="10" style="fill:#B9D3E8"/></g>
<line class="ar" x1="156" y1="214" x2="196" y2="214" marker-end="url(#z-ah)"/>
<rect class="empty" x="202" y="199" width="120" height="30" rx="3"/><text class="none" x="262" y="218">filters</text>
<line class="ar" x1="326" y1="214" x2="348" y2="214" marker-end="url(#z-ah)"/>
<rect class="on" x="354" y="199" width="272" height="30" rx="3"/><text class="step" x="490" y="218">geozl, as the compressor</text>
<line class="ar" x1="630" y1="214" x2="664" y2="214" marker-end="url(#z-ah)"/>
<rect class="box" x="670" y="203" width="20" height="22" rx="2"/><line class="ar" x1="674" y1="210" x2="686" y2="210"/><line class="ar" x1="674" y1="214" x2="686" y2="214"/><line class="ar" x1="674" y1="218" x2="682" y2="218"/>

<text class="cap" x="20" y="268">GeoZL reads the chunk as a raster, so it takes the array to bytes step.</text>
<text class="cap" x="20" y="286">One numcodecs codec serves Zarr 2, and a thin serializer carries it into Zarr 3.</text>
</svg>
