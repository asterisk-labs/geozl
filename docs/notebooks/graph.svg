<rect class="cell" x="20.0" y="130.0" width="11.0" height="11.0" style="fill:#E9C9A8"/><rect class="cell" x="31.0" y="130.0" width="11.0" height="11.0" style="fill:#D7A97E"/><rect class="cell" x="20.0" y="141.0" width="11.0" height="11.0" style="fill:#C99A6E"/><rect class="cell" x="31.0" y="141.0" width="11.0" height="11.0" style="fill:#E2BB92"/>
<text class="nm" x="52" y="145">reflectance</text>
<line class="ar" x1="150" y1="141" x2="246" y2="141" marker-end="url(#g-ah)"/>
<line class="ar" x1="474" y1="141" x2="590" y2="141" marker-end="url(#g-ah)"/>
<rect class="box" x="598" y="130" width="20" height="22" rx="2"/><line class="ar" x1="602" y1="137" x2="614" y2="137"/><line class="ar" x1="602" y1="141" x2="614" y2="141"/><line class="ar" x1="602" y1="145" x2="610" y2="145"/>
<rect class="fixed" x="252" y="56" width="216" height="104" rx="4"/>
<text class="pick" x="360" y="104">zstd</text><text class="alt" x="360" y="122">or DEFLATE, or Blosc</text>
<line class="sep" x1="20" y1="186" x2="700" y2="186"/>
<text class="ttl" x="20" y="218">GeoZL, built on OpenZL</text>
<text class="sub" x="20" y="236">each tile gets its own chain of small codecs, a graph</text>
<rect class="cell" x="20.0" y="254.0" width="11.0" height="11.0" style="fill:#B9E3C6"/><rect class="cell" x="31.0" y="254.0" width="11.0" height="11.0" style="fill:#8FCFA3"/><rect class="cell" x="20.0" y="265.0" width="11.0" height="11.0" style="fill:#D9EFC2"/><rect class="cell" x="31.0" y="265.0" width="11.0" height="11.0" style="fill:#B9E3C6"/>
<text class="nm" x="52" y="269">DEM</text>
<line class="ar" x1="150" y1="265" x2="172" y2="265" marker-end="url(#g-ah)"/>
<rect class="on" x="178" y="253" width="100" height="24" rx="3"/><text class="step" x="228.0" y="269">planar</text>
