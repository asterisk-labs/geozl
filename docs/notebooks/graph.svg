<rect class="cell" x="20.0" y="322.0" width="11.0" height="11.0" style="fill:#E9C9A8"/><rect class="cell" x="31.0" y="322.0" width="11.0" height="11.0" style="fill:#D7A97E"/><rect class="cell" x="20.0" y="333.0" width="11.0" height="11.0" style="fill:#C99A6E"/><rect class="cell" x="31.0" y="333.0" width="11.0" height="11.0" style="fill:#E2BB92"/>
<text class="nm" x="52" y="337">reflectance</text>
<line class="ar" x1="150" y1="333" x2="172" y2="333" marker-end="url(#g-ah)"/>
<rect class="on" x="178" y="321" width="100" height="24" rx="3"/><text class="step" x="228.0" y="337">wp_static</text>
<line class="ar" x1="284" y1="333" x2="306" y2="333" marker-end="url(#g-ah)"/>
<rect class="box" x="312" y="321" width="100" height="24" rx="3"/><text class="step" x="362.0" y="337">zigzag</text>
<line class="ar" x1="418" y1="333" x2="440" y2="333" marker-end="url(#g-ah)"/>
<rect class="on2" x="446" y="321" width="100" height="24" rx="3"/><text class="step" x="496.0" y="337">entropy</text>
<line class="ar" x1="552" y1="333" x2="590" y2="333" marker-end="url(#g-ah)"/>
<rect class="box" x="598" y="322" width="20" height="22" rx="2"/><line class="ar" x1="602" y1="329" x2="614" y2="329"/><line class="ar" x1="602" y1="333" x2="614" y2="333"/><line class="ar" x1="602" y1="337" x2="610" y2="337"/>
<text class="cap" x="20" y="378">profile tries the chains on your data and keeps the one that compresses it best.</text>
