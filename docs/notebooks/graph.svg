<rect class="cell" x="20.0" y="288.0" width="11.0" height="11.0" style="fill:#FFFFFF"/><rect class="cell" x="31.0" y="288.0" width="11.0" height="11.0" style="fill:#C9CED6"/><rect class="cell" x="20.0" y="299.0" width="11.0" height="11.0" style="fill:#FFFFFF"/><rect class="cell" x="31.0" y="299.0" width="11.0" height="11.0" style="fill:#FFFFFF"/>
<text class="nm" x="52" y="303">cloud mask</text>
<line class="ar" x1="150" y1="299" x2="172" y2="299" marker-end="url(#g-ah)"/>
<rect class="on" x="178" y="287" width="100" height="24" rx="3"/><text class="step" x="228.0" y="303">id</text>
<line class="ar" x1="284" y1="299" x2="306" y2="299" marker-end="url(#g-ah)"/>
