<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Spatial predictors and stream transforms for OpenZL compression graphs, with GPU-native decoding.">
<meta property="og:title" content="GeoZL · raster-aware codecs for OpenZL">
<meta property="og:description" content="Spatial predictors and stream transforms for OpenZL compression graphs, with GPU-native decoding.">
<meta property="og:type" content="website">
<title>GeoZL</title>
<link rel="icon" href="assets/svg/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel-soft: rgba(0, 0, 0, 0.035);
  --edge: rgba(0, 0, 0, 0.1);
  --ink: #000000;
  --ink-soft: #2b2f36;
  --dim: #5c6370;
  --faint: #8a919c;
  --violet: #492ae8;
  --mint: #c4ffc2;
  --sans: "League Spartan", Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  --page: 1180px;
  --pad-inline: clamp(20px, 4vw, 56px);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-width: 320px;
  overflow-x: clip;
  background: var(--bg);
}

body {
  min-width: 320px;
  min-height: 100vh;
  min-height: 100svh;
  overflow-x: clip;
  background:
    var(--bg);
  color: var(--ink);
  font: 400 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  color: inherit;
  font: inherit;
}

svg,
canvas {
  display: block;
}

code {
  font-family: var(--mono);
}

::selection {
  background: rgba(73, 42, 232, 0.2);
  color: var(--ink);
}

:focus-visible {
  outline: 2px solid var(--violet);
  outline-offset: 4px;
}

.ambient {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.ambient-orb {
  position: absolute;
  width: 28rem;
  aspect-ratio: 1;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.08;
}

.ambient-orb--violet {
  top: 4%;
  right: 4%;
  background: var(--violet);
}

.ambient-orb--mint {
  right: 28%;
  bottom: -22rem;
  background: var(--mint);
}

.page {
  width: min(100%, calc(var(--page) + (var(--pad-inline) * 2)));
  min-height: 100vh;
  min-height: 100svh;
  margin-inline: auto;
  padding: env(safe-area-inset-top) var(--pad-inline) max(16px, env(safe-area-inset-bottom));
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: clamp(18px, 3vh, 32px);
}

.masthead {
  position: relative;
  z-index: 3;
  min-width: 0;
  min-height: 74px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 24px;
  padding: 16px clamp(20px, 4vw, 56px);
  border-bottom: 1px solid var(--edge);
  color: var(--dim);
}

.lockup {
  justify-self: start;
  width: max-content;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
}

.lockup .marksvg {
  width: 38px;
  height: auto;
  flex: 0 0 auto;
  opacity: 0.9;
}

.lockup .wm-sm {
  font-size: 22px;
  font-weight: 650;
  line-height: 1;
  letter-spacing: -0.045em;
}

.nav {
  justify-self: end;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: clamp(14px, 2.1vw, 30px);
}

.nav a {
  position: relative;
  padding: 8px 0;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1;
  letter-spacing: 0.035em;
  transition: color 200ms ease;
}

.nav a::after {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 260ms cubic-bezier(0.32, 0.72, 0, 1);
}

.nav a:hover,
.nav a:focus-visible {
  color: var(--ink-soft);
}

.nav a:hover::after,
.nav a:focus-visible::after {
  transform: scaleX(1);
}

.offsite {
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 7px;
}

.offsite a {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--ink);
  transition: color 180ms ease;
}

.offsite svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.62;
  transition: opacity 180ms ease, transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

.offsite img {
  width: 15px;
  height: auto;
  opacity: 0.62;
  transition: opacity 160ms ease;
}

.offsite a:hover img,
.offsite a:focus-visible img {
  opacity: 1;
}

.offsite a > * {
  grid-area: 1 / 1;
}

.offsite img {
  transition: opacity 180ms ease, transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

.offsite .mark-color { opacity: 0; }

.offsite .pypi .mark-color { width: 19px; }

.offsite a:hover .mark-mono,
.offsite a:focus-visible .mark-mono,
.offsite .pypi:hover svg,
.offsite .pypi:focus-visible svg,
.offsite .rumi:hover svg,
.offsite .rumi:focus-visible svg { opacity: 0; }

.offsite a:hover img,
.offsite a:focus-visible img { transform: scale(1.3); }

.offsite a:hover .mark-color,
.offsite a:focus-visible .mark-color { opacity: 1; }

.offsite .github {
  fill: currentColor;
  stroke: none;
}

.offsite a:hover svg,
.offsite a:focus-visible svg {
  opacity: 1;
  transform: scale(1.3);
}

main {
  min-width: 0;
  display: grid;
  align-items: center;
}

.hero {
  position: relative;
  isolation: isolate;
  min-width: 0;
  min-height: clamp(520px, calc(100svh - 150px), 650px);
  display: grid;
  grid-template-columns: minmax(330px, 0.88fr) minmax(500px, 1.12fr);
  align-items: center;
  gap: clamp(36px, 5vw, 72px);
  overflow: hidden;
  padding-block: clamp(12px, 2vh, 24px);
}

.hero::after {
  position: absolute;
  z-index: -1;
  top: 50%;
  right: -10%;
  width: 65%;
  height: 80%;
  content: "";
  pointer-events: none;
  background: none;
  transform: translateY(-50%);
}

.hero-copy {
  position: relative;
  z-index: 1;
  min-width: 0;
}

.eyebrow {
  width: max-content;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 19px;
  color: var(--violet);
  font-family: var(--mono);
  font-size: clamp(12px, 1vw, 14px);
  font-weight: 650;
  letter-spacing: 0.09em;
  line-height: 1;
  text-transform: uppercase;
}

.eyebrow::before {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  content: "";
  background: var(--violet);
  box-shadow: none;
}

.hero h1 {
  max-width: 10.5ch;
  font-size: clamp(54px, 5.9vw, 80px);
  font-weight: 650;
  letter-spacing: -0.065em;
  line-height: 0.96;
}

.hero h1 .hero-line {
  display: block;
}

.hero h1 .hero-highlight {
  position: relative;
  isolation: isolate;
  display: inline-block;
}

.hero h1 .hero-highlight::before {
  position: absolute;
  inset: 0.56em -0.06em 0.02em -0.04em;
  z-index: -1;
  border-radius: 0.12em;
  content: "";
  background: var(--mint);
  transform: rotate(-0.8deg);
}

.hero-summary {
  max-width: 46ch;
  margin-top: 28px;
  color: var(--ink-soft);
  font-size: clamp(19px, 1.5vw, 22px);
  letter-spacing: -0.018em;
  line-height: 1.42;
}

.nowrap {
  white-space: nowrap;
}

.hero-summary strong {
  color: var(--ink);
  font-weight: 650;
}

.hero-summary-highlight {
  position: relative;
  isolation: isolate;
  display: inline-block;
  white-space: nowrap;
}

.hero-summary-highlight::before {
  position: absolute;
  inset: 0.76em -0.08em 0.06em -0.06em;
  z-index: -1;
  border-radius: 0.14em;
  content: "";
  background: #f7cc09;
  transform: rotate(0.6deg);
}

.install {
  position: relative;
  width: max-content;
  max-width: 100%;
  margin-top: 28px;
}

.install-command {
  min-width: 0;
  min-height: 44px;
  padding: 0 6px 0 15px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.045);
  transition: background-color 180ms ease;
}

.install-command:hover {
  background: rgba(0, 0, 0, 0.07);
}

.prompt {
  color: var(--violet);
  font-family: var(--mono);
  font-size: 13px;
  user-select: none;
}

.install code {
  min-width: 0;
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 14px;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.copy-command {
  width: 34px;
  height: 34px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  transition: color 160ms ease, background-color 160ms ease;
}

.copy-command:hover,
.copy-command:focus-visible {
  color: var(--ink);
  background: rgba(0, 0, 0, 0.06);
}

.copy-command:focus-visible { outline: 0; color: var(--violet); }

.copy-command.is-copied {
  color: var(--ink);
}

.install-command {
  cursor: pointer;
}

.install-command.is-copied {
  animation: install-flash 900ms ease-out;
}

@keyframes install-flash {
  0%, 30% { transform: scale(1); }
  12% { transform: scale(1.03); }
}

.copy-command {
  display: inline-grid;
  place-items: center;
}

.copy-command .icon-copy,
.copy-command .icon-check {
  grid-area: 1 / 1;
  transition: opacity 180ms ease, transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

.copy-command .icon-check {
  opacity: 0;
  transform: scale(0.4);
  stroke-width: 2.2;
}

.copy-command.is-copied .icon-copy {
  opacity: 0;
  transform: scale(0.4);
}

.copy-command.is-copied .icon-check {
  opacity: 1;
  transform: scale(1);
}

.copy-toast {
  position: absolute;
  top: -8px;
  right: 6px;
  padding: 5px 9px;
  border-radius: 3px;
  background: var(--ink);
  color: var(--bg);
  font: 500 11px/1 var(--mono);
  letter-spacing: 0.03em;
  opacity: 0;
  pointer-events: none;
  transform: translateY(4px);
  transition: opacity 180ms ease, transform 220ms ease;
}

.install.is-copied .copy-toast {
  opacity: 1;
  transform: translateY(-100%);
}

.copy-command svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
}

.copy-command span {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

.copy-feedback {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.geozl-flow {
  position: relative;
  z-index: 1;
  width: 100%;
  justify-self: end;
  pointer-events: auto;
}

.recipe-stage {
  position: relative;
  width: 100%;
  height: clamp(400px, 59vh, 480px);
  overflow: hidden;
  background: transparent;
}

.recipe-window {
  position: absolute;
  inset: 0;
  width: 100%;
  transform: scale(1);
  transform-origin: center;
  transition: transform 800ms cubic-bezier(0.22, 1, 0.36, 1), filter 800ms ease;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 5%, #000 94%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 5%, #000 94%, transparent 100%);
}

.graph-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.graph-carousel {
  width: max-content;
  max-width: 100%;
  margin: 1px auto 0;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--mono);
}

.graph-carousel__button {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  color: var(--faint);
  cursor: pointer;
  transition: color 160ms ease;
}

.graph-carousel__button svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.graph-carousel__button:hover,
.graph-carousel__button:focus-visible { color: var(--ink); }

.graph-carousel__button:focus-visible,
.graph-carousel__dot:focus-visible { outline: 0; }

.graph-carousel__steps {
  display: flex;
  align-items: center;
  gap: 18px;
}

.graph-carousel__dot {
  padding: 8px 0;
  border: 0;
  border-bottom: 1px solid transparent;
  background: transparent;
  color: var(--faint);
  cursor: pointer;
  font: 500 10px/1 var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: color 160ms ease, border-color 160ms ease;
}

.graph-carousel__dot:hover,
.graph-carousel__dot:focus-visible { color: var(--ink-soft); }

.graph-carousel__dot.is-active {
  color: var(--ink);
  border-bottom-color: var(--ink);
}

.graph-carousel__announcement {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

@media (min-width: 861px) and (hover: hover) and (pointer: fine) {
  .geozl-flow:hover .recipe-window {
    filter: brightness(1.06);
    transform: scale(1.025);
  }
}

.geozl-flow figcaption {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.colophon {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--faint);
  font-size: 12px;
  line-height: 1.2;
}

.heart {
  flex: 0 0 auto;
  width: 13px;
  height: 13px;
  background: var(--violet);
  transform-origin: center;
  transition: background-color 160ms ease;
  animation: heartbeat 2.4s ease-in-out infinite;
  -webkit-mask: url('assets/svg/heart.svg') center / contain no-repeat;
  mask: url('assets/svg/heart.svg') center / contain no-repeat;
}

@keyframes heartbeat {
  0%, 55%, 100% { transform: scale(1); }
  10% { transform: scale(1.22); }
  20% { transform: scale(1); }
  30% { transform: scale(1.14); }
  40% { transform: scale(1); }
}

.colophon:hover .heart,
.heart.is-loved { background: #f05b7f; }

.heart.is-loved {
  animation: heart-pop 1100ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes heart-pop {
  0% { transform: scale(1); }
  18% { transform: scale(2.6); }
  34% { transform: scale(1.6); }
  50% { transform: scale(2.2); }
  72% { transform: scale(0.9); }
  100% { transform: scale(1); }
}

.heart-spark {
  position: fixed;
  z-index: 10;
  width: var(--size, 11px);
  height: var(--size, 11px);
  background: var(--tint, #f05b7f);
  pointer-events: none;
  -webkit-mask: url('assets/svg/heart.svg') center / contain no-repeat;
  mask: url('assets/svg/heart.svg') center / contain no-repeat;
  animation: heart-spark 1500ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
}

@keyframes heart-spark {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--spin)); }
}

.by {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--dim);
  transition: color 160ms ease;
}

.by:hover,
.by:focus-visible { color: var(--ink-soft); }

.by img {
  width: 13px;
  height: 15px;
  opacity: 0.74;
}

@media (max-width: 1000px) {
  .hero {
    grid-template-columns: minmax(290px, 0.82fr) minmax(430px, 1.18fr);
    gap: 36px;
  }

  .hero h1 { font-size: clamp(48px, 6.1vw, 64px); }
}

@media (max-width: 860px) {
  main { align-items: start; }

  .hero {
    min-height: 0;
    grid-template-columns: minmax(0, 1fr);
    gap: 18px;
    overflow: visible;
    padding-block: 34px 12px;
  }

  .hero-copy { width: min(100%, 720px); }

  .hero h1 {
    max-width: 11ch;
    font-size: clamp(46px, 9vw, 64px);
  }

  .geozl-flow { width: 100%; }
  .recipe-stage { height: 390px; }
  .graph-carousel { margin-top: 0; }
}

@media (max-width: 760px) {
  .page {
    grid-template-rows: auto auto auto;
    gap: 26px;
  }

  .masthead {
    grid-template-columns: 1fr auto;
    row-gap: 8px;
    padding-inline: 18px;
  }
  .offsite { justify-self: end; }
  .nav {
    grid-column: 1 / -1;
    grid-row: 2;
    justify-self: stretch;
    justify-content: space-between;
    gap: 18px;
  }
  .nav a { font-size: 9px; }
}

@media (max-width: 560px) {
  .hero::after { right: -35%; width: 130%; }
  .hero h1 { font-size: clamp(48px, 13.5vw, 62px); }
  .hero-summary { margin-top: 20px; font-size: 19px; }
  .install { margin-top: 25px; }
  .copy-command { padding: 0; }
  .recipe-stage { height: 350px; }
  .graph-carousel { margin-top: 0; }
}

@media (max-width: 420px) {
  .page { padding-inline: 18px; }
  .lockup .marksvg { width: 34px; }
  .lockup .wm-sm { font-size: 20px; }
  .nav { width: 100%; gap: 10px; }
  .nav a { font-size: 9px; }
}

@media (min-width: 861px) and (max-height: 760px) {
  .hero {
    min-height: 500px;
    padding-block: 8px;
  }
  .hero h1 { font-size: clamp(52px, 5.9vw, 76px); }
  .hero-summary { margin-top: 20px; }
  .install { margin-top: 22px; }
  .recipe-stage { height: 410px; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>
<div class="ambient" aria-hidden="true">
  <span class="ambient-orb ambient-orb--violet"></span>
  <span class="ambient-orb ambient-orb--mint"></span>
</div>

<div class="page">
  <header class="masthead">
    <a class="lockup vt-lockup" href="index.html" aria-label="GeoZL home">
      <img class="marksvg" src="assets/svg/mark-light.svg" alt="">
      <span class="wm-sm">GeoZL</span>
    </a>

    <div class="offsite" aria-label="Project links">
      <a href="https://github.com/asterisk-labs/geozl" title="GitHub" aria-label="GeoZL on GitHub" rel="noopener noreferrer">
        <svg class="github" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"></path></svg>

<script>
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var copyButton = document.querySelector('.copy-command');
  var installRoot = document.querySelector('.install');
  var installCommand = document.querySelector('.install-command');
  var heart = document.querySelector('.heart');
  var copyTimer = 0;

  function celebrate() {
    installCommand.classList.remove('is-copied');
    heart.classList.remove('is-loved');
    void heart.offsetWidth;
    installCommand.classList.add('is-copied');
    heart.classList.add('is-loved');
    if (reduceMotion) return;
    var box = heart.getBoundingClientRect();
    var tints = ['#f05b7f', '#492ae8', '#f7cc09', '#f05b7f'];
    for (var i = 0; i < 16; i += 1) {
      var angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
      var reach = 50 + Math.random() * 70;
      var spark = document.createElement('span');
      spark.className = 'heart-spark';
      spark.style.left = (box.left + box.width / 2) + 'px';
      spark.style.top = (box.top + box.height / 2) + 'px';
      spark.style.setProperty('--dx', Math.round(Math.cos(angle) * reach) + 'px');
      spark.style.setProperty('--dy', Math.round(Math.sin(angle) * reach) + 'px');
      spark.style.setProperty('--size', Math.round(8 + Math.random() * 10) + 'px');
      spark.style.setProperty('--spin', Math.round((Math.random() - 0.5) * 70) + 'deg');
      spark.style.setProperty('--tint', tints[i % tints.length]);
      spark.style.animationDelay = Math.round(Math.random() * 180) + 'ms';
      spark.addEventListener('animationend', function () { this.remove(); });
      document.body.appendChild(spark);
    }
  }

  function copyFallback(text) {
    var area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (error) { ok = false; }
    area.remove();
    return ok;
  }

  installCommand.addEventListener('click', function (event) {
    if (event.target.closest('.copy-command')) return;
    copyButton.click();
  });

  copyButton.addEventListener('click', function () {
    var text = copyButton.getAttribute('data-copy');
    var feedback = document.querySelector('.copy-feedback');
    var copied = navigator.clipboard && window.isSecureContext
      ? navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return copyFallback(text); })
      : Promise.resolve(copyFallback(text));

    copied.then(function (ok) {
      copyButton.classList.toggle('is-copied', ok);
      installRoot.classList.toggle('is-copied', ok);
      copyButton.querySelector('span').textContent = ok ? 'Copied' : 'Copy';
      feedback.textContent = ok ? 'Install command copied.' : 'Select the command and copy it manually.';
      if (ok) celebrate();
      window.clearTimeout(copyTimer);
      copyTimer = window.setTimeout(function () {
        copyButton.classList.remove('is-copied');
        installRoot.classList.remove('is-copied');
        installCommand.classList.remove('is-copied');
        heart.classList.remove('is-loved');
        copyButton.querySelector('span').textContent = 'Copy';
      }, 1800);
    });
  });

  var graphCanvas = document.getElementById('graph-evolution');
  var graphContext = graphCanvas.getContext('2d');
  var graphCaption = document.querySelector('[data-graph-caption]');
  var graphPrevious = document.querySelector('[data-graph-prev]');
  var graphNext = document.querySelector('[data-graph-next]');
  var graphAnnouncement = document.querySelector('[data-graph-announcement]');
  var graphSteps = Array.prototype.slice.call(document.querySelectorAll('.graph-carousel__dot'));
  var graphDpr = Math.min(window.devicePixelRatio || 1, 2);
  var graphWidth = 0;
  var graphHeight = 0;
  var graphSceneShown = -1;
  var activeGraphScene = 0;
  var graphSceneStart = 0;
  var graphShownAt = 0;
  var graphSceneElapsed = 0;
  var graphRaf = 0;

  var graphColors = {
    ink: '#000000',
    soft: '#2b2f36',
    dim: '#5c6370',
    faint: '#8a919c',
    panel: '#ffffff',
    edge: 'rgba(0, 0, 0, 0.18)',
    wire: 'rgba(0, 0, 0, 0.32)',
    rule: 'rgba(0, 0, 0, 0.1)',
    violet: '#492ae8',
    gold: '#b8900a',
    mint: '#1d9a4a',
    ember: '#e0532a'
  };

  var graphScenes = [
    {
      animationDuration: 7200,
      legendIndex: 3,
      dataset: 'SENTINEL-1 SLC',
      datatype: 'complex radar · complex64',
      caption: 'Sentinel-1 SLC separates real and imaginary radar components.',
      draw: drawComplex
    },
    {
      animationDuration: 6400,
      legendIndex: 2,
      dataset: 'CLIMATE GRID',
      datatype: 'missing values · float32',
      caption: 'A climate grid sends NaNs to a validity mask.',
      draw: drawNodata
    },
    {
      animationDuration: 6000,
      legendIndex: 1,
      dataset: 'ELEVATION / DEM',
      datatype: 'smooth surface · int16',
      caption: 'A DEM becomes small spatial residuals.',
      draw: drawSpatial
    },
    {
      animationDuration: 6000,
      legendIndex: 0,
      dataset: 'LAND COVER',
      datatype: 'categorical classes · uint8',
      caption: 'Land-cover classes often need only entropy compression.',
      draw: drawBaseline
    }
  ];

  function clamp01(value) {
    return Math.max(0, Math.min(1, value));
  }

  function graphCompact() {
    return graphWidth < 480;
  }

  function graphFont(size, weight) {
    return (weight || 500) + ' ' + size + 'px "SFMono-Regular", "Cascadia Code", Consolas, monospace';
  }

  function resizeGraph() {
    var box = graphCanvas.getBoundingClientRect();
    graphDpr = Math.min(window.devicePixelRatio || 1, 2);
    graphWidth = Math.max(1, box.width);
    graphHeight = Math.max(1, box.height);
    graphCanvas.width = Math.round(graphWidth * graphDpr);
    graphCanvas.height = Math.round(graphHeight * graphDpr);
    graphContext.setTransform(graphDpr, 0, 0, graphDpr, 0, 0);
  }

  function graphPoint(x, y) {
    return {x: x, y: y};
  }

  function drawScreenText(text, x, y, color, size, align, alpha, weight) {
    graphContext.save();
    graphContext.globalAlpha = alpha;
    graphContext.fillStyle = color;
    graphContext.font = graphFont(size, weight);
    graphContext.textAlign = align || 'left';
    graphContext.textBaseline = 'middle';
    graphContext.fillText(text, x, y);
    graphContext.restore();
  }

  function roundedRect(x, y, width, height, radius) {
    graphContext.beginPath();
    if (typeof graphContext.roundRect === 'function') {
      graphContext.roundRect(x, y, width, height, radius);
    } else {
      graphContext.rect(x, y, width, height);
    }
  }

  function drawEndpointLabel(label, x, y, color, alpha) {
    var compact = graphCompact();
    var width = compact ? 42 : 50;
    var height = compact ? 16 : 18;
    graphContext.save();
    graphContext.globalAlpha = alpha;
    graphContext.fillStyle = graphColors.panel;
    graphContext.strokeStyle = color;
    graphContext.lineWidth = 1;
    roundedRect(x - width / 2, y - height / 2, width, height, height / 2);
    graphContext.fill();
    graphContext.stroke();
    graphContext.fillStyle = color;
    graphContext.font = graphFont(compact ? 6.5 : 7.5, 700);
    graphContext.textAlign = 'center';
    graphContext.textBaseline = 'middle';
    graphContext.fillText(label, x, y + 0.2);
    graphContext.restore();
  }

  function curveBetween(a, b) {
    var dy = (b.y - a.y) * 0.5;
    return {
      first: {x: a.x, y: a.y + dy},
      second: {x: b.x, y: b.y - dy}
    };
  }

  function cubicPoint(a, first, second, b, progress) {
    var inverse = 1 - progress;
    return {
      x: inverse * inverse * inverse * a.x + 3 * inverse * inverse * progress * first.x + 3 * inverse * progress * progress * second.x + progress * progress * progress * b.x,
      y: inverse * inverse * inverse * a.y + 3 * inverse * inverse * progress * first.y + 3 * inverse * progress * progress * second.y + progress * progress * progress * b.y
    };
  }

  function curveLength(a, first, second, b) {
    var previous = a;
    var length = 0;
    for (var sample = 1; sample <= 12; sample += 1) {
      var point = cubicPoint(a, first, second, b, sample / 12);
      length += Math.hypot(point.x - previous.x, point.y - previous.y);
      previous = point;
    }
    return length;
  }

  function arrowHead() {
    return graphCompact() ? 5 : 7;
  }

  function edgeTip(b) {
    return graphPoint(b.x, b.h ? b.y - b.h / 2 - 1 : b.y);
  }

  function edgeEnd(b) {
    var tip = edgeTip(b);
    return graphPoint(tip.x, tip.y - arrowHead());
  }

  function drawLine(a, b, color, alpha, dashed) {
    var head = arrowHead();
    var stroke = color === graphColors.ember ? graphColors.ember : graphColors.wire;
    var tip = edgeTip(b);
    a = graphPoint(a.x, a.y);
    b = edgeEnd(b);
    var curve = curveBetween(a, b);
    graphContext.save();
    graphContext.globalAlpha = alpha;
    graphContext.strokeStyle = stroke;
    graphContext.lineWidth = 1.25;
    graphContext.setLineDash(dashed || color === graphColors.ember ? [3, 3] : []);
    graphContext.beginPath();
    graphContext.moveTo(a.x, a.y);
    graphContext.bezierCurveTo(curve.first.x, curve.first.y, curve.second.x, curve.second.y, b.x, b.y);
    graphContext.stroke();
    graphContext.fillStyle = stroke;
    graphContext.beginPath();
    graphContext.moveTo(tip.x, tip.y);
    graphContext.lineTo(tip.x - head * 0.6, tip.y - head);
    graphContext.lineTo(tip.x + head * 0.6, tip.y - head);
    graphContext.closePath();
    graphContext.fill();
    graphContext.restore();
  }

  function drawNode(node, alpha) {
    var compact = graphCompact();
    var label = compact && node.short ? node.short : node.label;
    var point = graphPoint(node.x, node.y);
    var x = point.x - node.w / 2;
    var y = point.y - node.h / 2;
    graphContext.save();
    graphContext.globalAlpha = alpha;
    graphContext.fillStyle = graphColors.panel;
    graphContext.strokeStyle = node.color || graphColors.edge;
    graphContext.lineWidth = 1;
    roundedRect(x, y, node.w, node.h, 2);
    graphContext.fill();
    roundedRect(x + 0.5, y + 0.5, node.w - 1, node.h - 1, 2);
    graphContext.stroke();
    graphContext.fillStyle = node.color || graphColors.soft;
    graphContext.fillRect(x + 0.5, y + 0.5, 3, node.h - 1);
    graphContext.fillStyle = graphColors.ink;
    graphContext.font = graphFont(compact ? 7 : 9, 500);
    graphContext.textAlign = 'center';
    graphContext.textBaseline = 'middle';
    graphContext.fillText(label.toUpperCase(), point.x, point.y);
    graphContext.restore();
  }

  function drawFrame(x, y, height, streams, alpha, fillLevels, labels) {
    var compact = graphCompact();
    var point = graphPoint(x, y);
    x = point.x;
    y = point.y;
    var width = compact ? 30 : 52;
    var left = x - width / 2;
    var top = y - height / 2;
    var rowGap = compact ? 10 : 12;
    var payloadHeight = 5 + (streams.length - 1) * rowGap;
    var payloadTop = y - payloadHeight / 2;
    var labelSpace = compact ? 7 : 14;
    fillLevels = fillLevels || streams.map(function () { return 3; });
    labels = labels || streams.map(function (_, index) { return 'P' + (index + 1); });
    graphContext.save();
    graphContext.globalAlpha = alpha;
    graphContext.strokeStyle = graphColors.edge;
    graphContext.lineWidth = 1;
    graphContext.fillStyle = graphColors.panel;
    roundedRect(left, top, width, height, 5);
    graphContext.fill();
    graphContext.strokeStyle = graphColors.soft;
    roundedRect(left + 0.5, top + 0.5, width - 1, height - 1, 4.5);
    graphContext.stroke();
    graphContext.strokeStyle = graphColors.rule;
    graphContext.beginPath();
    graphContext.moveTo(left + 5, top + (compact ? 18 : 22));
    graphContext.lineTo(left + width - 5, top + (compact ? 18 : 22));
    graphContext.stroke();
    for (var i = 0; i < streams.length; i += 1) {
      var usable = width - 8 - labelSpace;
      var blockGap = 2;
      var blockWidth = (usable - blockGap * 2) / 3;
      for (var byte = 0; byte < 3; byte += 1) {
        var byteX = left + 4 + labelSpace + byte * (blockWidth + blockGap);
        var filled = clamp01(fillLevels[i] - byte);
        graphContext.globalAlpha = alpha;
        graphContext.strokeStyle = graphColors.edge;
        graphContext.fillStyle = 'rgba(0, 0, 0, 0.03)';
        graphContext.fillRect(byteX, payloadTop + i * rowGap, blockWidth, 5);
        graphContext.strokeRect(byteX + 0.5, payloadTop + i * rowGap + 0.5, blockWidth - 1, 4);
        if (filled > 0) {
          graphContext.globalAlpha = alpha * filled;
          graphContext.strokeStyle = graphColors.soft;
          graphContext.fillStyle = graphColors.soft;
          graphContext.fillRect(byteX, payloadTop + i * rowGap, blockWidth, 5);
          graphContext.strokeRect(byteX + 0.5, payloadTop + i * rowGap + 0.5, blockWidth - 1, 4);
        }
      }
    }
    graphContext.restore();
    drawScreenText('OUTPUT', x, top + (compact ? 10 : 13), graphColors.soft, compact ? 6.4 : 7.4, 'center', alpha, 700);
    labels.forEach(function (label, index) {
      drawScreenText(label, left + 4 + labelSpace / 2, payloadTop + index * rowGap + 2.5, graphColors.dim, compact ? 5 : 6, 'center', alpha, 600);
    });
  }

  function drawTile(x, y, kind, alpha) {
    var compact = graphCompact();
    var point = graphPoint(x, y);
    x = point.x;
    y = point.y;
    var width = compact ? 48 : 68;
    var height = kind === 'complex' ? (compact ? 52 : 62) : (compact ? 48 : 58);
    var cols = kind === 'complex' ? 2 : 4;
    var rows = kind === 'complex' ? 2 : 3;
    var cellW = width / cols;
    var cellH = height / rows;
    var values = kind === 'complex'
      ? ['3+1i', '4+1i', 'NaN', '4+2i']
      : (kind === 'nodata'
        ? ['18', 'NaN', '19', '20', '18', '19', 'NaN', '21', '19', '20', '21', '22']
        : (kind === 'classes'
          ? ['2', '2', '2', '3', '2', '2', '3', '3', '4', '4', '4', '3']
          : ['41', '42', '43', '44', '41', '42', '44', '45', '42', '43', '45', '46']));

    graphContext.save();
    graphContext.globalAlpha = alpha;
    for (var row = 0; row < rows; row += 1) {
      for (var col = 0; col < cols; col += 1) {
        var index = row * cols + col;
        var px = x - width / 2 + col * cellW;
        var py = y - height / 2 + row * cellH;
        var hole = values[index].indexOf('NaN') >= 0;
        graphContext.fillStyle = graphColors.panel;
        graphContext.fillRect(px, py, cellW, cellH);
        graphContext.fillStyle = hole ? 'rgba(224, 83, 42, 0.14)' : 'rgba(73, 42, 232,' + (0.05 + index * 0.012) + ')';
        graphContext.strokeStyle = hole ? graphColors.ember : graphColors.edge;
        graphContext.lineWidth = 1;
        graphContext.fillRect(px, py, cellW, cellH);
        graphContext.strokeRect(px + 0.5, py + 0.5, cellW - 1, cellH - 1);
        drawScreenText(values[index], px + cellW / 2, py + cellH / 2, hole ? graphColors.ember : graphColors.soft, compact ? 6.5 : 8, 'center', alpha, 500);
      }
    }
    graphContext.restore();
    drawEndpointLabel('INPUT', x, y - height / 2 - (compact ? 10 : 12), graphColors.soft, alpha);
    return { width: width, height: height };
  }

  function drawToken(points, progress, color, alpha) {
    if (progress <= 0 || progress >= 1 || points.length < 2) return;
    var ends = points.map(edgeEnd);
    points = points.map(function (point) { return graphPoint(point.x, point.y); });
    var curves = [];
    var lengths = [];
    var total = 0;
    for (var i = 0; i < points.length - 1; i += 1) {
      var curve = curveBetween(points[i], ends[i + 1]);
      var length = curveLength(points[i], curve.first, curve.second, ends[i + 1]);
      curves.push(curve);
      lengths.push(length);
      total += length;
    }
    var wanted = progress * total;
    var segment = 0;
    while (segment < lengths.length - 1 && wanted > lengths[segment]) {
      wanted -= lengths[segment];
      segment += 1;
    }
    var part = lengths[segment] ? wanted / lengths[segment] : 0;
    var position = cubicPoint(points[segment], curves[segment].first, curves[segment].second, ends[segment + 1], part);
    graphContext.save();
    graphContext.globalAlpha = alpha;
    graphContext.fillStyle = color === graphColors.ember ? graphColors.ember : graphColors.violet;
    graphContext.strokeStyle = graphColors.panel;
    graphContext.lineWidth = 2;
    graphContext.beginPath();
    graphContext.arc(position.x, position.y, graphCompact() ? 3.5 : 4.5, 0, Math.PI * 2);
    graphContext.stroke();
    graphContext.fill();
    graphContext.restore();
  }

  var graphDrain = 1;

  function smoothStep(value) {
    return value * value * (3 - 2 * value);
  }

  function singleProgress(localTime, delay, launch, travel) {
    var active = localTime - delay;
    if (active <= 0 || active < launch || active >= launch + travel) return -1;
    return (active - launch) / travel;
  }

  function singleFill(localTime, delay, launches, travel) {
    var active = localTime - delay;
    if (active <= 0) return 0;
    return graphDrain * launches.reduce(function (filled, launch) {
      return filled + smoothStep(clamp01((active - launch - travel) / 260));
    }, 0);
  }

  function drawLegend(scene, alpha) {
    var legends = [
      [[graphColors.gold, 'compression block', 'compress']],
      [[graphColors.violet, 'raster transform', 'transform'], [graphColors.gold, 'compression block', 'compress']],
      [[graphColors.violet, 'raster transform', 'transform'], [graphColors.mint, 'stream split', 'split'], [graphColors.ember, 'nodata route', 'nodata'], [graphColors.gold, 'compression block', 'compress']],
      [[graphColors.violet, 'raster transform', 'transform'], [graphColors.mint, 'stream split', 'split'], [graphColors.ember, 'nodata route', 'nodata'], [graphColors.gold, 'compression block', 'compress']]
    ];
    var items = legends[graphScenes[scene].legendIndex];
    var compact = graphCompact();
    items.forEach(function (item, index) {
      var x = 8;
      var y = (compact ? 58 : 48) + index * (compact ? 16 : 18);
      graphContext.save();
      graphContext.globalAlpha = alpha;
      graphContext.fillStyle = item[0];
      graphContext.fillRect(x, y - 4, 8, 8);
      graphContext.restore();
      var label = compact ? item[2] : item[1];
      drawScreenText(label, x + 13, y, graphColors.dim, compact ? 7.3 : 9.2, 'left', alpha, 500);
    });
  }

  function drawDataset(scene, alpha) {
    var compact = graphCompact();
    var item = graphScenes[scene];
    var x = compact ? 8 : graphWidth - 8;
    var align = compact ? 'left' : 'right';
    drawScreenText(item.dataset, x, compact ? 18 : 22, graphColors.ink, compact ? 11 : 16, align, alpha, 650);
    drawScreenText(item.datatype, x, compact ? 35 : 43, graphColors.dim, compact ? 8 : 10.5, align, alpha, 500);
  }

  function drawBaseline(alpha, localTime) {
    var compact = graphCompact();
    var input = {x:graphWidth * (compact ? 0.70 : 0.33),y:graphHeight * (compact ? 0.18 : 0.28)};
    var entropy = {x:graphWidth * (compact ? 0.38 : 0.59),y:graphHeight * 0.52,w:compact ? 58 : 90,h:31,label:'entropy',color:graphColors.gold};
    var output = {x:graphWidth * (compact ? 0.68 : 0.84),y:graphHeight * (compact ? 0.82 : 0.74),h:68};
    var launches = [0,450,900];
    var delay = 900;
    var travel = 3000;
    drawLine(input,entropy,graphColors.edge,alpha,false);
    drawLine(entropy,output,graphColors.edge,alpha,false);
    launches.forEach(function (launch) {
      drawToken([input,entropy,output],singleProgress(localTime,delay,launch,travel),graphColors.soft,alpha);
    });
    drawTile(input.x,input.y,'classes',alpha);
    drawNode(entropy, alpha);
    drawFrame(output.x,output.y,68,[graphColors.soft],alpha,[singleFill(localTime,delay,launches,travel)],['P1']);
  }

  function drawSpatial(alpha, localTime) {
    var compact = graphCompact();
    var input = {x:graphWidth * (compact ? 0.68 : 0.33),y:graphHeight * (compact ? 0.18 : 0.23)};
    var nodes = [
      {x:graphWidth * (compact ? 0.65 : 0.55),y:graphHeight * 0.34,w:compact ? 50 : 76,h:31,label:'planar',color:graphColors.violet},
      {x:graphWidth * (compact ? 0.36 : 0.76),y:graphHeight * 0.49,w:compact ? 48 : 72,h:31,label:'zigzag',color:graphColors.dim},
      {x:graphWidth * (compact ? 0.30 : 0.55),y:graphHeight * 0.69,w:compact ? 54 : 82,h:31,label:'entropy',color:graphColors.gold}
    ];
    var output = {x:graphWidth * (compact ? 0.65 : 0.84),y:graphHeight * 0.83,h:78};
    var launches = [0,450,900];
    var delay = 900;
    var travel = 3000;
    var points = [input];
    drawLine(input,nodes[0],graphColors.edge,alpha,false);
    nodes.forEach(function (node, index) {
      points.push(node);
      var next = nodes[index + 1];
      if (next) drawLine(node,next,graphColors.edge,alpha,false);
    });
    drawLine(nodes[2],output,graphColors.edge,alpha,false);
    points.push(output);
    launches.forEach(function (launch) {
      drawToken(points,singleProgress(localTime,delay,launch,travel),graphColors.soft,alpha);
    });
    drawTile(input.x,input.y,'dem',alpha);
    nodes.forEach(function (node) { drawNode(node,alpha); });
    drawFrame(output.x,output.y,78,[graphColors.soft],alpha,[singleFill(localTime,delay,launches,travel)],['P1']);
  }

  function drawNodata(alpha, localTime) {
    var compact = graphCompact();
    var input = {x:graphWidth * 0.60,y:graphHeight * 0.18};
    var nodata = {x:graphWidth * 0.64,y:graphHeight * 0.37,w:compact ? 52 : 78,h:34,label:'nodata',color:graphColors.mint};
    var planar = {x:graphWidth * 0.41,y:graphHeight * 0.50,w:compact ? 48 : 70,h:30,label:'planar',color:graphColors.violet};
    var zigzag = {x:graphWidth * 0.30,y:graphHeight * 0.66,w:compact ? 45 : 66,h:30,label:'zigzag',color:graphColors.dim};
    var entropy = {x:graphWidth * 0.26,y:graphHeight * 0.83,w:compact ? 52 : 76,h:30,label:'entropy',color:graphColors.gold};
    var generic = {x:graphWidth * 0.80,y:graphHeight * 0.65,w:compact ? 55 : 112,h:30,label:'compress generic',short:'generic',color:graphColors.gold};
    var output = {x:graphWidth * 0.56,y:graphHeight * 0.86};
    var outputOffset = compact ? 7 : 12;
    var valueOutput = {x:output.x - outputOffset,y:output.y,h:94};
    var maskOutput = {x:output.x + outputOffset,y:output.y,h:94};
    var valueLaunches = [0,450,900];
    var maskLaunches = [300,750,1200];
    var delay = 900;
    var travel = 3000;
    drawLine(input,nodata,graphColors.edge,alpha,false);
    drawLine(nodata,planar,graphColors.mint,alpha,false);
    drawLine(nodata,generic,graphColors.ember,alpha,false);
    drawLine(planar,zigzag,graphColors.edge,alpha,false);
    drawLine(zigzag,entropy,graphColors.edge,alpha,false);
    drawLine(entropy,valueOutput,graphColors.edge,alpha,false);
    drawLine(generic,maskOutput,graphColors.ember,alpha,false);
    valueLaunches.forEach(function (launch) {
      drawToken([input,nodata,planar,zigzag,entropy,valueOutput],singleProgress(localTime,delay,launch,travel),graphColors.soft,alpha);
    });
    maskLaunches.forEach(function (launch) {
      drawToken([nodata,generic,maskOutput],singleProgress(localTime,delay,launch,travel),graphColors.ember,alpha);
    });
    drawTile(input.x,input.y,'nodata',alpha);
    [nodata,planar,zigzag,entropy,generic].forEach(function (node) { drawNode(node,alpha); });
    drawFrame(output.x,output.y,94,[graphColors.soft,graphColors.soft],alpha,[singleFill(localTime,delay,valueLaunches,travel),singleFill(localTime,delay,maskLaunches,travel)],['V','M']);
  }

  function drawComplex(alpha, localTime) {
    var compact = graphCompact();
    var input = {x:graphWidth * 0.60,y:graphHeight * 0.18};
    var split = {x:graphWidth * 0.60,y:graphHeight * 0.34,w:compact ? 48 : 76,h:35,label:'deinterleave',short:'deint',color:graphColors.mint};
    var realNd = {x:graphWidth * 0.33,y:graphHeight * 0.46,w:compact ? 44 : 68,h:30,label:'nodata',color:graphColors.mint};
    var imagNd = {x:graphWidth * 0.85,y:graphHeight * 0.46,w:compact ? 44 : 68,h:30,label:'nodata',color:graphColors.mint};
    var realQ = {x:graphWidth * 0.25,y:graphHeight * 0.60,w:compact ? 45 : 72,h:30,label:'quant linear',short:'quant',color:graphColors.violet};
    var imagQ = {x:graphWidth * 0.86,y:graphHeight * 0.60,w:compact ? 45 : 72,h:30,label:'quant linear',short:'quant',color:graphColors.violet};
    var realP = {x:graphWidth * 0.21,y:graphHeight * 0.73,w:compact ? 40 : 62,h:30,label:'planar',color:graphColors.violet};
    var imagP = {x:graphWidth * 0.80,y:graphHeight * 0.73,w:compact ? 40 : 62,h:30,label:'planar',color:graphColors.violet};
    var realE = {x:graphWidth * 0.29,y:graphHeight * 0.86,w:compact ? 44 : 68,h:30,label:'entropy',color:graphColors.gold};
    var imagE = {x:graphWidth * 0.72,y:graphHeight * 0.86,w:compact ? 44 : 68,h:30,label:'entropy',color:graphColors.gold};
    var realMask = {x:graphWidth * 0.45,y:graphHeight * 0.64,w:compact ? 43 : 64,h:24,label:'generic',color:graphColors.gold};
    var imagMask = {x:graphWidth * 0.60,y:graphHeight * 0.64,w:compact ? 43 : 64,h:24,label:'generic',color:graphColors.gold};
    var output = {x:graphWidth * 0.53,y:graphHeight * 0.85};
    var outputOffset = compact ? 10 : 18;
    var maskOffset = compact ? 3.5 : 6;
    var realOutput = {x:output.x - outputOffset,y:output.y,h:96};
    var imagOutput = {x:output.x + outputOffset,y:output.y,h:96};
    var realMaskOutput = {x:output.x - maskOffset,y:output.y,h:96};
    var imagMaskOutput = {x:output.x + maskOffset,y:output.y,h:96};

    drawLine(input,split,graphColors.edge,alpha,false);
    drawLine(split,realNd,graphColors.mint,alpha,false);
    drawLine(split,imagNd,graphColors.violet,alpha,false);
    [[realNd,realQ,realP,realE],[imagNd,imagQ,imagP,imagE]].forEach(function (lane) {
      for (var i = 0; i < lane.length - 1; i += 1) drawLine(lane[i],lane[i + 1],graphColors.edge,alpha,false);
    });
    drawLine(realNd,realMask,graphColors.ember,alpha,false);
    drawLine(imagNd,imagMask,graphColors.ember,alpha,false);
    drawLine(realE,realOutput,graphColors.edge,alpha,false);
    drawLine(imagE,imagOutput,graphColors.edge,alpha,false);
    drawLine(realMask,realMaskOutput,graphColors.ember,alpha,false);
    drawLine(imagMask,imagMaskOutput,graphColors.ember,alpha,false);

    var batchDelay = 900;
    var travel = 3000;
    var realLaunches = [0,450,900];
    var imagLaunches = [225,675,1125];
    var realMaskLaunches = [600,1050,1500];
    var imagMaskLaunches = [825,1275,1725];
    var payloadFill = [
      singleFill(localTime,batchDelay,realLaunches,travel),
      singleFill(localTime,batchDelay,realMaskLaunches,travel),
      singleFill(localTime,batchDelay,imagLaunches,travel),
      singleFill(localTime,batchDelay,imagMaskLaunches,travel)
    ];
    var realPath = [input,split,realNd,realQ,realP,realE,realOutput];
    var imagPath = [split,imagNd,imagQ,imagP,imagE,imagOutput];
    var realMaskPath = [realNd,realMask,realMaskOutput];
    var imagMaskPath = [imagNd,imagMask,imagMaskOutput];
    realLaunches.forEach(function (launch, index) {
      drawToken(realPath,singleProgress(localTime,batchDelay,launch,travel),graphColors.soft,alpha);
      drawToken(imagPath,singleProgress(localTime,batchDelay,imagLaunches[index],travel),graphColors.soft,alpha);
    });
    realMaskLaunches.forEach(function (launch, index) {
      drawToken(realMaskPath,singleProgress(localTime,batchDelay,launch,travel),graphColors.ember,alpha);
      drawToken(imagMaskPath,singleProgress(localTime,batchDelay,imagMaskLaunches[index],travel),graphColors.ember,alpha);
    });
    drawTile(input.x,input.y,'complex',alpha);
    [split,realNd,imagNd,realQ,imagQ,realP,imagP,realE,imagE,realMask,imagMask].forEach(function (node) { drawNode(node,alpha); });
    drawFrame(output.x,output.y,96,[graphColors.soft,graphColors.soft,graphColors.soft,graphColors.soft],alpha,payloadFill,['R','RM','I','IM']);
  }

  function setGraphCopy(index) {
    if (graphSceneShown === index) return;
    graphSceneShown = index;
    graphCaption.textContent = graphScenes[index].caption;
  }

  function drawGraphScene(index, alpha, localTime) {
    activeGraphScene = index;
    graphScenes[index].draw(alpha, localTime || 0);
    drawLegend(index, alpha);
    drawDataset(index, alpha);
  }

  function renderGraphFrame(elapsed) {
    graphContext.clearRect(0, 0, graphWidth, graphHeight);
    var duration = graphScenes[activeGraphScene].animationDuration;
    var entrance = smoothStep(clamp01((performance.now() - graphShownAt) / 360));
    graphDrain = 1 - smoothStep(clamp01((elapsed - (duration - 600)) / 600));
    drawGraphScene(activeGraphScene, reduceMotion ? 1 : entrance, elapsed);
  }

  function renderGraph(now) {
    var duration = graphScenes[activeGraphScene].animationDuration;
    graphSceneElapsed = now - graphSceneStart;
    if (graphSceneElapsed >= duration) {
      graphSceneElapsed %= duration;
      graphSceneStart = now - graphSceneElapsed;
    }
    renderGraphFrame(graphSceneElapsed);
    graphRaf = window.requestAnimationFrame(renderGraph);
  }

  function selectGraph(index) {
    index = ((Number(index) || 0) % graphScenes.length + graphScenes.length) % graphScenes.length;
    activeGraphScene = index;
    var item = graphScenes[index];
    graphAnnouncement.textContent = 'Graph ' + (index + 1) + ' of ' + graphScenes.length + ': ' + item.dataset + ', ' + item.datatype + '.';
    graphSteps.forEach(function (step, stepIndex) {
      step.classList.toggle('is-active', stepIndex === index);
      if (stepIndex === index) step.setAttribute('aria-current', 'true');
      else step.removeAttribute('aria-current');
    });
    setGraphCopy(index);
    window.cancelAnimationFrame(graphRaf);
    graphRaf = 0;
    graphSceneElapsed = reduceMotion ? item.animationDuration - 650 : 0;
    if (reduceMotion) {
      renderGraphFrame(graphSceneElapsed);
    } else {
      graphSceneStart = performance.now();
      graphShownAt = graphSceneStart;
      renderGraphFrame(0);
      graphRaf = window.requestAnimationFrame(renderGraph);
    }
  }

  resizeGraph();
  selectGraph(0);

  graphPrevious.addEventListener('click', function () {
    selectGraph(activeGraphScene - 1);
  });

  graphNext.addEventListener('click', function () {
    selectGraph(activeGraphScene + 1);
  });

  document.addEventListener('keydown', function (event) {
    if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.target.closest('input, textarea, select, [contenteditable]')) return;
    if (event.key === 'ArrowLeft') selectGraph(activeGraphScene - 1);
    else if (event.key === 'ArrowRight') selectGraph(activeGraphScene + 1);
  });

  graphSteps.forEach(function (step) {
    step.addEventListener('click', function () {
      selectGraph(step.getAttribute('data-graph-scene'));
    });
  });

  window.addEventListener('resize', function () {
    resizeGraph();
    renderGraphFrame(graphSceneElapsed);
  }, { passive: true });

  window.addEventListener('pagehide', function () {
    window.cancelAnimationFrame(graphRaf);
  });
})();
</script>
</body>
</html>
