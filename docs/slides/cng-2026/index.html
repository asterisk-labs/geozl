<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg', VIOLET = '#492ae8', INK = '#17161C', P2 = '#F4F4F5', WIRE = '#8A8F98';
  var GEO = { planar: 1, med: 1, average: 1, wp_static: 1, delta_w: 1, pfor: 1, nodata: 1 };
  var COLOR = { zigzag: '#f7cc09', transpose: '#c4ffc2', entropy: '#FFFFFF', zstd: '#D6D3D1', split: '#BFC5CE' };
  function fillOf(n) { return GEO[n] ? VIOLET : (COLOR[n] || P2); }
  function textOf(n) { return GEO[n] ? '#fff' : INK; }
  function chain(names) {
    return { nodes: names.map(function (n, i) { return { id: 'n' + i, name: n, col: i, row: 0 }; }),
             edges: names.slice(1).map(function (_, i) { return ['n' + i, 'n' + (i + 1)]; }) };
  }
  // best GeoZL graph with at most three codecs, ec-benchmark; IMERG is the rain scheme in imerg/
  var SCENES = [
    { name: 'Sentinel-2',     tile: 'assets/img/tiles/t01.jpg', ratio: '2.03× smaller', g: chain(['med', 'zigzag', 'entropy']) },
    { name: 'Copernicus DEM', tile: 'assets/img/tiles/t03.jpg', ratio: '6.13× smaller', g: chain(['wp_static', 'zigzag', 'entropy']) },
    { name: 'GPM IMERG',      tile: 'assets/img/tiles/t13.jpg', ratio: '14.1× smaller', g: {
        nodes: [ { id: 's', name: 'split', col: 0, row: 0 }, { id: 'm', name: 'med', col: 1, row: 1 }, { id: 'e', name: 'entropy', col: 2, row: 0 } ],
        edges: [ ['s', 'e'], ['s', 'm'], ['m', 'e'] ] } }
  ];
  var L = [212, 372, 532], W = 96, H = 28, FCY = 174, BCY = 318, ROW = 32, T = 8.8;

  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function seg(t, a, b) { return ease((t - a) / (b - a)); }
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function cyOf(n, base) { return base + n.row * ROW; }
  function link(x1, y1, x2, y2) {
    if (y1 === y2) return 'M ' + x1 + ' ' + y1 + ' H ' + x2;
    var m = (x1 + x2) / 2;
    return 'M ' + x1 + ' ' + y1 + ' C ' + m + ' ' + y1 + ', ' + m + ' ' + y2 + ', ' + x2 + ' ' + y2;
  }

  function start(svg) {
    var slide = svg.closest('.slide'), dyn = svg.querySelector('#hiw-dyn');
    var pin = svg.querySelector('g#hiw-in'), pframe = svg.querySelector('g#hiw-frame'), pout = svg.querySelector('g#hiw-out');
    var ratio = svg.querySelector('#hiw-ratio');
    var pfwd = svg.querySelector('g#hiw-fwd'), pback = svg.querySelector('g#hiw-back');
    var pool = {};
    svg.querySelectorAll('.pc').forEach(function (g) { pool[g.dataset.name] = g; });
    var items = [], picked = {}, raf = null, t0 = 0, idx = 0;

    // a wire that draws itself, with its own arrowhead that arrives at the end
    function wire(layer, d, a, opts) {
      opts = opts || {};
      var col = opts.colour || WIRE, p = el('path', { d: d, fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, layer);
      var len = p.getTotalLength(), end = p.getPointAtLength(len), pre = p.getPointAtLength(Math.max(0, len - 1));
      var ang = Math.atan2(end.y - pre.y, end.x - pre.x) * 180 / Math.PI;
      var head = el('path', { d: 'M -7 -4.5 L 0 0 L -7 4.5 Z', fill: col, transform: 'translate(' + end.x + ' ' + end.y + ') rotate(' + ang + ')' }, layer);
      if (opts.dashed) p.setAttribute('stroke-dasharray', '6 6');
      items.push(function (t) {
        var k = seg(t, a, a + (opts.dur || .45)), out = 1 - seg(t, 7.3, 7.8);
        if (opts.dashed) { p.style.opacity = k * out; }
        else { p.style.strokeDasharray = len; p.style.strokeDashoffset = len * (1 - k); p.style.opacity = out; }
        head.style.opacity = clamp((k - .8) / .2) * out;
      });
    }
    // data travelling the whole route without stopping, passing under the codecs
    function route(layer, d, a, b) {
      var p = el('path', { d: d, fill: 'none', stroke: 'none' }, layer), len = p.getTotalLength();
      var c = el('circle', { r: 6, fill: VIOLET, opacity: 0 }, layer);
      items.push(function (t) {
        var u = clamp((t - a) / (b - a)), pt = p.getPointAtLength(ease(u) * len);
        c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
        c.setAttribute('opacity', t > a && t < b ? Math.min(1, u / .05, (1 - u) / .05) : 0);
      });
    }
    function chipAt(layer, x, y, name, fill, tcol) {
      var g = el('g', {}, layer), light = fill === '#FFFFFF' || fill === P2;
      el('rect', { x: x, y: y, width: W, height: H, rx: 4, fill: fill, stroke: light ? INK : 'none', 'stroke-width': light ? 1.5 : 0 }, g);
      var tx = el('text', { x: x + W / 2, y: y + 19, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 600, fill: tcol }, g);
      tx.textContent = name;
      return g;
    }

    function build(sc) {
      dyn.innerHTML = ''; items = []; picked = {};
      var wires = el('g', {}, dyn), dots = el('g', {}, dyn), chips = el('g', {}, dyn), head = el('g', {}, dyn);
      var nodes = sc.g.nodes, edges = sc.g.edges, byId = {}, maxc = 0;
      nodes.forEach(function (n) { byId[n.id] = n; maxc = Math.max(maxc, n.col); picked[n.name] = 1; });
      svg.querySelector('#hiw-name').textContent = sc.name;
      svg.querySelector('#hiw-tile').setAttribute('href', sc.tile);
      svg.querySelector('#hiw-tile2').setAttribute('href', sc.tile);
      ratio.textContent = sc.ratio;

      // forward: the codecs fly out of the pool, one after the other
      nodes.forEach(function (n, i) {
        var p = pool[n.name], px = +p.dataset.x, py = +p.dataset.y, tx = L[n.col], ty = cyOf(n, FCY) - H / 2;
        var g = el('g', {}, chips);
        var a = chipAt(g, px, py, n.name, GEO[n.name] ? VIOLET : P2, textOf(n.name));
        var b = chipAt(g, px, py, n.name, fillOf(n.name), textOf(n.name));
        var s0 = .35 + i * .16;
        items.push(function (t) {
          var k = seg(t, s0, s0 + .95) * (1 - seg(t, 7.3, 8.2));
          g.setAttribute('transform', 'translate(' + (tx - px) * k + ' ' + (ty - py) * k + ')');
          var c = clamp((k - .45) / .55); b.style.opacity = c; a.style.opacity = 1 - c;
        });
      });
      // forward wires
      nodes.filter(function (n) { return n.col === 0; }).forEach(function (n) { wire(wires, link(152, FCY, L[0] - 3, cyOf(n, FCY)), 1.25); });
      edges.forEach(function (e, i) {
        var a = byId[e[0]], b = byId[e[1]];
        wire(wires, link(L[a.col] + W, cyOf(a, FCY), L[b.col] - 3, cyOf(b, FCY)), 1.35 + i * .1);
      });
      var last = nodes.filter(function (n) { return n.col === maxc; })[0];
      wire(wires, 'M ' + (L[maxc] + W) + ' ' + FCY + ' H 659', 1.6);
      wire(wires, 'M 735 188 V 237', 1.75);
      // the data, one continuous run per branch
      var tail = ' H 723 Q 735 ' + FCY + ' 735 ' + (FCY + 12) + ' V 252';
      var mids = nodes.filter(function (n) { return n.row !== 0; });
      route(dots, 'M 152 ' + FCY + ' H ' + (L[maxc] + W) + tail, 1.7, 3.2);
      mids.forEach(function (m) {
        var y = cyOf(m, FCY);
        route(dots, 'M 152 ' + FCY + ' H ' + (L[0] + W) + ' ' + link(L[0] + W, FCY, L[m.col], y).replace(/^M [^C]*C/, 'C') +
                    ' H ' + (L[m.col] + W) + ' ' + link(L[m.col] + W, y, L[maxc], FCY).replace(/^M [^C]*C/, 'C') + ' H ' + (L[maxc] + W) + tail, 1.7, 3.2);
      });
      // the frame, and the graph written into its header
      items.push(function (t) {
        var out = 1 - seg(t, 7.3, 7.8);
        pin.style.opacity = seg(t, 0, .5) * (1 - seg(t, 7.3, 7.7));
        pframe.style.opacity = seg(t, 2.9, 3.3) * out;
        pfwd.style.opacity = seg(t, 1.1, 1.5) * out;
        pback.style.opacity = seg(t, 3.45, 3.85) * out;
        ratio.style.opacity = seg(t, 3.2, 3.6) * out;
        pout.style.opacity = seg(t, 5.55, 5.95) * (1 - seg(t, 7.3, 7.7));
      });
      nodes.slice().sort(function (a, b) { return a.col - b.col || a.row - b.row; }).forEach(function (n, i) {
        var x = 232 + i * 34, r = el('rect', { x: x, y: 246, width: 18, height: 18, rx: 4, fill: fillOf(n.name) }, head);
        items.push(function (t) {
          var k = seg(t, 3.05 + i * .12, 3.35 + i * .12) * (1 - seg(t, 7.3, 7.8));
          r.style.opacity = k;
          r.setAttribute('transform', 'translate(' + (x + 9) + ' 255) scale(' + (.5 + .5 * k) + ') translate(' + -(x + 9) + ' -255)');
        });
      });

      // backward: the same codecs inverted, right under their forward twins, run right to left
      wire(wires, 'M 340 272 V 303', 3.35, { colour: VIOLET, dashed: true });
      wire(wires, 'M 735 272 V ' + (BCY - 12) + ' Q 735 ' + BCY + ' 723 ' + BCY + ' H ' + (L[maxc] + W + 3), 3.4);
      nodes.slice().sort(function (a, b) { return b.col - a.col; }).forEach(function (n, j) {
        var g = chipAt(chips, L[n.col], cyOf(n, BCY) - H / 2, n.name + '⁻¹', fillOf(n.name), textOf(n.name));
        var cx = L[n.col] + W / 2, cy = cyOf(n, BCY), s0 = 3.6 + j * .16;
        items.push(function (t) {
          var k = seg(t, s0, s0 + .35) * (1 - seg(t, 7.3, 7.8));
          g.style.opacity = k;
          g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + (.85 + .15 * k) + ') translate(' + -cx + ' ' + -cy + ')');
        });
      });
      edges.forEach(function (e, i) {
        var a = byId[e[0]], b = byId[e[1]];
        wire(wires, link(L[b.col], cyOf(b, BCY), L[a.col] + W + 3, cyOf(a, BCY)), 3.85 + i * .1);
      });
      wire(wires, 'M ' + L[0] + ' ' + BCY + ' H 152', 4.1);
      var btail = 'M 735 272 V ' + (BCY - 12) + ' Q 735 ' + BCY + ' 723 ' + BCY;
      route(dots, btail + ' H 150', 4.25, 5.7);
      mids.forEach(function (m) {
        var y = cyOf(m, BCY);
        route(dots, btail + ' H ' + L[maxc] + ' ' + link(L[maxc], BCY, L[m.col] + W, y).replace(/^M [^C]*C/, 'C') +
                    ' H ' + L[m.col] + ' ' + link(L[m.col], y, L[0] + W, BCY).replace(/^M [^C]*C/, 'C') + ' H 150', 4.25, 5.7);
      });

      // the pool: picked codecs get a ring, then dim while they are out
      items.push(function (t) {
        Object.keys(pool).forEach(function (n) {
          var g = pool[n], r = g.querySelector('rect');
          if (picked[n]) {
            g.style.opacity = 1 - .82 * (seg(t, .7, 1.1) - seg(t, 7.7, 8.2));
            r.setAttribute('stroke', INK);
            r.setAttribute('stroke-width', 3 * seg(t, 0, .35) * (1 - seg(t, 7.3, 7.6)));
          } else {
            g.style.opacity = 1;
            r.setAttribute('stroke', GEO[n] ? 'none' : '#E7E5E4');
            r.setAttribute('stroke-width', 1);
          }
        });
      });
    }

    function render(t) { for (var i = 0; i < items.length; i++) items[i](t); }
    var HOLD = 7.2;   // the last dataset stays on screen, complete, for the explanation
    function frame(now) {
      var t = (now - t0) / 1000;
      if (idx === SCENES.length - 1 && t >= HOLD) { render(HOLD); raf = null; return; }
      if (t > T) { idx += 1; build(SCENES[idx]); t0 = now; t = 0; }
      render(t);
      raf = requestAnimationFrame(frame);
    }
    function play() { stop(); idx = 0; build(SCENES[0]); t0 = performance.now(); raf = requestAnimationFrame(frame); }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = null; }
    // for checking a single moment while authoring: window.__hiwSeek(scene, seconds)
    window.__hiwSeek = function (i, t) { stop(); idx = i; build(SCENES[i]); render(t); };
    function sync() { if (slide.classList.contains('active')) play(); else stop(); }
    new MutationObserver(sync).observe(slide, { attributes: true, attributeFilter: ['class'] });
    sync();
  }

  var svg = document.getElementById('hiw');
  if (svg) start(svg);
})();
</script>

      <line x1="60" y1="232" x2="788" y2="232" stroke="#E7E5E4" stroke-width="1.5"/>
      <path d="M 244 60 Q 330 70 364 168" fill="none" stroke="#17161C" stroke-width="2.5" marker-end="url(#fr-arrow)"/><text x="352" y="104" font-size="26" font-weight="700" fill="#492ae8">10&#215; faster</text>
