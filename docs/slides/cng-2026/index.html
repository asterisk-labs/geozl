<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg', VIOLET = '#492ae8', INK = '#17161C', P2 = '#F4F4F5', WIRE = '#8A8F98';
  var GEO = { planar: 1, med: 1, average: 1, wp_static: 1, delta_w: 1, pfor: 1, nodata: 1 };
  var COLOR = { zigzag: '#f7cc09', transpose: '#c4ffc2', entropy: '#FFFFFF', zstd: '#D6D3D1', split: '#BFC5CE' };
  function fillOf(n) { return GEO[n] ? VIOLET : (COLOR[n] || P2); }
  function textOf(n) { return GEO[n] ? '#fff' : INK; }
  function chain(names) {
    return { nodes: names.map(function (n, i) { return { id: 'n' + i, name: n, col: i, row: 0 }; }),
             edges: names.slice(1).map(function (_, i) { return ['n' + i, 'n' + (i + 1)]; }) };
  }
  // best GeoZL graph with at most three codecs, ec-benchmark; IMERG is the rain scheme in imerg/
  var SCENES = [
    { name: 'Sentinel-2',     tile: 'assets/img/tiles/t01.jpg', ratio: '2.03× smaller', g: chain(['med', 'zigzag', 'entropy']) },
    { name: 'Copernicus DEM', tile: 'assets/img/tiles/t03.jpg', ratio: '6.13× smaller', g: chain(['wp_static', 'zigzag', 'entropy']) },
    { name: 'GPM IMERG',      tile: 'assets/img/tiles/t13.jpg', ratio: '14.1× smaller', g: {
        nodes: [ { id: 's', name: 'split', col: 0, row: 0 }, { id: 'm', name: 'med', col: 1, row: 1 }, { id: 'e', name: 'entropy', col: 2, row: 0 } ],
        edges: [ ['s', 'e'], ['s', 'm'], ['m', 'e'] ] } }
  ];
  var L = [212, 372, 532], W = 96, H = 28, FCY = 174, BCY = 318, ROW = 32, T = 8.8;

  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function seg(t, a, b) { return ease((t - a) / (b - a)); }
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function cyOf(n, base) { return base + n.row * ROW; }
  function link(x1, y1, x2, y2) {
    if (y1 === y2) return 'M ' + x1 + ' ' + y1 + ' H ' + x2;
    var m = (x1 + x2) / 2;
    return 'M ' + x1 + ' ' + y1 + ' C ' + m + ' ' + y1 + ', ' + m + ' ' + y2 + ', ' + x2 + ' ' + y2;
  }

  function start(svg) {
    var slide = svg.closest('.slide'), dyn = svg.querySelector('#hiw-dyn');
    var pin = svg.querySelector('g#hiw-in'), pframe = svg.querySelector('g#hiw-frame'), pout = svg.querySelector('g#hiw-out');
    var ratio = svg.querySelector('#hiw-ratio');
    var pfwd = svg.querySelector('g#hiw-fwd'), pback = svg.querySelector('g#hiw-back');
    var pool = {};
    svg.querySelectorAll('.pc').forEach(function (g) { pool[g.dataset.name] = g; });
    var items = [], picked = {}, raf = null, t0 = 0, idx = 0;

    // a wire that draws itself, with its own arrowhead that arrives at the end
    function wire(layer, d, a, opts) {
      opts = opts || {};
      var col = opts.colour || WIRE, p = el('path', { d: d, fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, layer);
      var len = p.getTotalLength(), end = p.getPointAtLength(len), pre = p.getPointAtLength(Math.max(0, len - 1));
      var ang = Math.atan2(end.y - pre.y, end.x - pre.x) * 180 / Math.PI;
      var head = el('path', { d: 'M -7 -4.5 L 0 0 L -7 4.5 Z', fill: col, transform: 'translate(' + end.x + ' ' + end.y + ') rotate(' + ang + ')' }, layer);
      if (opts.dashed) p.setAttribute('stroke-dasharray', '6 6');
      items.push(function (t) {
        var k = seg(t, a, a + (opts.dur || .45)), out = 1 - seg(t, 7.3, 7.8);
        if (opts.dashed) { p.style.opacity = k * out; }
        else { p.style.strokeDasharray = len; p.style.strokeDashoffset = len * (1 - k); p.style.opacity = out; }
        head.style.opacity = clamp((k - .8) / .2) * out;
      });
    }
    // data travelling the whole route without stopping, passing under the codecs
    function route(layer, d, a, b) {
      var p = el('path', { d: d, fill: 'none', stroke: 'none' }, layer), len = p.getTotalLength();
      var c = el('circle', { r: 6, fill: VIOLET, opacity: 0 }, layer);
      items.push(function (t) {
        var u = clamp((t - a) / (b - a)), pt = p.getPointAtLength(ease(u) * len);
        c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
        c.setAttribute('opacity', t > a && t < b ? Math.min(1, u / .05, (1 - u) / .05) : 0);
      });
    }
    function chipAt(layer, x, y, name, fill, tcol) {
      var g = el('g', {}, layer), light = fill === '#FFFFFF' || fill === P2;
      el('rect', { x: x, y: y, width: W, height: H, rx: 4, fill: fill, stroke: light ? INK : 'none', 'stroke-width': light ? 1.5 : 0 }, g);
      var tx = el('text', { x: x + W / 2, y: y + 19, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 600, fill: tcol }, g);
      tx.textContent = name;
      return g;
    }

    function build(sc) {
      dyn.innerHTML = ''; items = []; picked = {};
      var wires = el('g', {}, dyn), dots = el('g', {}, dyn), chips = el('g', {}, dyn), head = el('g', {}, dyn);
      var nodes = sc.g.nodes, edges = sc.g.edges, byId = {}, maxc = 0;
      nodes.forEach(function (n) { byId[n.id] = n; maxc = Math.max(maxc, n.col); picked[n.name] = 1; });
      svg.querySelector('#hiw-name').textContent = sc.name;
      svg.querySelector('#hiw-tile').setAttribute('href', sc.tile);
      svg.querySelector('#hiw-tile2').setAttribute('href', sc.tile);
      ratio.textContent = sc.ratio;

      // forward: the codecs fly out of the pool, one after the other
      nodes.forEach(function (n, i) {
        var p = pool[n.name], px = +p.dataset.x, py = +p.dataset.y, tx = L[n.col], ty = cyOf(n, FCY) - H / 2;
        var g = el('g', {}, chips);
        var a = chipAt(g, px, py, n.name, GEO[n.name] ? VIOLET : P2, textOf(n.name));
        var b = chipAt(g, px, py, n.name, fillOf(n.name), textOf(n.name));
        var s0 = .35 + i * .16;
        items.push(function (t) {
          var k = seg(t, s0, s0 + .95) * (1 - seg(t, 7.3, 8.2));
          g.setAttribute('transform', 'translate(' + (tx - px) * k + ' ' + (ty - py) * k + ')');
          var c = clamp((k - .45) / .55); b.style.opacity = c; a.style.opacity = 1 - c;
        });
      });
      // forward wires
      nodes.filter(function (n) { return n.col === 0; }).forEach(function (n) { wire(wires, link(152, FCY, L[0] - 3, cyOf(n, FCY)), 1.25); });
      edges.forEach(function (e, i) {
        var a = byId[e[0]], b = byId[e[1]];
        wire(wires, link(L[a.col] + W, cyOf(a, FCY), L[b.col] - 3, cyOf(b, FCY)), 1.35 + i * .1);
      });
      var last = nodes.filter(function (n) { return n.col === maxc; })[0];
      wire(wires, 'M ' + (L[maxc] + W) + ' ' + FCY + ' H 659', 1.6);
      wire(wires, 'M 735 188 V 237', 1.75);
      // the data, one continuous run per branch
      var tail = ' H 723 Q 735 ' + FCY + ' 735 ' + (FCY + 12) + ' V 252';
      var mids = nodes.filter(function (n) { return n.row !== 0; });
      route(dots, 'M 152 ' + FCY + ' H ' + (L[maxc] + W) + tail, 1.7, 3.2);
      mids.forEach(function (m) {
        var y = cyOf(m, FCY);
        route(dots, 'M 152 ' + FCY + ' H ' + (L[0] + W) + ' ' + link(L[0] + W, FCY, L[m.col], y).replace(/^M [^C]*C/, 'C') +
                    ' H ' + (L[m.col] + W) + ' ' + link(L[m.col] + W, y, L[maxc], FCY).replace(/^M [^C]*C/, 'C') + ' H ' + (L[maxc] + W) + tail, 1.7, 3.2);
      });
      // the frame, and the graph written into its header
      items.push(function (t) {
        var out = 1 - seg(t, 7.3, 7.8);
        pin.style.opacity = seg(t, 0, .5) * (1 - seg(t, 7.3, 7.7));
        pframe.style.opacity = seg(t, 2.9, 3.3) * out;
        pfwd.style.opacity = seg(t, 1.1, 1.5) * out;
        pback.style.opacity = seg(t, 3.45, 3.85) * out;
        ratio.style.opacity = seg(t, 3.2, 3.6) * out;
        pout.style.opacity = seg(t, 5.55, 5.95) * (1 - seg(t, 7.3, 7.7));
      });
      nodes.slice().sort(function (a, b) { return a.col - b.col || a.row - b.row; }).forEach(function (n, i) {
        var x = 232 + i * 34, r = el('rect', { x: x, y: 246, width: 18, height: 18, rx: 4, fill: fillOf(n.name) }, head);
        items.push(function (t) {
          var k = seg(t, 3.05 + i * .12, 3.35 + i * .12) * (1 - seg(t, 7.3, 7.8));
          r.style.opacity = k;
          r.setAttribute('transform', 'translate(' + (x + 9) + ' 255) scale(' + (.5 + .5 * k) + ') translate(' + -(x + 9) + ' -255)');
        });
      });

      // backward: the same codecs inverted, right under their forward twins, run right to left
      wire(wires, 'M 340 272 V 303', 3.35, { colour: VIOLET, dashed: true });
      wire(wires, 'M 735 272 V ' + (BCY - 12) + ' Q 735 ' + BCY + ' 723 ' + BCY + ' H ' + (L[maxc] + W + 3), 3.4);
      nodes.slice().sort(function (a, b) { return b.col - a.col; }).forEach(function (n, j) {
        var g = chipAt(chips, L[n.col], cyOf(n, BCY) - H / 2, n.name + '⁻¹', fillOf(n.name), textOf(n.name));
        var cx = L[n.col] + W / 2, cy = cyOf(n, BCY), s0 = 3.6 + j * .16;
        items.push(function (t) {
          var k = seg(t, s0, s0 + .35) * (1 - seg(t, 7.3, 7.8));
          g.style.opacity = k;
          g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + (.85 + .15 * k) + ') translate(' + -cx + ' ' + -cy + ')');
        });
      });
      edges.forEach(function (e, i) {
        var a = byId[e[0]], b = byId[e[1]];
        wire(wires, link(L[b.col], cyOf(b, BCY), L[a.col] + W + 3, cyOf(a, BCY)), 3.85 + i * .1);
      });
      wire(wires, 'M ' + L[0] + ' ' + BCY + ' H 152', 4.1);
      var btail = 'M 735 272 V ' + (BCY - 12) + ' Q 735 ' + BCY + ' 723 ' + BCY;
      route(dots, btail + ' H 150', 4.25, 5.7);
      mids.forEach(function (m) {
        var y = cyOf(m, BCY);
        route(dots, btail + ' H ' + L[maxc] + ' ' + link(L[maxc], BCY, L[m.col] + W, y).replace(/^M [^C]*C/, 'C') +
                    ' H ' + L[m.col] + ' ' + link(L[m.col], y, L[0] + W, BCY).replace(/^M [^C]*C/, 'C') + ' H 150', 4.25, 5.7);
      });

      // the pool: picked codecs get a ring, then dim while they are out
      items.push(function (t) {
        Object.keys(pool).forEach(function (n) {
          var g = pool[n], r = g.querySelector('rect');
          if (picked[n]) {
            g.style.opacity = 1 - .82 * (seg(t, .7, 1.1) - seg(t, 7.7, 8.2));
            r.setAttribute('stroke', INK);
            r.setAttribute('stroke-width', 3 * seg(t, 0, .35) * (1 - seg(t, 7.3, 7.6)));
          } else {
            g.style.opacity = 1;
            r.setAttribute('stroke', GEO[n] ? 'none' : '#E7E5E4');
            r.setAttribute('stroke-width', 1);
          }
        });
      });
    }

    function render(t) { for (var i = 0; i < items.length; i++) items[i](t); }
    var HOLD = 7.2;   // the last dataset stays on screen, complete, for the explanation
    function frame(now) {
      var t = (now - t0) / 1000;
      if (idx === SCENES.length - 1 && t >= HOLD) { render(HOLD); raf = null; return; }
      if (t > T) { idx += 1; build(SCENES[idx]); t0 = now; t = 0; }
      render(t);
      raf = requestAnimationFrame(frame);
    }
    function play() { stop(); idx = 0; build(SCENES[0]); t0 = performance.now(); raf = requestAnimationFrame(frame); }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = null; }
    // for checking a single moment while authoring: window.__hiwSeek(scene, seconds)
    window.__hiwSeek = function (i, t) { stop(); idx = i; build(SCENES[i]); render(t); };
    function sync() { if (slide.classList.contains('active')) play(); else stop(); }
    new MutationObserver(sync).observe(slide, { attributes: true, attributeFilter: ['class'] });
    sync();
  }

  var svg = document.getElementById('hiw');
  if (svg) start(svg);
})();
</script>

      <line x1="60" y1="232" x2="788" y2="232" stroke="#E7E5E4" stroke-width="1.5"/>
      <path d="M 244 60 Q 330 70 364 168" fill="none" stroke="#17161C" stroke-width="2.5" marker-end="url(#fr-arrow)"/><text x="352" y="104" font-size="26" font-weight="700" fill="#492ae8">10&#215; faster</text>

<script>
// shared by the PivCo appendix: build an SVG in code, then play a timeline once
// when its slide becomes active and hold the last frame. A click replays it.
window.APX = (function () {
  var NS = 'http://www.w3.org/2000/svg';
  var C = { v: '#492ae8', ink: '#17161C', gr: '#6B7280', gold: '#D9B300', goldT: '#FEF3C2',
            tint: '#E9E5FD', hair: '#D6D3D1', soft: '#F4F4F5', mono: 'JetBrains Mono, monospace' };
  function el(tag, a, p) {
    var n = document.createElementNS(NS, tag);
    for (var k in a) n.setAttribute(k, a[k]);
    if (p) p.appendChild(n);
    return n;
  }
  function txt(p, x, y, s, a) {
    var o = { x: x, y: y, 'font-size': 16, fill: C.ink, 'font-weight': 700 };
    for (var k in a || {}) o[k] = a[k];
    var n = el('text', o, p); n.textContent = s; return n;
  }
  function ease(x) { x = Math.max(0, Math.min(1, x)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function seg(t, a, b) { return ease((t - a) / (b - a)); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function op(n, v) { n.setAttribute('opacity', Math.max(0, Math.min(1, v)).toFixed(3)); }
  function at(n, x, y) { n.setAttribute('transform', 'translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')'); }
  // a round token with a label, positioned with at()
  function token(p, label, fill, color, r) {
    var g = el('g', { opacity: 0 }, p);
    el('circle', { cx: 0, cy: 0, r: r || 13, fill: fill, stroke: color, 'stroke-width': 1.8 }, g);
    txt(g, 0, 5, label, { 'text-anchor': 'middle', 'font-size': 13, fill: color });
    return g;
  }
  function run(svg, draw, end) {
    var slide = svg.closest('.slide'), raf = null, t0 = 0;
    function frame(now) {
      var t = (now - t0) / 1000;
      draw(Math.min(t, end));
      raf = t < end ? requestAnimationFrame(frame) : null;
    }
    function play() { if (raf) cancelAnimationFrame(raf); t0 = performance.now(); raf = requestAnimationFrame(frame); }
    function sync() {
      if (slide.classList.contains('active')) { if (!raf) play(); }
      else { if (raf) cancelAnimationFrame(raf); raf = null; draw(0); }
    }
    new MutationObserver(sync).observe(slide, { attributes: true, attributeFilter: ['class'] });
    svg.style.cursor = 'pointer';
    svg.addEventListener('click', play);
    draw(0);
    sync();
  }

    A.txt(svg, bx(j), 77, b, { 'text-anchor': 'middle', 'font-size': 19, 'font-family': C.mono });
    return r;

    A.txt(g, x + w / 2, 40, c, { 'text-anchor': 'middle', 'font-size': 15, fill: C.v });

  </div>

<script>

  A.txt(svg, NX, 26, '2nd bits   0 = b, 1 = c', { fill: C.gr, 'font-size': 13 });
  var rootCells = S.map(function (c, i) {
    var b = CODE[c][0];
    var r = A.el('rect', { x: X0 + i * CW + 6, y: 38, width: CW - 12, height: 36, rx: 6, fill: b === '1' ? C.tint : '#FFFFFF', stroke: C.v, 'stroke-width': 1.5 }, svg);
    A.txt(svg, cx(i), 63, b, { 'text-anchor': 'middle', 'font-size': 19, 'font-family': C.mono, fill: C.v });
    return r;
  });
  var slotCells = ones.map(function (i, k) {
    var r = A.el('rect', { x: NX + k * NW + 4, y: 38, width: NW - 8, height: 36, rx: 6, fill: C.goldT, stroke: C.gold, 'stroke-width': 1.5 }, svg);
    A.txt(svg, sx(k), 63, CODE[S[i]][1], { 'text-anchor': 'middle', 'font-size': 19, 'font-family': C.mono });
    A.txt(svg, sx(k), 92, 'slot ' + k, { 'text-anchor': 'middle', 'font-size': 12.5, fill: C.gr });
    return r;
  });

  // GPU: eight threads, each shows the bits it has read
  var gpu = A.el('g', { opacity: 0 }, svg);
  A.el('rect', { x: X0 - 4, y: 122, width: 8 * CW + 8, height: 58, rx: 10, fill: '#F5F3FF', stroke: C.v, 'stroke-width': 1.2, 'stroke-dasharray': '4 4' }, gpu);
  A.txt(gpu, 0, 150, 'GPU', { fill: C.v, 'font-size': 15 });
  A.txt(gpu, 0, 167, '8 threads', { fill: C.gr, 'font-size': 12.5, 'font-weight': 600 });
  var thBox = [], thBits = [];
  S.forEach(function (c, i) {
    thBox.push(A.el('rect', { x: cx(i) - 22, y: 128, width: 44, height: 46, rx: 7, fill: '#FFFFFF', stroke: C.v, 'stroke-width': 1.6 }, gpu));
    A.txt(gpu, cx(i), 144, 't' + i, { 'text-anchor': 'middle', 'font-size': 12.5, fill: C.v });
    thBits.push(A.txt(gpu, cx(i), 166, '', { 'text-anchor': 'middle', 'font-size': 16, 'font-family': C.mono }));
  });
  // arrows: root bit down into its thread, thread down into out
  var down = S.map(function (c, i) { return A.el('line', { x1: cx(i), y1: 76, x2: cx(i), y2: 76, stroke: C.v, 'stroke-width': 2 }, svg); });
  var outA = S.map(function (c, i) { return A.el('line', { x1: cx(i), y1: 176, x2: cx(i), y2: 176, stroke: C.v, 'stroke-width': 2 }, svg); });
  // counts and the 2nd-bit tokens
  var badges = ones.map(function (i, k) { return A.token(svg, String(k), C.goldT, C.gold, 11); });
  var toks = ones.map(function (i) { return A.token(svg, CODE[S[i]][1], C.goldT, C.gold, 12); });
  // the counts above are popcounts: the 1s before each thread, in one instruction
  var pc = A.el('g', { opacity: 0 }, svg);
  A.txt(pc, 0, 104, 'popcount', { fill: C.gold, 'font-size': 15, 'font-family': C.mono });
  A.txt(pc, 0, 120, '1s before me', { fill: C.gr, 'font-size': 12.5, 'font-weight': 600 });
  // out
  A.txt(svg, 0, 234, 'out', { fill: C.gr, 'font-size': 15 });
  var outs = S.map(function (c, i) {
    A.el('rect', { x: X0 + i * CW + 4, y: 208, width: CW - 8, height: 38, rx: 8, fill: C.soft }, svg);
    return A.txt(svg, cx(i), 235, c, { 'text-anchor': 'middle', 'font-size': 21, opacity: 0 });
  });
  var cap = A.txt(svg, X0, 286, 'every thread reads, counts the 1s before it and reads again, all at once', { 'font-size': 20, opacity: 0 });

  function draw(t) {
    A.op(gpu, A.seg(t, 0.2, 0.6));
    var d = A.seg(t, 0.8, 1.4);
    S.forEach(function (c, i) {
      down[i].setAttribute('y2', A.lerp(76, 124, d));
      var first = CODE[c][0], two = c !== 'a';
      var got = t >= 1.4 ? first : '';
      if (two && t >= 3.4) got = CODE[c];
      thBits[i].textContent = got;
      // a thread that read 0 is done: it already knows it is an a
      thBox[i].setAttribute('fill', t >= 1.8 && !two ? C.soft : '#FFFFFF');
      thBox[i].setAttribute('stroke', two && t >= 2.0 && t < 3.6 ? C.gold : C.v);
      thBox[i].setAttribute('stroke-width', two && t >= 2.0 && t < 3.6 ? 2.6 : 1.6);
      var o = A.seg(t, 3.8, 4.3);
      outA[i].setAttribute('y2', A.lerp(176, 206, o));
      A.op(outs[i], A.seg(t, 4.2, 4.5));
    });
    ones.forEach(function (i, k) {
      // the count of 1s before this thread, which is also its slot
      A.at(badges[k], cx(i) + 22, 104);
      A.op(badges[k], A.seg(t, 2.0, 2.3));
      A.op(pc, A.seg(t, 2.0, 2.3));
      slotCells[k].setAttribute('stroke-width', t >= 2.3 && t < 3.4 ? 3.2 : 1.5);
      // the slot's bit travels to the thread
      var f = A.seg(t, 2.6, 3.4);
      A.at(toks[k], A.lerp(sx(k), cx(i) + 12, f), A.lerp(56, 160, f));
      A.op(toks[k], t < 2.5 ? 0 : (t < 3.4 ? A.seg(t, 2.5, 2.6) : 1 - A.seg(t, 3.4, 3.6)));
    });
    A.op(cap, A.seg(t, 4.7, 5.1));
  }
  A.run(svg, draw, 5.3);
})();
</script>

<section class="slide" data-layout="content">
  <div class="phase phase--decompress">decompress</div>
  <div class="eyebrow">pivco-huffman &#183; decompress</div>
  <h2>What is popcount?</h2>
  <div class="body body--center body--compact">
    <svg id="apx6" class="chart-svg" viewBox="0 0 848 300" width="100%" role="img" aria-label="What popcount is, one click per idea. popcount answers how many 1s are in a word: for 0 1 0 1 0 1 0 0 it counts every 1 at once, in one instruction, and gives 3. Thread 5 only wants the 1s before it, so it masks the rest away; popcount of what is left gives 2. So thread 5 reads slot 2 of the second bits. Every thread does this at the same time, each with its own mask. It is built into CPUs and GPUs: POPCNT on x86, CNT on Arm, __popc in CUDA, popcount in Metal."></svg>
    <span data-step="1" hidden></span><span data-step="2" hidden></span><span data-step="3" hidden></span><span data-step="4" hidden></span><span data-step="5" hidden></span>
    <p class="source-note" style="margin-top:12px;">PivCo-Huffman: M. Zukowski, arXiv 2606.05765, 2026; in OpenZL 0.3.</p>
  </div>
</section>
<script>
// 6. what popcount is, one click per idea. The slide's build step (data-k)
// picks the phase; each phase animates in from the one before.
(function () {
  var A = APX, C = A.C, svg = document.getElementById('apx6');
  if (!svg) return;
  var slide = svg.closest('.slide');
  var bits = '01010100'.split(''), X0 = 150, CW = 56, ME = 5, NX = 600, NW = 56;
  function cx(i) { return X0 + i * CW + CW / 2; }
  var ones = []; bits.forEach(function (b, i) { if (b === '1') ones.push(i); });

  var cap = A.txt(svg, 0, 26, '', { 'font-size': 21 });
  A.txt(svg, 0, 94, 'a word', { fill: C.v, 'font-size': 15 });
  var cells = bits.map(function (b, i) {
    var g = A.el('g', {}, svg);
    A.el('rect', { x: X0 + i * CW + 6, y: 70, width: CW - 12, height: 38, rx: 6, fill: b === '1' ? C.tint : '#FFFFFF', stroke: C.v, 'stroke-width': 1.5 }, g);
    A.txt(g, cx(i), 96, b, { 'text-anchor': 'middle', 'font-size': 20, 'font-family': C.mono, fill: C.v });
    return g;
  });
  // t5 and its mask
  var me = A.el('g', {}, svg);
  A.el('path', { d: 'M ' + (cx(ME) - 9) + ' 54 L ' + (cx(ME) + 9) + ' 54 L ' + cx(ME) + ' 66 Z', fill: C.gold }, me);
  A.txt(me, cx(ME) + 16, 64, 't5', { 'font-size': 15 });
  var mask = A.el('g', {}, svg);
  A.el('path', { d: 'M ' + (X0 + 6) + ' 118 L ' + (X0 + 6) + ' 126 L ' + (X0 + ME * CW - 6) + ' 126 L ' + (X0 + ME * CW - 6) + ' 118', fill: 'none', stroke: C.gold, 'stroke-width': 2 }, mask);
  A.txt(mask, X0 + ME * CW / 2, 148, 'the bits before t5', { 'text-anchor': 'middle', 'font-size': 15, fill: C.gr });
  // the popcount box
  var box = A.el('g', {}, svg);
  A.el('rect', { x: X0 + 40, y: 172, width: 210, height: 76, rx: 12, fill: C.goldT, stroke: C.gold, 'stroke-width': 2 }, box);
  A.txt(box, X0 + 145, 195, 'popcount', { 'text-anchor': 'middle', 'font-size': 16, 'font-family': C.mono });
  var result = A.txt(box, X0 + 145, 236, '', { 'text-anchor': 'middle', 'font-size': 34, 'font-family': C.mono });
  var toks = ones.map(function () { return A.token(svg, '1', C.tint, C.v, 14); });
  // the 2nd bits, and the jump to slot 2
  var node = A.el('g', {}, svg);
  A.txt(node, NX, 170, '2nd bits', { fill: C.gr, 'font-size': 13 });
  var slots = [0, 1, 2].map(function (k) {
    A.txt(node, NX + k * NW + NW / 2, 190, 'slot ' + k, { 'text-anchor': 'middle', 'font-size': 12.5, fill: C.gr });
    var r = A.el('rect', { x: NX + k * NW + 4, y: 198, width: NW - 8, height: 38, rx: 6, fill: C.goldT, stroke: C.gold, 'stroke-width': 1.5 }, node);
    A.txt(node, NX + k * NW + NW / 2, 224, '010'[k], { 'text-anchor': 'middle', 'font-size': 19, 'font-family': C.mono });
    return r;
  });
  var arrow = A.el('path', { d: 'M ' + (X0 + 252) + ' 220 C ' + (NX - 80) + ' 220 ' + (NX - 60) + ' 262 ' + NX + ' 262 L ' + (NX + 2 * NW + NW / 2) + ' 262 L ' + (NX + 2 * NW + NW / 2) + ' 240', fill: 'none', stroke: C.gold, 'stroke-width': 2.4 }, svg);
  var instr = A.txt(svg, 0, 292, 'built into CPUs and GPUs, as POPCNT on x86, CNT on Arm, __popc in CUDA, popcount in Metal', { 'font-size': 15, fill: C.gr, 'font-weight': 600 });

  var CAPS = ['popcount answers one question: how many 1s are in a word?',
              'it counts every 1 at once, in one instruction, and gets 3',
              't5 only wants the 1s before it, so the rest is masked away',
              'popcount of what is left gives 2',
              'so t5 reads slot 2 of the 2nd bits',
              'every thread does this at the same time, each with its own mask'];

  // state of every element for phase k, p is how far into that phase (0..1)
  function render(k, p) {
    cap.textContent = CAPS[k];
    A.op(cap, k === 0 ? 1 : A.seg(p, 0, 0.3));
    A.op(box, k >= 1 ? 1 : 0);
    A.op(me, k >= 2 ? (k === 2 ? A.seg(p, 0, 0.3) : 1) : 0);
    var m = k >= 2 ? (k === 2 ? A.seg(p, 0.2, 0.7) : 1) : 0;
    cells.forEach(function (g, i) { A.op(g, i >= ME ? 1 - 0.75 * m : 1); });
    A.op(mask, m);
    // tokens: phase 1 counts all three 1s, phase 3 only the two before t5
    ones.forEach(function (i, q) {
      var counted = k === 1 || (k === 3 && i < ME);
      var f = counted ? A.seg(p, 0.15, 0.75) : 0;
      A.at(toks[q], A.lerp(cx(i), X0 + 95 + q * 55, f), A.lerp(89, 236, f));
      A.op(toks[q], counted ? (p < 0.75 ? 1 : 1 - A.seg(p, 0.75, 0.9)) : 0);
    });
    result.textContent = (k === 1 && p > 0.8) ? '3' : (k >= 3 && (k > 3 || p > 0.8) ? '2' : '');
    A.op(node, k >= 4 ? (k === 4 ? A.seg(p, 0, 0.3) : 1) : 0);
    A.op(arrow, k >= 4 ? (k === 4 ? A.seg(p, 0.3, 0.6) : 1) : 0);
    slots.forEach(function (r, s) { r.setAttribute('stroke-width', s === 2 && k >= 4 && (k > 4 || p > 0.6) ? 3.4 : 1.5); });
    A.op(instr, k >= 5 ? A.seg(p, 0.2, 0.5) : 0);
  }

  var raf = null, t0 = 0, cur = 0;
  function step(now) {
    var p = Math.min(1, (now - t0) / 1600);
    render(cur, p);
    raf = p < 1 ? requestAnimationFrame(step) : null;
  }
  function sync() {
    var k = Math.min(5, +(slide.dataset.k || 0));
    var forward = k === cur + 1;
    cur = k;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    if (forward && slide.classList.contains('active')) { t0 = performance.now(); raf = requestAnimationFrame(step); }
    else render(cur, 1);
  }
  new MutationObserver(sync).observe(slide, { attributes: true, attributeFilter: ['data-k', 'class'] });
  render(0, 1);
})();
</script>
