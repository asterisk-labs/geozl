<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-label="Block size in bytes for each width b, for the eight example values repeated 32 times. b 7 gives 226 bytes, 6 gives 231, 5 gives 203, 4 gives 175, 3 gives 147, the smallest, 2 gives 199 and 1 gives 235. b 0 would need 256 exceptions and is skipped. The body shrinks by 32 bytes per bit while the exceptions grow.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
    svg{--paper:#FFFFFF;--ink:#111111;--ink-2:#5C6370;--purple:#492AE8;--green:#1D9A4A;
      --fit:color-mix(in srgb,var(--green) 30%,var(--paper));--over:color-mix(in srgb,var(--purple) 22%,var(--paper));
      background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .lab{fill:var(--ink-2);font:500 11.5px "IBM Plex Mono",monospace;letter-spacing:.04em}
    .k{fill:var(--ink-2);font:500 11.5px "IBM Plex Mono",monospace;text-anchor:end}
    .kb{fill:var(--purple);font:700 11.5px "IBM Plex Mono",monospace;text-anchor:end}
    .v{fill:var(--ink-2);font:500 11px "IBM Plex Mono",monospace}
    .vb{fill:var(--purple);font:700 11px "IBM Plex Mono",monospace;white-space:pre}
    .note{fill:var(--ink-2);font:500 10.5px "IBM Plex Mono",monospace}
    .fit{fill:var(--fit);stroke:var(--green);stroke-width:1}
    .exc{fill:var(--over);stroke:var(--purple);stroke-width:1}
    .best{fill:none;stroke:var(--purple);stroke-width:1.6}
  ]]></style>
  <text class="lab" x="20" y="20">block size for each b, in bytes</text><rect class="fit" x="78" y="30" width="12" height="10" rx="2"/><text class="note" x="96" y="39">body, 32 × b</text><rect class="exc" x="208" y="30" width="12" height="10" rx="2"/><text class="note" x="226" y="39">header and exceptions</text><text class="k" x="66" y="68" text-anchor="end">b = 7</text><rect class="fit" x="78" y="54" width="369.59999999999997" height="20" rx="2"/><rect class="exc" x="447.59999999999997" y="54" width="3.3" height="20" rx="2"/><text class="v" x="458.9" y="68">226</text><text class="k" x="66" y="96" text-anchor="end">b = 6</text><rect class="fit" x="78" y="82" width="316.79999999999995" height="20" rx="2"/><rect class="exc" x="394.79999999999995" y="82" width="64.35" height="20" rx="2"/><text class="v" x="467.15" y="96">231</text><text class="k" x="66" y="124" text-anchor="end">b = 5</text><rect class="fit" x="78" y="110" width="264.0" height="20" rx="2"/><rect class="exc" x="342.0" y="110" width="70.95" height="20" rx="2"/><text class="v" x="420.95" y="124">203</text><text class="k" x="66" y="152" text-anchor="end">b = 4</text><rect class="fit" x="78" y="138" width="211.2" height="20" rx="2"/><rect class="exc" x="289.2" y="138" width="77.55" height="20" rx="2"/><text class="v" x="374.75" y="152">175</text><text class="kb" x="66" y="180" text-anchor="end">b = 3</text><rect class="fit" x="78" y="166" width="158.39999999999998" height="20" rx="2"/><rect class="exc" x="236.39999999999998" y="166" width="84.14999999999999" height="20" rx="2"/><rect class="best" x="76" y="164" width="246.54999999999998" height="24" rx="3"/><text class="vb" x="328.54999999999995" y="180">147  smallest</text><text class="k" x="66" y="208" text-anchor="end">b = 2</text><rect class="fit" x="78" y="194" width="105.6" height="20" rx="2"/><rect class="exc" x="183.6" y="194" width="222.75" height="20" rx="2"/><text class="v" x="414.34999999999997" y="208">199</text><text class="k" x="66" y="236" text-anchor="end">b = 1</text><rect class="fit" x="78" y="222" width="52.8" height="20" rx="2"/><rect class="exc" x="130.8" y="222" width="334.95" height="20" rx="2"/><text class="v" x="473.75" y="236">235</text><text class="k" x="66" y="264" text-anchor="end">b = 0</text><text class="note" x="78" y="264" text-anchor="start">256 exceptions, more than a block can hold, skipped</text>
</svg>
