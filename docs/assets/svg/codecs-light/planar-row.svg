<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" role="img" aria-label="Decoding one row of planar. Row above 10 12 15 15, residuals 1 0 -1 2. Step 1 computes r plus N minus the N on its left for every column at once, 11 2 2 2. Step 2 takes a running sum, 11 13 15 17, which is the decoded row.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    svg{ background:transparent; font-family:"IBM Plex Mono",ui-monospace,monospace; }
    .ttl{ fill:#111111; font:600 13px "IBM Plex Mono",monospace; }
    .sub{ fill:#5C6370; font:500 11px "IBM Plex Mono",monospace; }
    .note{ fill:#5C6370; font:500 11px "IBM Plex Mono",monospace; }
    .num{ font:600 14px "IBM Plex Mono",monospace; text-anchor:middle; }
    .done{ fill:#F3F3F1; stroke:#9AA1AB; } .donet{ fill:#5C6370; }
    .res{ fill:#FFFFFF; stroke:#111111; } .rest{ fill:#111111; }
    .step{ fill:#ECE9FD; stroke:#492AE8; stroke-width:1.3; } .stept{ fill:#492AE8; }
    .out{ fill:#C4FFC2; stroke:#1D7A3E; stroke-width:1.3; } .outt{ fill:#1D7A3E; }
    .arr{ fill:none; stroke:#492AE8; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    .arr2{ fill:none; stroke:#9AA1AB; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
    .carry{ fill:none; stroke:#1D7A3E; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    .in{ animation:in .5s cubic-bezier(.4,0,.2,1) both; }
    @keyframes in{ from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce){ .in{ animation:none; } }
  ]]></style>
  <g class="in" style="animation-delay:0s"><text class="ttl" x="20" y="41">row above</text><text class="sub" x="20" y="57">already decoded</text><rect class="done" x="236" y="26" width="56" height="30" rx="4"/><text class="num donet" x="264.0" y="46">10</text><rect class="done" x="302" y="26" width="56" height="30" rx="4"/><text class="num donet" x="330.0" y="46">12</text><rect class="done" x="368" y="26" width="56" height="30" rx="4"/><text class="num donet" x="396.0" y="46">15</text><rect class="done" x="434" y="26" width="56" height="30" rx="4"/><text class="num donet" x="462.0" y="46">15</text></g><g class="in" style="animation-delay:0.2s"><text class="ttl" x="20" y="93">residuals</text><text class="sub" x="20" y="109">from the frame</text><rect class="res" x="236" y="78" width="56" height="30" rx="4"/><text class="num rest" x="264.0" y="98">1</text><rect class="res" x="302" y="78" width="56" height="30" rx="4"/><text class="num rest" x="330.0" y="98">0</text><rect class="res" x="368" y="78" width="56" height="30" rx="4"/><text class="num rest" x="396.0" y="98">&#8722;1</text><rect class="res" x="434" y="78" width="56" height="30" rx="4"/><text class="num rest" x="462.0" y="98">2</text></g><g class="in" style="animation-delay:0.8s"><text class="ttl" x="20" y="165">step 1, all at once</text><text class="sub" x="20" y="181">r + N &#8722; N on the left</text><rect class="step" x="236" y="150" width="56" height="30" rx="4"/><text class="num stept" x="264.0" y="170">11</text><rect class="step" x="302" y="150" width="56" height="30" rx="4"/><text class="num stept" x="330.0" y="170">2</text><rect class="step" x="368" y="150" width="56" height="30" rx="4"/><text class="num stept" x="396.0" y="170">2</text><rect class="step" x="434" y="150" width="56" height="30" rx="4"/><text class="num stept" x="462.0" y="170">2</text></g><g class="in" style="animation-delay:2.0s"><text class="ttl" x="20" y="237">step 2, prefix sum</text><text class="sub" x="20" y="253">the decoded row</text><rect class="out" x="236" y="222" width="56" height="30" rx="4"/><text class="num outt" x="264.0" y="242">11</text><rect class="out" x="302" y="222" width="56" height="30" rx="4"/><text class="num outt" x="330.0" y="242">13</text><rect class="out" x="368" y="222" width="56" height="30" rx="4"/><text class="num outt" x="396.0" y="242">15</text><rect class="out" x="434" y="222" width="56" height="30" rx="4"/><text class="num outt" x="462.0" y="242">17</text></g><g class="in" style="animation-delay:.6s"><path class="arr" d="M264.0 110 V146 M260.0 142 L264.0 146 L268.0 142"/><path class="arr" d="M330.0 110 V146 M326.0 142 L330.0 146 L334.0 142"/><path class="arr" d="M396.0 110 V146 M392.0 142 L396.0 146 L400.0 142"/><path class="arr" d="M462.0 110 V146 M458.0 142 L462.0 146 L466.0 142"/><text class="note" x="504" y="128">every column</text><text class="note" x="504" y="142">at once</text></g><g class="in" style="animation-delay:1.6s"><path class="arr2" d="M264.0 182 V218 M260.0 214 L264.0 218 L268.0 214"/><path class="arr2" d="M330.0 182 V218 M326.0 214 L330.0 218 L334.0 214"/><path class="arr2" d="M396.0 182 V218 M392.0 214 L396.0 218 L400.0 214"/><path class="arr2" d="M462.0 182 V218 M458.0 214 L462.0 218 L466.0 214"/><path class="carry" d="M284 254 Q297.0 270 310 254 M305 255 L310 254 L310 259"/><path class="carry" d="M350 254 Q363.0 270 376 254 M371 255 L376 254 L376 259"/><path class="carry" d="M416 254 Q429.0 270 442 254 M437 255 L442 254 L442 259"/><text class="note" x="504" y="240">running sum,</text><text class="note" x="504" y="254">left to right</text></g>
</svg>
