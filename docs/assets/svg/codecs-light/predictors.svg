<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 636 372" width="636" height="372" role="img" aria-label="The six predictors by the neighbours they read. delta_w reads W, delta_n reads N, planar W + N - NW, med the median of W, N and the planar guess, average the mean of W and N, wp_static W plus fitted weights over N, NW, NE and NN. delta_w, delta_n, planar and wp_static decode a whole row at once; med and average decode one sample at a time.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    svg{ background:transparent; font-family:"IBM Plex Mono",ui-monospace,monospace; }
    .t{ font:600 10px "IBM Plex Mono",monospace; text-anchor:middle; }
    .on{ fill:#ECE9FD; stroke:#492AE8; stroke-width:1.2; } .ont{ fill:#492AE8; stroke:none; }
    .off{ fill:#FFFFFF; stroke:#E6E6E3; stroke-width:1; } .offt{ fill:#C4C8CE; stroke:none; }
    .me{ fill:#111111; stroke:#111111; } .met{ fill:#FFFFFF; stroke:none; font-size:13px; }
    .name{ fill:#111111; font:600 13px "IBM Plex Mono",monospace; text-anchor:middle; }
    .f{ fill:#5C6370; font:500 11px "IBM Plex Mono",monospace; text-anchor:middle; }
    .b{ font:600 10.5px "IBM Plex Mono",monospace; text-anchor:middle; }
    .fast{ fill:#E9FBE8; stroke:#1D7A3E; stroke-width:1; } .fastt{ fill:#1D7A3E; stroke:none; }
    .slow{ fill:#FEF6D3; stroke:#F7CC09; stroke-width:1; } .slowt{ fill:#7A5D00; stroke:none; }
  ]]></style>
  <rect class="off" x="93.0" y="9" width="26" height="26" rx="3"/><text class="t offt" x="106.0" y="26.0">NN</text><rect class="off" x="65.0" y="37" width="26" height="26" rx="3"/><text class="t offt" x="78.0" y="54.0">NW</text><rect class="off" x="93.0" y="37" width="26" height="26" rx="3"/><text class="t offt" x="106.0" y="54.0">N</text><rect class="off" x="121.0" y="37" width="26" height="26" rx="3"/><text class="t offt" x="134.0" y="54.0">NE</text><rect class="on" x="65.0" y="65" width="26" height="26" rx="3"/><text class="t ont" x="78.0" y="82.0">W</text><rect class="me" x="93.0" y="65" width="26" height="26" rx="3"/><text class="t met" x="106.0" y="82.0">?</text><text class="name" x="106.0" y="114">delta_w</text><text class="f" x="106.0" y="134">W</text><rect class="fast" x="40.9" y="144" width="130.2" height="20" rx="10"/><text class="b fastt" x="106.0" y="158">whole row at once</text><rect class="off" x="305.0" y="9" width="26" height="26" rx="3"/><text class="t offt" x="318.0" y="26.0">NN</text><rect class="off" x="277.0" y="37" width="26" height="26" rx="3"/><text class="t offt" x="290.0" y="54.0">NW</text><rect class="on" x="305.0" y="37" width="26" height="26" rx="3"/><text class="t ont" x="318.0" y="54.0">N</text><rect class="off" x="333.0" y="37" width="26" height="26" rx="3"/><text class="t offt" x="346.0" y="54.0">NE</text><rect class="off" x="277.0" y="65" width="26" height="26" rx="3"/><text class="t offt" x="290.0" y="82.0">W</text><rect class="me" x="305.0" y="65" width="26" height="26" rx="3"/><text class="t met" x="318.0" y="82.0">?</text><text class="name" x="318.0" y="114">delta_n</text><text class="f" x="318.0" y="134">N</text><rect class="fast" x="252.9" y="144" width="130.2" height="20" rx="10"/><text class="b fastt" x="318.0" y="158">whole row at once</text><rect class="off" x="517.0" y="9" width="26" height="26" rx="3"/><text class="t offt" x="530.0" y="26.0">NN</text><rect class="on" x="489.0" y="37" width="26" height="26" rx="3"/><text class="t ont" x="502.0" y="54.0">NW</text><rect class="on" x="517.0" y="37" width="26" height="26" rx="3"/><text class="t ont" x="530.0" y="54.0">N</text><rect class="off" x="545.0" y="37" width="26" height="26" rx="3"/><text class="t offt" x="558.0" y="54.0">NE</text><rect class="on" x="489.0" y="65" width="26" height="26" rx="3"/><text class="t ont" x="502.0" y="82.0">W</text><rect class="me" x="517.0" y="65" width="26" height="26" rx="3"/><text class="t met" x="530.0" y="82.0">?</text><text class="name" x="530.0" y="114">planar</text><text class="f" x="530.0" y="134">W + N &#8722; NW</text><rect class="fast" x="464.9" y="144" width="130.2" height="20" rx="10"/><text class="b fastt" x="530.0" y="158">whole row at once</text><rect class="off" x="93.0" y="195" width="26" height="26" rx="3"/><text class="t offt" x="106.0" y="212.0">NN</text><rect class="on" x="65.0" y="223" width="26" height="26" rx="3"/><text class="t ont" x="78.0" y="240.0">NW</text><rect class="on" x="93.0" y="223" width="26" height="26" rx="3"/><text class="t ont" x="106.0" y="240.0">N</text><rect class="off" x="121.0" y="223" width="26" height="26" rx="3"/><text class="t offt" x="134.0" y="240.0">NE</text><rect class="on" x="65.0" y="251" width="26" height="26" rx="3"/><text class="t ont" x="78.0" y="268.0">W</text><rect class="me" x="93.0" y="251" width="26" height="26" rx="3"/><text class="t met" x="106.0" y="268.0">?</text><text class="name" x="106.0" y="300">med</text><text class="f" x="106.0" y="320">median(W, N, planar)</text><rect class="slow" x="31.0" y="330" width="150.0" height="20" rx="10"/><text class="b slowt" x="106.0" y="344">one sample at a time</text><rect class="off" x="305.0" y="195" width="26" height="26" rx="3"/><text class="t offt" x="318.0" y="212.0">NN</text><rect class="off" x="277.0" y="223" width="26" height="26" rx="3"/><text class="t offt" x="290.0" y="240.0">NW</text><rect class="on" x="305.0" y="223" width="26" height="26" rx="3"/><text class="t ont" x="318.0" y="240.0">N</text><rect class="off" x="333.0" y="223" width="26" height="26" rx="3"/><text class="t offt" x="346.0" y="240.0">NE</text><rect class="on" x="277.0" y="251" width="26" height="26" rx="3"/><text class="t ont" x="290.0" y="268.0">W</text><rect class="me" x="305.0" y="251" width="26" height="26" rx="3"/><text class="t met" x="318.0" y="268.0">?</text><text class="name" x="318.0" y="300">average</text><text class="f" x="318.0" y="320">(W + N) / 2</text><rect class="slow" x="243.0" y="330" width="150.0" height="20" rx="10"/><text class="b slowt" x="318.0" y="344">one sample at a time</text><rect class="on" x="517.0" y="195" width="26" height="26" rx="3"/><text class="t ont" x="530.0" y="212.0">NN</text><rect class="on" x="489.0" y="223" width="26" height="26" rx="3"/><text class="t ont" x="502.0" y="240.0">NW</text><rect class="on" x="517.0" y="223" width="26" height="26" rx="3"/><text class="t ont" x="530.0" y="240.0">N</text><rect class="on" x="545.0" y="223" width="26" height="26" rx="3"/><text class="t ont" x="558.0" y="240.0">NE</text><rect class="on" x="489.0" y="251" width="26" height="26" rx="3"/><text class="t ont" x="502.0" y="268.0">W</text><rect class="me" x="517.0" y="251" width="26" height="26" rx="3"/><text class="t met" x="530.0" y="268.0">?</text><text class="name" x="530.0" y="300">wp_static</text><text class="f" x="530.0" y="320">W + fitted weights</text><rect class="fast" x="464.9" y="330" width="130.2" height="20" rx="10"/><text class="b fastt" x="530.0" y="344">whole row at once</text>
</svg>
