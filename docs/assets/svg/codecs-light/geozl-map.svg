<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" width="640" height="402" role="img" aria-label="The seventeen GeoZL codecs by the slot of a graph where they run, split, bounded error, predict and code, with the fused codecs that do predict and code in one pass, and the OpenZL codecs they work with.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    svg{ background:transparent; font-family:"IBM Plex Mono",ui-monospace,monospace; }
    .slot{ fill:#FFFFFF; stroke:#111111; stroke-width:1.2; }
    .slott{ fill:#111111; font:600 12px "IBM Plex Mono",monospace; }
    .sub{ fill:#5C6370; font:500 11px "IBM Plex Mono",monospace; }
    .leg{ fill:#111111; font:500 11px "IBM Plex Mono",monospace; }
    .chip{ font:500 12px "IBM Plex Mono",monospace; }
    .gpu{ fill:#FFFFFF; font:600 10px "IBM Plex Mono",monospace; text-anchor:middle; }
    .arrow{ fill:none; stroke:#9AA1AB; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
    .fusedbox{ fill:none; stroke:#F7CC09; stroke-width:1.4; stroke-dasharray:5 4; }
    .brace{ fill:none; stroke:#B8900A; stroke-width:1.2; }
    .in{ animation:in .5s cubic-bezier(.4,0,.2,1) both; }
    @keyframes in{ from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce){ .in{ animation:none; } }
  ]]></style>
  <rect class="slot" x="20" y="14" width="118" height="30" rx="15"/><text class="slott" x="34" y="34">1  split</text><text class="sub" x="22" y="62">nodata=, optional</text><path class="arrow" d="M142 29 H155 M151 25 L155 29 L151 33"/><rect class="slot" x="160" y="14" width="118" height="30" rx="15"/><text class="slott" x="174" y="34">2  quantize</text><text class="sub" x="162" y="62">error=, optional</text><path class="arrow" d="M282 29 H301 M297 25 L301 29 L297 33"/><rect class="slot" x="306" y="14" width="118" height="30" rx="15"/><text class="slott" x="320" y="34">3  predict</text><text class="sub" x="308" y="62">spatial guess</text><path class="arrow" d="M428 29 H447 M443 25 L447 29 L443 33"/><rect class="slot" x="452" y="14" width="180" height="30" rx="15"/><text class="slott" x="466" y="34">4  code</text><text class="sub" x="454" y="62">pack the residuals</text><g class="in" style="animation-delay:0.10s"><rect x="20" y="76" width="59" height="22" rx="4" fill="#E9FBE8" stroke="#1D7A3E"/><text class="chip" x="28" y="91" fill="#1D7A3E">nodata</text></g><g class="in" style="animation-delay:0.16s"><rect x="20" y="104" width="102" height="22" rx="4" fill="#E9FBE8" stroke="#1D7A3E"/><text class="chip" x="28" y="119" fill="#1D7A3E">deinterleave</text></g><g class="in" style="animation-delay:0.25s"><rect x="160" y="76" width="102" height="22" rx="4" fill="#FDEDE7" stroke="#C2451E"/><text class="chip" x="168" y="91" fill="#C2451E">quant_linear</text></g><g class="in" style="animation-delay:0.31s"><rect x="160" y="104" width="81" height="22" rx="4" fill="#FDEDE7" stroke="#C2451E"/><text class="chip" x="168" y="119" fill="#C2451E">quant_log</text></g><g class="in" style="animation-delay:0.37s"><rect x="160" y="132" width="88" height="22" rx="4" fill="#FDEDE7" stroke="#C2451E"/><text class="chip" x="168" y="147" fill="#C2451E">quant_sqrt</text></g><g class="in" style="animation-delay:0.40s"><rect x="306" y="76" width="66" height="22" rx="4" fill="#ECE9FD" stroke="#492AE8"/><text class="chip" x="314" y="91" fill="#492AE8">delta_w</text></g><g class="in" style="animation-delay:0.46s"><rect x="306" y="104" width="66" height="22" rx="4" fill="#ECE9FD" stroke="#492AE8"/><text class="chip" x="314" y="119" fill="#492AE8">delta_n</text></g><g class="in" style="animation-delay:0.52s"><rect x="306" y="132" width="59" height="22" rx="4" fill="#ECE9FD" stroke="#492AE8"/><text class="chip" x="314" y="147" fill="#492AE8">planar</text></g><g class="in" style="animation-delay:0.58s"><rect x="306" y="160" width="38" height="22" rx="4" fill="#ECE9FD" stroke="#492AE8"/><text class="chip" x="314" y="175" fill="#492AE8">med</text></g><g class="in" style="animation-delay:0.64s"><rect x="306" y="188" width="66" height="22" rx="4" fill="#ECE9FD" stroke="#492AE8"/><text class="chip" x="314" y="203" fill="#492AE8">average</text></g><g class="in" style="animation-delay:0.70s"><rect x="306" y="216" width="81" height="22" rx="4" fill="#ECE9FD" stroke="#492AE8"/><text class="chip" x="314" y="231" fill="#492AE8">wp_static</text></g><g class="in" style="animation-delay:0.60s"><rect x="452" y="76" width="45" height="22" rx="4" fill="#E9FBE8" stroke="#1D7A3E"/><text class="chip" x="460" y="91" fill="#1D7A3E">pfor</text><rect x="502" y="79" width="30" height="16" rx="8" fill="#111111"/><text class="gpu" x="517" y="90.5">gpu</text></g><g class="in" style="animation-delay:0.66s"><rect x="452" y="104" width="52" height="22" rx="4" fill="#E9FBE8" stroke="#1D7A3E"/><text class="chip" x="460" y="119" fill="#1D7A3E">lanes</text><rect x="509" y="107" width="30" height="16" rx="8" fill="#111111"/><text class="gpu" x="524" y="118.5">gpu</text></g><text class="sub" x="454" y="148">from OpenZL</text><g class="in" style="animation-delay:0.75s"><rect x="452" y="158" width="59" height="22" rx="4" fill="#F3F3F1" stroke="#5C6370"/><text class="chip" x="460" y="173" fill="#5C6370">zigzag</text></g><g class="in" style="animation-delay:0.80s"><rect x="540" y="158" width="81" height="22" rx="4" fill="#F3F3F1" stroke="#5C6370"/><text class="chip" x="548" y="173" fill="#5C6370">transpose</text></g><g class="in" style="animation-delay:0.85s"><rect x="452" y="186" width="66" height="22" rx="4" fill="#F3F3F1" stroke="#5C6370"/><text class="chip" x="460" y="201" fill="#5C6370">entropy</text></g><g class="in" style="animation-delay:0.90s"><rect x="540" y="186" width="45" height="22" rx="4" fill="#F3F3F1" stroke="#5C6370"/><text class="chip" x="548" y="201" fill="#5C6370">zstd</text></g><rect class="fusedbox" x="296" y="258" width="336" height="126" rx="8"/><text class="slott" x="310" y="280" fill="#8A6A00">fused, predict and code in one pass</text><g class="in" style="animation-delay:1.00s"><rect x="310" y="292" width="110" height="22" rx="4" fill="#FEF6D3" stroke="#8A6A00"/><text class="chip" x="318" y="307" fill="#8A6A00">planar_zigzag</text></g><g class="in" style="animation-delay:1.05s"><rect x="430" y="292" width="88" height="22" rx="4" fill="#FEF6D3" stroke="#8A6A00"/><text class="chip" x="438" y="307" fill="#8A6A00">med_zigzag</text></g><g class="in" style="animation-delay:1.10s"><rect x="310" y="320" width="146" height="22" rx="4" fill="#FEF6D3" stroke="#8A6A00"/><text class="chip" x="318" y="335" fill="#8A6A00">planar_zigzag_pfor</text><rect x="461" y="323" width="30" height="16" rx="8" fill="#111111"/><text class="gpu" x="476" y="334.5">gpu</text></g><g class="in" style="animation-delay:1.15s"><rect x="310" y="348" width="153" height="22" rx="4" fill="#FEF6D3" stroke="#8A6A00"/><text class="chip" x="318" y="363" fill="#8A6A00">planar_zigzag_lanes</text><rect x="468" y="351" width="30" height="16" rx="8" fill="#111111"/><text class="gpu" x="483" y="362.5">gpu</text></g><text class="sub" x="20" y="274">families</text><rect x="20" y="287" width="14" height="14" rx="3" fill="#ECE9FD" stroke="#492AE8"/><text class="leg" x="42" y="298">predictors</text><rect x="20" y="309" width="14" height="14" rx="3" fill="#FEF6D3" stroke="#8A6A00"/><text class="leg" x="42" y="320">fused</text><rect x="20" y="331" width="14" height="14" rx="3" fill="#E9FBE8" stroke="#1D7A3E"/><text class="leg" x="42" y="342">streams</text><rect x="20" y="353" width="14" height="14" rx="3" fill="#FDEDE7" stroke="#C2451E"/><text class="leg" x="42" y="364">quantizers</text><rect x="20" y="375" width="14" height="14" rx="3" fill="#F3F3F1" stroke="#5C6370"/><text class="leg" x="42" y="386">OpenZL, not GeoZL</text>
</svg>
