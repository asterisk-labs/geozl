<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" width="400" height="262" role="img" aria-label="PFOR on eight residuals, 3 5 2 7 4 6 1 90. Each value is a stack of its bits, lowest at the bottom. A line at b = 3 bits fits every value but 90. The four bits of 90 above the line, 1011, move to an exception list with its position 7, and its low bits 010 stay. The body packs eight 3-bit slots, 24 bits plus one exception instead of 8 times 7 = 56 bits. The decoder unpacks the eight slots and puts the high bits back, 90 = 010 OR 1011 shifted left by 3, which is 2 + 88">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

    svg{
      --paper:#FFFFFF; --ink:#111111; --ink-2:#5C6370; --purple:#492AE8; --green:#1D9A4A;
      --fit:color-mix(in srgb,var(--green) 30%,var(--paper));
      --over:color-mix(in srgb,var(--purple) 40%,var(--paper));
      --ease:cubic-bezier(.22,.7,.2,1);
      background:transparent;
      font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    }

    .lab{ fill:var(--ink-2); font:500 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.05em; }
    .fx{ fill:var(--ink); font:600 11.5px/1 "IBM Plex Mono",monospace; }
    .fx2{ fill:var(--ink-2); font:500 10.5px/1 "IBM Plex Mono",monospace; }
    .num{ fill:var(--ink); font:600 11px/1 "IBM Plex Mono",monospace; }
    .bit{ fill:var(--ink); font:500 9px/1 "IBM Plex Mono",monospace; }
    .lo{ fill:var(--fit); stroke:var(--ink); stroke-width:.8; }
    .hi{ fill:var(--fit); stroke:var(--ink); stroke-width:.8; }
    .slot{ fill:var(--fit); stroke:var(--ink); stroke-width:.8; }
    .hole{ fill:none; stroke:var(--purple); stroke-width:.9; stroke-dasharray:2 2; opacity:.7; }
    .water{ stroke:var(--purple); stroke-width:1.6; stroke-dasharray:5 3; }
    .boxr{ fill:none; stroke:var(--ink-2); stroke-width:1; stroke-dasharray:3 2.5; opacity:.75; }
    .bmark{ fill:var(--purple); font:700 11px/1 "IBM Plex Mono",monospace; }
    .mark{ fill:none; stroke:var(--purple); stroke-width:1.6; rx:2; }

    /* 10 s loop, five beats that enter and then hold.
       1 the bits each value needs   2 the line at b   3 the high bits of 90 leave
       4 the packed body   5 decode puts them back */
    #pf-line { animation:pfIn2 10s var(--ease) infinite; }
    #pf-high { animation:pfMove 10s var(--ease) infinite; }
    #pf-high .hi { animation:pfTint 10s var(--ease) infinite; }
    #pf-hole { animation:pfHole 10s var(--ease) infinite; }
    #pf-exc  { animation:pfIn3 10s var(--ease) infinite; }
    #pf-body { animation:pfIn4 10s var(--ease) infinite; }
    #pf-size { animation:pfSize 10s var(--ease) infinite; }
    #pf-mark, #pf-dec { animation:pfIn5 10s var(--ease) infinite; }

    @keyframes pfIn2 { 0%,14%{opacity:0} 20%,94%{opacity:1} 99%,100%{opacity:0} }
    @keyframes pfIn3 { 0%,36%{opacity:0} 44%,94%{opacity:1} 99%,100%{opacity:0} }
    @keyframes pfIn4 { 0%,52%{opacity:0} 60%,94%{opacity:1} 99%,100%{opacity:0} }
    @keyframes pfIn5 { 0%,72%{opacity:0} 80%,94%{opacity:1} 99%,100%{opacity:0} }
    @keyframes pfSize { 0%,52%{opacity:0} 60%,70%{opacity:1} 74%,100%{opacity:0} }
    @keyframes pfHole { 0%,36%{opacity:0} 44%,70%{opacity:1} 76%,100%{opacity:0} }
    @keyframes pfTint { 0%,28%{fill:var(--fit)} 33%,94%{fill:var(--over)} 99%,100%{fill:var(--fit)} }
    @keyframes pfMove { 0%,36%{transform:translate(0,0)} 44%,72%{transform:translate(98px,0)} 80%,100%{transform:translate(0,0)} }

    @media (prefers-reduced-motion:reduce){
      *{ animation:none !important; }
      #pf-high .hi{ fill:var(--over); }
      #pf-line,#pf-exc,#pf-body,#pf-mark,#pf-dec{ opacity:1; }
      #pf-hole,#pf-size{ opacity:0; }
    }
  ]]></style>

  <text x="16" y="16" class="lab">bits each value needs &#183; lowest at the bottom</text>

  <g>
    <rect class="lo" x="34" y="132" width="14" height="14"/><text class="bit" x="41.0" y="142.2" text-anchor="middle">1</text>
    <rect class="lo" x="34" y="118" width="14" height="14"/><text class="bit" x="41.0" y="128.2" text-anchor="middle">1</text>
    <text class="num" x="41.0" y="161" text-anchor="middle">3</text>
    <rect class="lo" x="58" y="132" width="14" height="14"/><text class="bit" x="65.0" y="142.2" text-anchor="middle">1</text>
    <rect class="lo" x="58" y="118" width="14" height="14"/><text class="bit" x="65.0" y="128.2" text-anchor="middle">0</text>
    <rect class="lo" x="58" y="104" width="14" height="14"/><text class="bit" x="65.0" y="114.2" text-anchor="middle">1</text>
    <text class="num" x="65.0" y="161" text-anchor="middle">5</text>
    <rect class="lo" x="82" y="132" width="14" height="14"/><text class="bit" x="89.0" y="142.2" text-anchor="middle">0</text>
    <rect class="lo" x="82" y="118" width="14" height="14"/><text class="bit" x="89.0" y="128.2" text-anchor="middle">1</text>
    <text class="num" x="89.0" y="161" text-anchor="middle">2</text>
    <rect class="lo" x="106" y="132" width="14" height="14"/><text class="bit" x="113.0" y="142.2" text-anchor="middle">1</text>
    <rect class="lo" x="106" y="118" width="14" height="14"/><text class="bit" x="113.0" y="128.2" text-anchor="middle">1</text>
    <rect class="lo" x="106" y="104" width="14" height="14"/><text class="bit" x="113.0" y="114.2" text-anchor="middle">1</text>
    <text class="num" x="113.0" y="161" text-anchor="middle">7</text>
    <rect class="lo" x="130" y="132" width="14" height="14"/><text class="bit" x="137.0" y="142.2" text-anchor="middle">0</text>
    <rect class="lo" x="130" y="118" width="14" height="14"/><text class="bit" x="137.0" y="128.2" text-anchor="middle">0</text>
    <rect class="lo" x="130" y="104" width="14" height="14"/><text class="bit" x="137.0" y="114.2" text-anchor="middle">1</text>
    <text class="num" x="137.0" y="161" text-anchor="middle">4</text>
    <rect class="lo" x="154" y="132" width="14" height="14"/><text class="bit" x="161.0" y="142.2" text-anchor="middle">0</text>
    <rect class="lo" x="154" y="118" width="14" height="14"/><text class="bit" x="161.0" y="128.2" text-anchor="middle">1</text>
    <rect class="lo" x="154" y="104" width="14" height="14"/><text class="bit" x="161.0" y="114.2" text-anchor="middle">1</text>
    <text class="num" x="161.0" y="161" text-anchor="middle">6</text>
    <rect class="lo" x="178" y="132" width="14" height="14"/><text class="bit" x="185.0" y="142.2" text-anchor="middle">1</text>
    <text class="num" x="185.0" y="161" text-anchor="middle">1</text>
    <rect class="lo" x="202" y="132" width="14" height="14"/><text class="bit" x="209.0" y="142.2" text-anchor="middle">0</text>
    <rect class="lo" x="202" y="118" width="14" height="14"/><text class="bit" x="209.0" y="128.2" text-anchor="middle">1</text>
    <rect class="lo" x="202" y="104" width="14" height="14"/><text class="bit" x="209.0" y="114.2" text-anchor="middle">0</text>
    <text class="num" x="209.0" y="161" text-anchor="middle">90</text>
  </g>

  <g id="pf-hole" opacity="0">
    <rect class="hole" x="202" y="90" width="14" height="14"/>
    <rect class="hole" x="202" y="76" width="14" height="14"/>
    <rect class="hole" x="202" y="62" width="14" height="14"/>
    <rect class="hole" x="202" y="48" width="14" height="14"/>
  </g>

  <g id="pf-exc" opacity="0">
    <rect class="boxr" x="288" y="38" width="106" height="76" rx="2"/>
    <text class="lab" x="288" y="32">exceptions</text>
    <text class="fx2" x="322" y="66">position 7</text>
    <text class="fx2" x="322" y="82">high 1011</text>
  </g>

  <g id="pf-high">
    <rect class="hi" x="202" y="90" width="14" height="14"/><text class="bit" x="209.0" y="100.2" text-anchor="middle">1</text>
    <rect class="hi" x="202" y="76" width="14" height="14"/><text class="bit" x="209.0" y="86.2" text-anchor="middle">1</text>
    <rect class="hi" x="202" y="62" width="14" height="14"/><text class="bit" x="209.0" y="72.2" text-anchor="middle">0</text>
    <rect class="hi" x="202" y="48" width="14" height="14"/><text class="bit" x="209.0" y="58.2" text-anchor="middle">1</text>
  </g>

  <g id="pf-line" opacity="0">
    <line class="water" x1="16" y1="104" x2="222" y2="104"/>
    <text class="bmark" x="226" y="108">b = 3</text>
  </g>

  <g id="pf-body" opacity="0">
    <text class="lab" x="16" y="182">body &#183; eight slots of b bits</text>
    <rect class="slot" x="22" y="190" width="12" height="14"/><text class="bit" x="28.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="34" y="190" width="12" height="14"/><text class="bit" x="40.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="46" y="190" width="12" height="14"/><text class="bit" x="52.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="62" y="190" width="12" height="14"/><text class="bit" x="68.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="74" y="190" width="12" height="14"/><text class="bit" x="80.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="86" y="190" width="12" height="14"/><text class="bit" x="92.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="102" y="190" width="12" height="14"/><text class="bit" x="108.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="114" y="190" width="12" height="14"/><text class="bit" x="120.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="126" y="190" width="12" height="14"/><text class="bit" x="132.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="142" y="190" width="12" height="14"/><text class="bit" x="148.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="154" y="190" width="12" height="14"/><text class="bit" x="160.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="166" y="190" width="12" height="14"/><text class="bit" x="172.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="182" y="190" width="12" height="14"/><text class="bit" x="188.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="194" y="190" width="12" height="14"/><text class="bit" x="200.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="206" y="190" width="12" height="14"/><text class="bit" x="212.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="222" y="190" width="12" height="14"/><text class="bit" x="228.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="234" y="190" width="12" height="14"/><text class="bit" x="240.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="246" y="190" width="12" height="14"/><text class="bit" x="252.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="262" y="190" width="12" height="14"/><text class="bit" x="268.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="274" y="190" width="12" height="14"/><text class="bit" x="280.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="286" y="190" width="12" height="14"/><text class="bit" x="292.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="302" y="190" width="12" height="14"/><text class="bit" x="308.0" y="200.2" text-anchor="middle">0</text>
    <rect class="slot" x="314" y="190" width="12" height="14"/><text class="bit" x="320.0" y="200.2" text-anchor="middle">1</text>
    <rect class="slot" x="326" y="190" width="12" height="14"/><text class="bit" x="332.0" y="200.2" text-anchor="middle">0</text>
  </g>

  <text id="pf-size" class="fx2" x="16" y="226" opacity="0">24 bits and one exception, not 8 &#215; 7 = 56</text>

  <rect id="pf-mark" class="mark" x="300.5" y="188.5" width="39" height="17"/>
  <g id="pf-dec" opacity="0">
    <text class="fx" x="16" y="226">decode 010 | 1011 &#171; 3 = 2 + 88 = 90</text>
    <text class="fx2" x="16" y="244">every slot is read at b, then exceptions are ORed back</text>
  </g>
</svg>
