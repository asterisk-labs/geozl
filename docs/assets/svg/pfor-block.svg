<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="Inside an OpenZL frame, pfor carries a nine-byte codec header, a 64-bit element count and an 8-bit element width, followed by blocks of 256 values back to back, the last one padded with zeros. Block 0, the eight example values repeated 32 times, holds b equal to 3, an exception count of 32, a format byte saying eb is 4 bits and positions are a bitmap, a 32-byte bitmap, 16 bytes of high bits 1011, and a 96-byte body of 256 three-bit slots in 16-byte lane groups, 147 bytes in all.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
    svg{--paper:#FFFFFF;--ink:#111111;--ink-2:#5C6370;--purple:#492AE8;--green:#1D9A4A;
      --fit:color-mix(in srgb,var(--green) 30%,var(--paper));--over:color-mix(in srgb,var(--purple) 22%,var(--paper));
      background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .lab{fill:var(--ink-2);font:500 11.5px "IBM Plex Mono",monospace;letter-spacing:.04em}
    .k{fill:var(--ink);font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
    .v{fill:var(--ink-2);font:500 11px "IBM Plex Mono",monospace;text-anchor:middle}
    .note{fill:var(--ink-2);font:500 10px "IBM Plex Mono",monospace;text-anchor:middle}
    .hd{fill:var(--paper);stroke:var(--ink);stroke-width:1}
    .blk{fill:var(--paper);stroke:var(--purple);stroke-width:1.8}
    .blk2{fill:var(--paper);stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 2}
    .exc{fill:var(--over);stroke:var(--purple);stroke-width:1.2}
    .fit{fill:var(--fit);stroke:var(--green);stroke-width:1.2}
    .brace{fill:none;stroke:var(--ink-2);stroke-width:1}
    .zoom{fill:none;stroke:var(--purple);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
  ]]></style>
  <text class="lab" x="20" y="22">pfor in a frame</text><rect class="hd" x="20" y="32" width="104" height="42" rx="3"/><text class="k" x="72.0" y="49">count</text><text class="v" x="72.0" y="65">uint64</text><rect class="hd" x="128" y="32" width="62" height="42" rx="3"/><text class="k" x="159.0" y="49">width</text><text class="v" x="159.0" y="65">uint8</text><rect class="blk" x="198" y="32" width="84" height="42" rx="3"/><text class="k" x="240.0" y="49">block 0</text><text class="v" x="240.0" y="65">256 values</text><rect class="blk2" x="286" y="32" width="84" height="42" rx="3"/><text class="k" x="328.0" y="49">block 1</text><rect class="blk2" x="374" y="32" width="84" height="42" rx="3"/><text class="k" x="416.0" y="49">block 2</text><text class="v" x="474" y="58">…</text><path class="brace" d="M20 82 V88 H190 V82"/><text class="note" x="105.0" y="102">codec header, 9 bytes</text><text class="lab" x="198" y="22">blocks of 256 values, back to back</text><text class="lab" x="20" y="136">block 0 up close, the eight values repeated 32 times</text><rect class="hd" x="20" y="150" width="46" height="42" rx="3"/><text class="k" x="43.0" y="167">b</text><text class="v" x="43.0" y="183">3</text><text class="note" x="43.0" y="210">1 byte</text><rect class="hd" x="70" y="150" width="56" height="42" rx="3"/><text class="k" x="98.0" y="167">count</text><text class="v" x="98.0" y="183">32</text><text class="note" x="98.0" y="210">1 byte</text><rect class="exc" x="130" y="150" width="100" height="42" rx="3"/><text class="k" x="180.0" y="167">format</text><text class="v" x="180.0" y="183">eb 4, bitmap</text><text class="note" x="180.0" y="210">1 byte</text><text class="note" x="180.0" y="224">if count &gt; 0</text><rect class="exc" x="234" y="150" width="96" height="42" rx="3"/><text class="k" x="282.0" y="167">positions</text><text class="v" x="282.0" y="183">bitmap</text><text class="note" x="282.0" y="210">32 bytes</text><text class="note" x="282.0" y="224">list below 32</text><rect class="exc" x="334" y="150" width="84" height="42" rx="3"/><text class="k" x="376.0" y="167">high bits</text><text class="v" x="376.0" y="183">32 × 1011</text><text class="note" x="376.0" y="210">16 bytes</text><text class="note" x="376.0" y="224">eb bits each</text><rect class="fit" x="422" y="150" width="192" height="42" rx="3"/><text class="k" x="518.0" y="167">body</text><text class="v" x="518.0" y="183">256 × 3 bits</text><text class="note" x="518.0" y="210">96 bytes</text><text class="note" x="518.0" y="224">32 × b, lane groups</text>
</svg>
