/text><path class="arr" d="M184.0 80.0 L40.0 162.0"/><path class="arr" d="M43.4 157.1 L40.0 162.0 L46.0 161.6"/><path class="arr" d="M484.0 80.0 L318.0 162.0"/><path class="arr" d="M321.7 157.3 L318.0 162.0 L324.0 161.9"/><text class="note" x="20.0" y="214.0">The hook checks the PFOR header against the frame, stages the payload as it is,</text><text class="good" x="20.0" y="230.0">and stops OpenZL before a single sample is decoded.</text></svg>
