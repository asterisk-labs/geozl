<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" width="640" height="278" role="img" aria-label="Two rows. Decoding on the CPU keeps the cores busy expanding the frame into the full raster, and then the whole raster crosses the bus. Decoding on the GPU sends only the compressed frame and a short task list across the bus, and the waves expand the raster in device memory while the CPU cores stay free.">
