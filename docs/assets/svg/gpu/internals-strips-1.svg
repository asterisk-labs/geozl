the size of body 0, so h1 is found only after h0 is read,</text><text class="lab" x="20" y="172">h2 only after h1, and so on through the whole payload.</text><text class="bad" x="20" y="206">the CPU walks every block in order before the GPU can start,</text><text class="bad" x="20" y="222">and hands it one task per block</text></svg>