.rule{stroke:#E3E5E8;stroke-width:1}
.brk{fill:none;stroke:#9AA1AB;stroke-width:1.1}]]></style><text class="cap" x="20" y="20">the same eight symbols, from the root and from the leaves</text><text class="lab" x="20" y="56">from the root</text><text class="lab" x="360" y="56">from the leaves</text><path class="rule" d="M340 44 V262"/><text class="lab" x="20" y="89">step 1</text><rect class="in" x="84" y="72" width="26" height="26" rx="3"/><text class="v" x="97.0" y="89.5">w</text><rect class="in" x="114" y="72" width="26" height="26" rx="3"/><text class="v" x="127.0" y="89.5">w</text><rect class="in" x="144" y="72" width="26" height="26" rx="3"/><text class="v" x="157.0" y="89.5">w</text><rect class="in" x="174" y="72" width="26" height="26" rx="3"/><text class="v" x="187.0" y="89.5">w</text><rect class="in" x="204" y="72" width="26" height="26" rx="3"/><text class="v" x="217.0" y="89.5">w</text><rect class="in" x="234" y="72" width="26" height="26" rx="3"/><text class="v" x="247.0" y="89.5">w</text><rect class="in" x="264" y="72" width="26" height="26" rx="3"/><text class="v" x="277.0" y="89.5">w</text><rect class="in" x="294" y="72" width="26" height="26" rx="3"/><text class="v" x="307.0" y="89.5">w</text><text class="lab" x="20" y="123">step 2</text><rect class="red" x="84" y="106" width="26" height="26" rx="3"/><text class="v" x="97.0" y="123.5">&#183;</text><rect class="in" x="114" y="106" width="26" height="26" rx="3"/><text class="v" x="127.0" y="123.5">w</text><rect class="red" x="144" y="106" width="26" height="26" rx="3"/><text class="v" x="157.0" y="123.5">&#183;</text><rect class="in" x="174" y="106" width="26" height="26" rx="3"/><text class="v" x="187.0" y="123.5">w</text><rect class="red" x="204" y="106" width="26" height="26" rx="3"/><text class="v" x="217.0" y="123.5">&#183;</text><rect class="in" x="234" y="106" width="26" height="26" rx="3"/><text class="v" x="247.0" y="123.5">w</text><rect class="red" x="264" y="106" width="26" height="26" rx="3"/><text class="v" x="277.0" y="123.5">&#183;</text><rect class="red" x="294" y="106" width="26" height="26" rx="3"/><text class="v" x="307.0" y="123.5">&#183;</text><rect class="red" x="84" y="148" width="236" height="26" rx="3"/><text class="vb" x="202" y="165.5">rank directory, its own pass</text><text class="bad" x="20" y="206">short codes idle while long ones walk,</text><text class="bad" x="20" y="222">and every step reads the directory</text><text class="lab" x="360" y="89">depth 2</text><rect class="out" x="424" y="72" width="26" height="26" rx="3"/><text class="v" x="437.0" y="89.5">b</text><rect class="out" x="454" y="72" width="26" height="26" rx="3"/><text class="v" x="467.0" y="89.5">b</text><rect class="out" x="484" y="72" width="26" height="26" rx="3"/><text class="v" x="497.0" y="89.5">c</text><text class="note" x="520" y="89">b and c leaves write</text><text class="lab" x="360" y="127">depth 1</text><rect class="out" x="424" y="110" width="26" height="26" rx="3"/><text class="v" x="437.0" y="127.5">b</text><rect class="out" x="454" y="110" width="26" height="26" rx="3"/><text class="v" x="467.0" y="127.5">c</text><rect class="out" x="484" y="110" width="26" height="26" rx="3"/><text class="v" x="497.0" y="127.5">b</text><text class="note" x="520" y="127">010 merges</text><text class="lab" x="360" y="165">depth 0</text><rect class="out" x="424" y="148" width="26" height="26" rx="3"/><text class="v" x="437.0" y="165.5">a</text><rect class="out" x="454" y="148" width="26" height="26" rx="3"/><text class="v" x="467.0" y="165.5">b</text><rect class="out" x="484" y="148" width="26" height="26" rx="3"/><text class="v" x="497.0" y="165.5">a</text><rect class="out" x="514" y="148" width="26" height="26" rx="3"/><text class="v" x="527.0" y="165.5">c</text><rect class="out" x="544" y="148" width="26" height="26" rx="3"/><text class="v" x="557.0" y="165.5">a</text><rect class="out" x="574" y="148" width="26" height="26" rx="3"/><text class="v" x="587.0" y="165.5">b</text><rect class="out" x="604" y="148" width="26" height="26" rx="3"/><text class="v" x="617.0" y="165.5">a</text><rect class="out" x="634" y="148" width="26" height="26" rx="3"/><text class="v" x="647.0" y="165.5">a</text><text class="good" x="360" y="206">the wave works on one node at a time,</text><text class="good" x="360" y="222">and no directory is needed</text><text class="note" x="20" y="250">w is a thread taking a step, a dot is a thread with nothing to do.</text></svg>