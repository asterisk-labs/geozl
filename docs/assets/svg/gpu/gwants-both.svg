<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" role="img" aria-label="The same eight symbols, from the root and from the leaves."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.labs{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace;text-anchor:middle}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.v{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vb{fill:#111111;font:600 11px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 12px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 12px "IBM Plex Mono",monospace}
.opm{fill:#492AE8;font:700 12px "IBM Plex Mono",monospace;text-anchor:middle}
.bad{fill:#C0392B;font:600 11px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.in{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.in2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.red{fill:#FDE8E8;stroke:#C0392B;stroke-width:1.2}
.ring{fill:none;stroke:#E0A800;stroke-width:2.4}
