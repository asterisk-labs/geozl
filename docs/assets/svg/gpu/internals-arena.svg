<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" height="230" role="img" aria-label="Before, each of three calls asked the operating system for GPU-readable memory, wrote its inputs and freed it. After, the first call asks once and the next two write into the same memory, so the three calls end sooner."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="bad" x="20" y="34">BEFORE</text><text class="ttl" x="90" y="34">every call asks for memory the GPU can read, then frees it</text><text class="lab" x="80" y="60">call 1</text><rect class="red" x="80" y="66" width="62" height="26" rx="3"/><text class="vs" x="111.0" y="83.0">ask OS</text><rect class="val2" x="144" y="66" width="90" height="26" rx="3"/><text class="vs" x="189.0" y="83.0">write inputs</text><rect class="red" x="236" y="66" width="40" height="26" rx="3"/><text class="vs" x="256.0" y="83.0">free</text><text class="lab" x="284" y="60">call 2</text><rect class="red" x="284" y="66" width="62" height="26" rx="3"/><text class="vs" x="315.0" y="83.0">ask OS</text><rect class="val2" x="348" y="66" width="90" height="26" rx="3"/><text class="vs" x="393.0" y="83.0">write inputs</text><rect class="red" x="440" y="66" width="40" height="26" rx="3"/><text class="vs" x="460.0" y="83.0">free</text><text class="lab" x="488" y="60">call 3</text><rect class="red" x="488" y="66" width="62" height="26" rx="3"/><text class="vs" x="519.0" y="83.0">ask OS</text><rect class="val2" x="552" y="66" width="90" height="26" rx="3"/><text class="vs" x="597.0" y="83.0">write inputs</text><rect class="red" x="644" y="66" width="40" height="26" rx="3"/><text class="vs" x="664.0" y="83.0">free</text><path class="rule" d="M20 120 H680"/><text class="good" x="20" y="144">AFTER</text><text class="ttl" x="90" y="144">the first call asks once, later calls write into the same memory</text><text class="lab" x="80" y="170">call 1</text><rect class="red" x="80" y="176" width="62" height="26" rx="3"/><text class="vs" x="111.0" y="193.0">ask OS</text><rect class="val2" x="144" y="176" width="90" height="26" rx="3"/><text class="vs" x="189.0" y="193.0">write inputs</text><text class="lab" x="242" y="170">call 2</text><rect class="val2" x="242" y="176" width="90" height="26" rx="3"/><text class="vs" x="287.0" y="193.0">write inputs</text><text class="lab" x="340" y="170">call 3</text><rect class="val2" x="340" y="176" width="90" height="26" rx="3"/><text class="vs" x="385.0" y="193.0">write inputs</text><path class="arr" d="M434 168 V210" stroke-dasharray="4 3"/><text class="good" x="442" y="200">the same three calls</text><text class="good" x="442" y="216">end here</text></svg>