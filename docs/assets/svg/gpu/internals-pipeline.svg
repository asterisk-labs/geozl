  <g id="cap0"><text class="capn" x="8" y="20">1</text><text class="cap" x="28" y="20">for call N the cpu captures and plans into arena 0</text></g>
  <g id="cap1"><text class="capn" x="8" y="20">2</text><text class="cap" x="28" y="20">the gpu decodes N while the cpu plans N+1 in arena 1</text></g>
  <g id="cap2"><text class="capn" x="8" y="20">3</text><text class="cap" x="28" y="20">call N+2 needs arena 0, so it waits for decode N</text></g>
  <g id="cap3"><text class="capn" x="8" y="20">4</text><text class="cap" x="28" y="20">then it plans into arena 0 while the gpu decodes N+1</text></g>
  <text id="capS" class="cap" x="8" y="20">the only wait comes when a call reuses the arena of the call two before it</text>
  <text class="lab" x="8" y="55">cpu</text><text class="lab" x="8" y="68">capture, plan</text>
  <text class="lab" x="8" y="103">gpu</text><text class="lab" x="8" y="116">decode</text>
