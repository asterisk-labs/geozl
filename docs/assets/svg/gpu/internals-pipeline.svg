    @keyframes k18{ 0%{transform:scaleX(0);opacity:1} 40.625%{transform:scaleX(0);animation-timing-function:linear} 43.75%{transform:scaleX(1)} 96.25%{opacity:1} 100%{transform:scaleX(1);opacity:0} }
