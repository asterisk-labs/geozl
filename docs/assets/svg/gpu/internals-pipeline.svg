<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-label="A timeline with a CPU track, a GPU track and the two staging arenas. The CPU plans call N into arena 0 and returns; the GPU decodes N while the CPU plans N+1 into arena 1; call N+2 needs arena 0, so it waits until decode N finishes, then plans into arena 0 while the GPU decodes N+1 and N+2 back to back.">
