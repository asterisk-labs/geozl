.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">4</tspan>  one copy moves payloads and tasks to the device, one wave per task</text><text class="smL" x="20.0" y="40.0">one frame, a 2 MiB tile through id&gt;pfor</text><rect class="dim" x="20.0" y="46.0" width="160.0" height="32.0" rx="3"/><text class="vs" x="100.0" y="59.5" text-anchor="middle">frame header, graph</text><text class="vs" x="100.0" y="72.5" text-anchor="middle">and codec headers</text><rect class="val2" x="180.0" y="46.0" width="62.0" height="32.0" rx="3"/><text class="vs" x="211.0" y="66.0" text-anchor="middle">block 0</text><rect class="val2" x="242.0" y="46.0" width="62.0" height="32.0" rx="3"/><text class="vs" x="273.0" y="66.0" text-anchor="middle">block 1</text><rect class="val2" x="304.0" y="46.0" width="62.0" height="32.0" rx="3"/><text class="vs" x="335.0" y="66.0" text-anchor="middle">block 2</text><rect class="cell" x="366.0" y="46.0" width="60.0" height="32.0" rx="3"/><text class="vs" x="396.0" y="66.0" text-anchor="middle">...</text><rect class="val2" x="426.0" y="46.0" width="62.0" height="32.0" rx="3"/><text class="vs" x="457.0" y="59.5" text-anchor="middle">block</text><text class="vs" x="457.0" y="72.5" text-anchor="middle">4095</text><rect class="dim" x="488.0" y="46.0" width="70.0" height="32.0" rx="3"/><text class="vs" x="523.0" y="66.0" text-anchor="middle">checksum</text><text class="smL" x="680.0" y="114.0" text-anchor="end">staging, page-locked or shared memory the GPU can read</text><rect class="panel" x="20.0" y="120.0" width="660.0" height="30.0" rx="4"/><rect class="val2" x="24.0" y="124.0" width="300.0" height="22.0" rx="3"/><text class="vs" x="174.0" y="139.0" text-anchor="middle">frame 0 slot, its 4096 blocks</text><rect class="dim" x="328.0" y="124.0" width="150.0" height="22.0" rx="3"/><text class="vs" x="403.0" y="139.0" text-anchor="middle">frame 1 slot</text><rect class="hot" x="482.0" y="124.0" width="194.0" height="22.0" rx="3"/><text class="vs" x="579.0" y="139.0" text-anchor="middle">tasks</text><path class="arr" d="M350.0 154.0 L350.0 182.0"/><path class="arr" d="M347.4 176.6 L350.0 182.0 L352.6 176.6"/><text class="smL" x="360.0" y="172.0">one copy across the bus</text><rect class="panel" x="20.0" y="186.0" width="660.0" height="30.0" rx="4"/><text class="smL" x="26.0" y="205.0">device</text><rect class="val2" x="80.0" y="190.0" width="300.0" height="22.0" rx="3"/><text class="vs" x="230.0" y="205.0" text-anchor="middle">payloads</text><rect class="hot" x="384.0" y="190.0" width="292.0" height="22.0" rx="3"/><text class="vs" x="530.0" y="205.0" text-anchor="middle">tasks</text><rect class="val" x="400.0" y="252.0" width="62.0" height="22.0" rx="3"/><text class="vs" x="431.0" y="267.0" text-anchor="middle">wave 0</text><path class="arrg" d="M431.0 214.0 L431.0 250.0"/><path class="arrg" d="M428.4 244.6 L431.0 250.0 L433.6 244.6"/><rect class="val" x="470.0" y="252.0" width="62.0" height="22.0" rx="3"/><text class="vs" x="501.0" y="267.0" text-anchor="middle">wave 1</text><path class="arrg" d="M501.0 214.0 L501.0 250.0"/><path class="arrg" d="M498.4 244.6 L501.0 250.0 L503.6 244.6"/><rect class="val" x="540.0" y="252.0" width="62.0" height="22.0" rx="3"/><text class="vs" x="571.0" y="267.0" text-anchor="middle">wave 2</text><path class="arrg" d="M571.0 214.0 L571.0 250.0"/><path class="arrg" d="M568.4 244.6 L571.0 250.0 L573.6 244.6"/><rect class="val" x="610.0" y="252.0" width="62.0" height="22.0" rx="3"/><text class="vs" x="641.0" y="267.0" text-anchor="middle">wave 3</text><path class="arrg" d="M641.0 214.0 L641.0 250.0"/><path class="arrg" d="M638.4 244.6 L641.0 250.0 L643.6 244.6"/><text class="note" x="20.0" y="262.0">Each wave reads its task,</text><text class="note" x="20.0" y="278.0">jumps to payOff and decodes</text><text class="note" x="20.0" y="294.0">one block into outBase.</text></svg>
