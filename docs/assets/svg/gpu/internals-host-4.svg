<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="Step 4 of 4. the GPU gets the blocks and tasks, one wave per task."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">4</tspan>  the GPU gets the blocks and tasks, one wave per task</text><text class="smL" x="20" y="44">staging, memory the GPU can read</text><rect class="val2" x="20" y="52" width="340" height="30" rx="3"/><text class="vs" x="190.0" y="71.0">the 4096 compressed blocks, as they are</text><rect class="hot" x="370" y="52" width="230" height="30" rx="3"/><text class="vs" x="485.0" y="71.0">4096 tasks</text><path class="arr" d="M310 86 L310 118"/><path class="arr" d="M307.1 112.7 L310 118 L312.9 112.7"/><text class="op" x="322" y="106">one copy across the bus</text><text class="smL" x="20" y="118">GPU</text><rect class="val" x="20" y="126" width="130" height="30" rx="3"/><text class="vs" x="85.0" y="145.0">wave 0</text><rect class="val" x="170" y="126" width="130" height="30" rx="3"/><text class="vs" x="235.0" y="145.0">wave 1</text><rect class="val" x="320" y="126" width="130" height="30" rx="3"/><text class="vs" x="385.0" y="145.0">wave 2</text><rect class="val" x="470" y="126" width="130" height="30" rx="3"/><text class="vs" x="535.0" y="145.0">&#8230;</text><text class="note" x="20" y="190">Each wave takes one task, reads its block from the copied bytes,</text><text class="note" x="20" y="206">decodes it and writes its 256 values into the tensor.</text><text class="good" x="20" y="230">the GPU never reads the frame header, only blocks and tasks</text></svg>