<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 166" width="700" height="166" role="img" aria-label="The path of a batch. On the host, CPU threads capture each frame's payload, plan one task per block and stage both in memory the GPU can read. Across the bus, GPU waves unpack the PFOR or PivCo blocks, undo planar and place the samples into the caller's tensor."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><rect class="panel" x="20.0" y="34.0" width="300.0" height="120.0" rx="6"/><text class="ttl" x="32.0" y="52.0">host, CPU threads</text><rect class="panel" x="380.0" y="34.0" width="300.0" height="120.0" rx="6"/><text class="ttl" x="392.0" y="52.0">device, GPU waves</text><rect class="val" x="32.0" y="66.0" width="50.0" height="26.0" rx="3"/><text class="vs" x="57.0" y="83.0" text-anchor="middle">frames</text><rect class="hot" x="96.0" y="66.0" width="66.0" height="26.0" rx="3"/><text class="vs" x="129.0" y="83.0" text-anchor="middle">capture</text><rect class="hot" x="170.0" y="66.0" width="66.0" height="26.0" rx="3"/><text class="vs" x="203.0" y="83.0" text-anchor="middle">plan</text><rect class="hot" x="244.0" y="66.0" width="66.0" height="26.0" rx="3"/><text class="vs" x="277.0" y="83.0" text-anchor="middle">stage</text><path class="arr" d="M83.0 79.0 L95.0 79.0"/><path class="arr" d="M89.6 81.6 L95.0 79.0 L89.6 76.4"/><path class="arr" d="M163.0 79.0 L169.0 79.0"/><path class="arr" d="M163.6 81.6 L169.0 79.0 L163.6 76.4"/><path class="arr" d="M237.0 79.0 L243.0 79.0"/><path class="arr" d="M237.6 81.6 L243.0 79.0 L237.6 76.4"/><text class="smL" x="32.0" y="120.0">find the payload, write one task</text><text class="smL" x="32.0" y="134.0">per block, put both where the GPU reads</text><path class="arr" d="M312.0 79.0 L388.0 79.0"/><path class="arr" d="M382.6 81.6 L388.0 79.0 L382.6 76.4"/><text class="sm" x="350.0" y="72.0">bus</text><rect class="val2" x="392.0" y="66.0" width="66.0" height="26.0" rx="3"/><text class="vs" x="425.0" y="83.0" text-anchor="middle">unpack</text><rect class="val2" x="466.0" y="66.0" width="66.0" height="26.0" rx="3"/><text class="vs" x="499.0" y="76.5" text-anchor="middle">undo</text><text class="vs" x="499.0" y="89.5" text-anchor="middle">planar</text><rect class="val2" x="540.0" y="66.0" width="66.0" height="26.0" rx="3"/><text class="vs" x="573.0" y="83.0" text-anchor="middle">place</text><path class="arr" d="M459.0 79.0 L465.0 79.0"/><path class="arr" d="M459.6 81.6 L465.0 79.0 L459.6 76.4"/><path class="arr" d="M533.0 79.0 L539.0 79.0"/><path class="arr" d="M533.6 81.6 L539.0 79.0 L533.6 76.4"/><rect class="out" x="620.0" y="66.0" width="50.0" height="26.0" rx="3"/><text class="vs" x="645.0" y="83.0" text-anchor="middle">tensor</text><path class="arr" d="M606.0 79.0 L619.0 79.0"/><path class="arr" d="M613.6 81.6 L619.0 79.0 L613.6 76.4"/><text class="smL" x="392.0" y="120.0">PFOR or PivCo blocks, planar scans,</text><text class="smL" x="392.0" y="134.0">copies into the caller's tensor</text></svg>
