<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 266" width="640" height="266" role="img" aria-label="A data-dependent lane selector may choose FSE, PivCo or byte PFOR, so the CTid does not reveal the layout. The fixed lanes format chooses only PivCo Huffman or byte PFOR, whichever is smaller, so the GPU can plan the frame from its CTid."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.tag{fill:#5C6370;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.tagA{fill:#492AE8;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.ttl{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.c{fill:#111111;font:600 11px "IBM Plex Mono",monospace;text-anchor:middle}
.cs{fill:#111111;font:500 10.5px "IBM Plex Mono",monospace;text-anchor:middle}
.bx{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.2}
.ok{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.q{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.2}
.grey{fill:#F3F3F1;stroke:#9AA1AB;stroke-width:1.1}
.bad{fill:#FDE8E8;stroke:#C0392B;stroke-width:1.1}
.badt{fill:#C0392B;font:600 10.5px "IBM Plex Mono",monospace}
.okt{fill:#1D7A3E;font:600 10.5px "IBM Plex Mono",monospace}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.bar{stroke:#C0392B;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}]]></style><text class="tag" x="20" y="20">DYNAMIC</text><text class="ttl" x="84" y="20">a selector may choose per lane</text><rect class="bx" x="20" y="52" width="110" height="36" rx="4"/><text class="c" x="75.0" y="74.0">byte lane</text><rect class="q" x="172" y="46" width="170" height="48" rx="4"/><text class="c" x="257.0" y="67.0">one value holds</text><text class="c" x="257.0" y="81.0">over half of it?</text><path class="arr" d="M130 70 L170 70"/><path class="arr" d="M164.6 72.6 L170 70 L164.6 67.4"/><rect class="grey" x="400" y="34" width="220" height="30" rx="4"/><text class="c" x="510.0" y="53.0">FSE entropy coder</text><rect class="ok" x="400" y="78" width="220" height="30" rx="4"/><text class="c" x="510.0" y="97.0">PivCo or byte PFOR</text><path class="arr" d="M342 62 L398 49"/><path class="arr" d="M393.3 52.8 L398 49 L392.1 47.7"/><text class="lab" x="360" y="46">yes</text><path class="arr" d="M342 78 L398 93"/><path class="arr" d="M392.1 94.1 L398 93 L393.5 89.1"/><text class="lab" x="362" y="100">no</text><text class="badt" x="20" y="128">which coder a lane gets depends on its data, so a GPU cannot know the layout from the CTid</text><line class="rule" x1="20" y1="146" x2="620" y2="146"/><text class="tagA" x="20" y="172">FIXED</text><text class="ttl" x="84" y="172">the CTid names the complete layout</text><rect class="bx" x="20" y="196" width="110" height="36" rx="4"/><text class="c" x="75.0" y="218.0">byte lane</text><rect class="ok" x="172" y="196" width="448" height="36" rx="4"/><text class="c" x="396.0" y="218.0">PivCo Huffman or byte PFOR, whichever is smaller</text><path class="arr" d="M130 214 L170 214"/><path class="arr" d="M164.6 216.6 L170 214 L164.6 211.4"/><text class="okt" x="172" y="252">every lane is one of two known layouts, so a GPU can read any lanes frame</text></svg>
