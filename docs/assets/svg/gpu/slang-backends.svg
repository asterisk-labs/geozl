<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 232" width="660" height="232" role="img" aria-label="Capture, planning, task lists and staging are shared by every backend. runtime.c checks each call and forwards it through the GeozlGpuBackendOps table to runtime_metal.m under GEOZL_GPU_METAL or runtime_cuda.c under GEOZL_GPU_CUDA. A new backend such as WebGPU, Vulkan or HIP adds one runtime file and its Slang target in build_gpu_modules.py."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
