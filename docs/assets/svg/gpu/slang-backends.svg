.arrr{fill:none;stroke:#C0392B;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#B9BEC6;stroke-width:1.1}
.lnh{stroke:#E0A800;stroke-width:2.2}
.rule{stroke:#E3E5E8;stroke-width:1}]]></style><text class="ttl" x="20" y="20">shared by every backend</text><rect class="grey" x="20" y="32" width="144" height="28" rx="4"/><text class="cs" x="92.0" y="50.0">capture</text><rect class="grey" x="176" y="32" width="144" height="28" rx="4"/><text class="cs" x="248.0" y="50.0">planning</text><rect class="grey" x="332" y="32" width="144" height="28" rx="4"/><text class="cs" x="404.0" y="50.0">task lists</text><rect class="grey" x="488" y="32" width="144" height="28" rx="4"/><text class="cs" x="560.0" y="50.0">staging</text><rect class="q" x="20" y="84" width="612" height="30" rx="4"/><text class="cs" x="326.0" y="103.0">runtime.c checks each call and forwards it through GeozlGpuBackendOps</text><path class="arr" d="M326 60 L326 82"/><path class="arr" d="M323.4 76.6 L326 82 L328.6 76.6"/><rect class="bx" x="20" y="146" width="188" height="42" rx="4"/><text class="cs" x="114.0" y="164.0">runtime_metal.m</text><text class="cs" x="114.0" y="178.0">GEOZL_GPU_METAL</text><path class="arr" d="M326 114 L114 144"/><path class="arr" d="M119.0 140.7 L114 144 L119.7 145.8"/><rect class="bx" x="232" y="146" width="188" height="42" rx="4"/><text class="cs" x="326.0" y="164.0">runtime_cuda.c</text><text class="cs" x="326.0" y="178.0">GEOZL_GPU_CUDA</text><path class="arr" d="M326 114 L326 144"/><path class="arr" d="M323.4 138.6 L326 144 L328.6 138.6"/><rect class="plan" x="444" y="146" width="188" height="42" rx="4"/><text class="cs" x="538.0" y="164.0">a new runtime file</text><text class="cs" x="538.0" y="178.0">WebGPU, Vulkan or HIP</text><path class="arrg" d="M326 114 L538 144"/><path class="arr" d="M532.3 145.8 L538 144 L533.0 140.7"/><text class="sm" x="444" y="206">plus its Slang target in</text><text class="sm" x="444" y="220">build_gpu_modules.py</text></svg>
