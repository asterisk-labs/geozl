.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">3</tspan>  plan, the CPU writes one task per block</text><text class="smL" x="20" y="44">one compressed frame in host memory</text><rect class="dim" x="20" y="52" width="150" height="30" rx="3"/><text class="vs" x="95.0" y="71.0">header, codec graph</text><rect class="dim" x="170" y="52" width="70" height="30" rx="3"/><text class="vs" x="205.0" y="71.0">block 0</text><rect class="dim" x="240" y="52" width="70" height="30" rx="3"/><text class="vs" x="275.0" y="71.0">block 1</text><rect class="dim" x="310" y="52" width="70" height="30" rx="3"/><text class="vs" x="345.0" y="71.0">block 2</text><rect class="dim" x="380" y="52" width="70" height="30" rx="3"/><text class="vs" x="415.0" y="71.0">&#8230;</text><rect class="dim" x="450" y="52" width="70" height="30" rx="3"/><text class="vs" x="485.0" y="71.0">block 4095</text><rect class="dim" x="520" y="52" width="80" height="30" rx="3"/><text class="vs" x="560.0" y="71.0">checksum</text><text class="smL" x="20" y="124">staging, memory the GPU can read</text><rect class="val2" x="20" y="132" width="340" height="30" rx="3"/><text class="vs" x="190.0" y="151.0">the 4096 compressed blocks, as they are</text><rect class="hot" x="370" y="132" width="230" height="30" rx="3"/><text class="vs" x="485.0" y="151.0">4096 tasks</text><rect class="dim" x="20" y="182" width="60" height="22" rx="3"/><text class="vs" x="50.0" y="197.0">block</text><rect class="dim" x="80" y="182" width="120" height="22" rx="3"/><text class="vs" x="140.0" y="197.0">read from byte</text><rect class="dim" x="200" y="182" width="120" height="22" rx="3"/><text class="vs" x="260.0" y="197.0">write to value</text><rect class="dim" x="320" y="182" width="70" height="22" rx="3"/><text class="vs" x="355.0" y="197.0">values</text><rect class="hot" x="20" y="204" width="60" height="22" rx="3"/><text class="vs" x="50.0" y="219.0">0</text><rect class="hot" x="80" y="204" width="120" height="22" rx="3"/><text class="vs" x="140.0" y="219.0">0</text><rect class="hot" x="200" y="204" width="120" height="22" rx="3"/><text class="vs" x="260.0" y="219.0">0</text><rect class="hot" x="320" y="204" width="70" height="22" rx="3"/><text class="vs" x="355.0" y="219.0">256</text><rect class="hot" x="20" y="226" width="60" height="22" rx="3"/><text class="vs" x="50.0" y="241.0">1</text><rect class="hot" x="80" y="226" width="120" height="22" rx="3"/><text class="vs" x="140.0" y="241.0">104</text><rect class="hot" x="200" y="226" width="120" height="22" rx="3"/><text class="vs" x="260.0" y="241.0">256</text><rect class="hot" x="320" y="226" width="70" height="22" rx="3"/><text class="vs" x="355.0" y="241.0">256</text><rect class="hot" x="20" y="248" width="60" height="22" rx="3"/><text class="vs" x="50.0" y="263.0">2</text><rect class="hot" x="80" y="248" width="120" height="22" rx="3"/><text class="vs" x="140.0" y="263.0">199</text><rect class="hot" x="200" y="248" width="120" height="22" rx="3"/><text class="vs" x="260.0" y="263.0">512</text><rect class="hot" x="320" y="248" width="70" height="22" rx="3"/><text class="vs" x="355.0" y="263.0">256</text><text class="note" x="400" y="196">For each block the CPU checks</text><text class="note" x="400" y="212">that its lengths fit, then</text><text class="note" x="400" y="228">writes one task: where its</text><text class="note" x="400" y="244">bytes start and where its</text><text class="note" x="400" y="260">values go in the tensor.</text><text class="bad" x="400" y="282">one bad block rejects the call</text></svg>