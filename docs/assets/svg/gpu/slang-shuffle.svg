<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" width="700" height="370" role="img" aria-label="A shuffle lets each thread of a wave read a value from another thread, here the thread one to its left. Slang's CUDA code asks which threads are active before each of the about fifty shuffles per block, which made the strip decoder more than twice as slow on an A100. GeoZL calls the shuffle directly with a mask of all 32 threads, so there is no question to ask."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="ttl" x="20" y="30">a shuffle, each thread reads a value from another thread of its wave</text><text class="lab" x="20" y="66">before</text><text class="lab" x="20" y="126">after shuffle</text><text class="lab" x="20" y="142">up by 1</text><text class="sm" x="169" y="46">t0</text><rect class="val" x="150" y="52" width="38" height="22" rx="3"/><text class="vs" x="169.0" y="67.0">3</text><rect class="dim" x="150" y="112" width="38" height="22" rx="3"/><text class="vs" x="169.0" y="127.0">3</text><text class="sm" x="215" y="46">t1</text><rect class="val" x="196" y="52" width="38" height="22" rx="3"/><text class="vs" x="215.0" y="67.0">1</text><rect class="out" x="196" y="112" width="38" height="22" rx="3"/><text class="vs" x="215.0" y="127.0">3</text><path class="arr" d="M169 76 L213 108"/><path class="arr" d="M207.5 105 L213 108 L212 101.5"/><text class="sm" x="261" y="46">t2</text><rect class="val" x="242" y="52" width="38" height="22" rx="3"/><text class="vs" x="261.0" y="67.0">4</text><rect class="out" x="242" y="112" width="38" height="22" rx="3"/><text class="vs" x="261.0" y="127.0">1</text><path class="arr" d="M215 76 L259 108"/><path class="arr" d="M253.5 105 L259 108 L258 101.5"/><text class="sm" x="307" y="46">t3</text><rect class="val" x="288" y="52" width="38" height="22" rx="3"/><text class="vs" x="307.0" y="67.0">1</text><rect class="out" x="288" y="112" width="38" height="22" rx="3"/><text class="vs" x="307.0" y="127.0">4</text><path class="arr" d="M261 76 L305 108"/><path class="arr" d="M299.5 105 L305 108 L304 101.5"/><text class="sm" x="353" y="46">t4</text><rect class="val" x="334" y="52" width="38" height="22" rx="3"/><text class="vs" x="353.0" y="67.0">5</text><rect class="out" x="334" y="112" width="38" height="22" rx="3"/><text class="vs" x="353.0" y="127.0">1</text><path class="arr" d="M307 76 L351 108"/><path class="arr" d="M345.5 105 L351 108 L350 101.5"/><text class="sm" x="399" y="46">t5</text><rect class="val" x="380" y="52" width="38" height="22" rx="3"/><text class="vs" x="399.0" y="67.0">9</text><rect class="out" x="380" y="112" width="38" height="22" rx="3"/><text class="vs" x="399.0" y="127.0">5</text><path class="arr" d="M353 76 L397 108"/><path class="arr" d="M391.5 105 L397 108 L396 101.5"/><text class="sm" x="445" y="46">t6</text><rect class="val" x="426" y="52" width="38" height="22" rx="3"/><text class="vs" x="445.0" y="67.0">2</text><rect class="out" x="426" y="112" width="38" height="22" rx="3"/><text class="vs" x="445.0" y="127.0">9</text><path class="arr" d="M399 76 L443 108"/><path class="arr" d="M437.5 105 L443 108 L442 101.5"/><text class="sm" x="491" y="46">t7</text><rect class="val" x="472" y="52" width="38" height="22" rx="3"/><text class="vs" x="491.0" y="67.0">6</text><rect class="out" x="472" y="112" width="38" height="22" rx="3"/><text class="vs" x="491.0" y="127.0">2</text><path class="arr" d="M445 76 L489 108"/><path class="arr" d="M483.5 105 L489 108 L488 101.5"/><text class="lab" x="522" y="67">&#8230; t31</text><path class="rule" d="M20 158 H680"/><text class="bad" x="20" y="184">SLANG</text><text class="ttl" x="90" y="184">CUDA code asks which threads are active before each shuffle</text><rect class="red" x="20" y="198" width="70" height="26" rx="3"/><text class="vs" x="55.0" y="208.5">who is</text><text class="vs" x="55.0" y="221.5">active?</text><rect class="val" x="92" y="198" width="58" height="26" rx="3"/><text class="vs" x="121.0" y="215.0">shuffle</text><rect class="red" x="152" y="198" width="70" height="26" rx="3"/><text class="vs" x="187.0" y="208.5">who is</text><text class="vs" x="187.0" y="221.5">active?</text><rect class="val" x="224" y="198" width="58" height="26" rx="3"/><text class="vs" x="253.0" y="215.0">shuffle</text><rect class="red" x="284" y="198" width="70" height="26" rx="3"/><text class="vs" x="319.0" y="208.5">who is</text><text class="vs" x="319.0" y="221.5">active?</text><rect class="val" x="356" y="198" width="58" height="26" rx="3"/><text class="vs" x="385.0" y="215.0">shuffle</text><rect class="red" x="416" y="198" width="70" height="26" rx="3"/><text class="vs" x="451.0" y="208.5">who is</text><text class="vs" x="451.0" y="221.5">active?</text><rect class="val" x="488" y="198" width="58" height="26" rx="3"/><text class="vs" x="517.0" y="215.0">shuffle</text><text class="lab" x="552" y="215">&#8230; 50 per block</text><text class="bad" x="20" y="244">more than twice the time on an A100</text><path class="rule" d="M20 260 H680"/><text class="good" x="20" y="286">GEOZL</text><text class="ttl" x="90" y="286">all 32 threads always take part, so it shuffles directly</text><rect class="val" x="20" y="300" width="58" height="26" rx="3"/><text class="vs" x="49.0" y="317.0">shuffle</text><rect class="val" x="80" y="300" width="58" height="26" rx="3"/><text class="vs" x="109.0" y="317.0">shuffle</text><rect class="val" x="140" y="300" width="58" height="26" rx="3"/><text class="vs" x="169.0" y="317.0">shuffle</text><rect class="val" x="200" y="300" width="58" height="26" rx="3"/><text class="vs" x="229.0" y="317.0">shuffle</text><text class="lab" x="264" y="317">&#8230; 50 per block</text><text class="good" x="20" y="346">__shfl_up_sync(0xffffffff, ...), the mask says every thread</text></svg>