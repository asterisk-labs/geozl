<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 312" width="660" height="312" role="img" aria-label="A driver loads PTX only up to its own PTX version. A 550 driver reads PTX up to 8.4. NVRTC 12.2 writes .version 8.2, which loads, and is what GeoZL ships. NVRTC 12.8 writes .version 8.7, which the 550 driver rejects. Once loaded, the driver compiles the PTX for the GPU it finds, from sm_70, the PTX target, to any newer GPU."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.tag{fill:#5C6370;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.tagA{fill:#492AE8;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 10px "IBM Plex Mono",monospace}
