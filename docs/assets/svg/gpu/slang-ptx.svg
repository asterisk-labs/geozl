.okt{fill:#1D7A3E;font:600 10.5px "IBM Plex Mono",monospace}
.pt{fill:#492AE8;font:600 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 12px "IBM Plex Mono",monospace}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 3}
.arrr{fill:none;stroke:#C0392B;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#B9BEC6;stroke-width:1.1}
.lnh{stroke:#E0A800;stroke-width:2.2}
.rule{stroke:#E3E5E8;stroke-width:1}]]></style><text class="ttl" x="20" y="20">a driver loads PTX up to its own PTX version</text><rect class="ok" x="60" y="46" width="280.0" height="24" rx="3"/><text class="okt" x="68" y="62">a 550 driver reads PTX up to 8.4</text><line class="rule" x1="60" y1="80" x2="620" y2="80" style="stroke:#9AA1AB"/><line class="ln" x1="60.0" y1="76" x2="60.0" y2="84"/><text class="sm" x="60.0" y="98" text-anchor="middle">8.0</text><line class="ln" x1="199.99999999999937" y1="76" x2="199.99999999999937" y2="84"/><text class="sm" x="199.99999999999937" y="98" text-anchor="middle">8.2</text><line class="ln" x1="340.0" y1="76" x2="340.0" y2="84"/><text class="sm" x="340.0" y="98" text-anchor="middle">8.4</text><line class="ln" x1="479.9999999999994" y1="76" x2="479.9999999999994" y2="84"/><text class="sm" x="479.9999999999994" y="98" text-anchor="middle">8.6</text><line class="ln" x1="620.0" y1="76" x2="620.0" y2="84"/><text class="sm" x="620.0" y="98" text-anchor="middle">8.8</text><text class="sm" x="60" y="114">PTX version</text><path class="arr" d="M199.99999999999937 126 L199.99999999999937 86"/><path class="arr" d="M202.6 91.4 L199.99999999999937 86 L197.4 91.4"/><text class="cl" x="199.99999999999937" y="142" text-anchor="start">NVRTC 12.2 writes .version 8.2</text><text class="okt" x="199.99999999999937" y="158" text-anchor="start">loads, this is what GeoZL ships</text><path class="arrr" d="M549.9999999999991 166 L549.9999999999991 86"/><path class="arrr" d="M552.6 91.4 L549.9999999999991 86 L547.4 91.4"/><text class="cl" x="549.9999999999991" y="182" text-anchor="end">NVRTC 12.8 writes .version 8.7</text><text class="badt" x="549.9999999999991" y="198" text-anchor="end">the 550 driver rejects it</text><line class="rule" x1="20" y1="222" x2="640" y2="222"/><text class="ttl" x="20" y="246">then the driver compiles it for the GPU it finds</text><rect class="bx" x="20" y="266" width="130" height="30" rx="4"/><text class="cs" x="85.0" y="285.0">pfor2.ptx</text><rect class="q" x="190" y="266" width="130" height="30" rx="4"/><text class="cs" x="255.0" y="285.0">driver JIT</text><path class="arr" d="M150 281 L188 281"/><path class="arr" d="M182.6 283.6 L188 281 L182.6 278.4"/><text class="cl" x="370" y="274">machine code for sm_70, the PTX target</text><path class="arr" d="M320 281 L364 270"/><path class="arr" d="M359.4 273.8 L364 270 L358.1 268.8"/><text class="cl" x="370" y="300">machine code for any newer NVIDIA GPU</text><path class="arr" d="M320 281 L364 296"/><path class="arr" d="M358.0 296.7 L364 296 L359.7 291.8"/></svg>
