<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" role="img" aria-label="Step 1 of 6. a group of four waves takes one block and loads its tree."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">1</tspan>  a group of four waves takes one block and loads its tree</text><rect class="panel" x="20.0" y="40.0" width="250.0" height="120.0" rx="6"/><text class="ttl" x="32.0" y="58.0">one group, 128 threads</text><rect class="val" x="32.0" y="70.0" width="52.0" height="24.0" rx="3"/><text class="vs" x="58.0" y="86.0" text-anchor="middle">wave 0</text><rect class="val" x="90.0" y="70.0" width="52.0" height="24.0" rx="3"/><text class="vs" x="116.0" y="86.0" text-anchor="middle">wave 1</text><rect class="val" x="148.0" y="70.0" width="52.0" height="24.0" rx="3"/><text class="vs" x="174.0" y="86.0" text-anchor="middle">wave 2</text><rect class="val" x="206.0" y="70.0" width="52.0" height="24.0" rx="3"/><text class="vs" x="232.0" y="86.0" text-anchor="middle">wave 3</text><text class="smL" x="32.0" y="116.0">32 threads each, they share</text><text class="smL" x="32.0" y="130.0">shared memory and barriers</text><rect class="panel" x="300.0" y="40.0" width="380.0" height="120.0" rx="6"/><text class="ttl" x="312.0" y="58.0">shared memory, the block's node table</text><rect class="dim" x="312.0" y="66.0" width="80.0" height="16.0" rx="3"/><text class="vs" x="352.0" y="78.0" text-anchor="middle">node</text><rect class="dim" x="396.0" y="66.0" width="60.0" height="16.0" rx="3"/><text class="vs" x="426.0" y="78.0" text-anchor="middle">depth</text><rect class="dim" x="460.0" y="66.0" width="190.0" height="16.0" rx="3"/><text class="vs" x="555.0" y="78.0" text-anchor="middle">kind</text><rect class="val2" x="312.0" y="84.0" width="80.0" height="16.0" rx="3"/><text class="vs" x="352.0" y="96.0" text-anchor="middle">root</text><rect class="val2" x="396.0" y="84.0" width="60.0" height="16.0" rx="3"/><text class="vs" x="426.0" y="96.0" text-anchor="middle">0</text><rect class="val2" x="460.0" y="84.0" width="190.0" height="16.0" rx="3"/><text class="vs" x="555.0" y="96.0" text-anchor="middle">bitmap 01010100</text><rect class="val2" x="312.0" y="102.0" width="80.0" height="16.0" rx="3"/><text class="vs" x="352.0" y="114.0" text-anchor="middle">a</text><rect class="val2" x="396.0" y="102.0" width="60.0" height="16.0" rx="3"/><text class="vs" x="426.0" y="114.0" text-anchor="middle">1</text><rect class="val2" x="460.0" y="102.0" width="190.0" height="16.0" rx="3"/><text class="vs" x="555.0" y="114.0" text-anchor="middle">leaf</text><rect class="val2" x="312.0" y="120.0" width="80.0" height="16.0" rx="3"/><text class="vs" x="352.0" y="132.0" text-anchor="middle">b or c</text><rect class="val2" x="396.0" y="120.0" width="60.0" height="16.0" rx="3"/><text class="vs" x="426.0" y="132.0" text-anchor="middle">1</text><rect class="val2" x="460.0" y="120.0" width="190.0" height="16.0" rx="3"/><text class="vs" x="555.0" y="132.0" text-anchor="middle">bitmap 010</text><rect class="val2" x="312.0" y="138.0" width="80.0" height="16.0" rx="3"/><text class="vs" x="352.0" y="150.0" text-anchor="middle">b, c</text><rect class="val2" x="396.0" y="138.0" width="60.0" height="16.0" rx="3"/><text class="vs" x="426.0" y="150.0" text-anchor="middle">2</text><rect class="val2" x="460.0" y="138.0" width="190.0" height="16.0" rx="3"/><text class="vs" x="555.0" y="150.0" text-anchor="middle">leaves</text><text class="note" x="20.0" y="190.0">A block is one byte lane of up to 32 768 symbols. Its Huffman tree is at most 12 levels deep,</text><text class="note" x="20.0" y="206.0">so it has at most 511 nodes and the whole table fits in shared memory.</text></svg>
