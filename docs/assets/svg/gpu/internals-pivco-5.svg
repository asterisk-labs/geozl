24.0" height="24.0" rx="3"/><text class="vs" x="306.0" y="124.0" text-anchor="middle">a</text><rect class="val2" x="320.0" y="108.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="332.0" y="124.0" text-anchor="middle">b</text><rect class="val2" x="346.0" y="108.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="358.0" y="124.0" text-anchor="middle">c</text><rect class="val2" x="372.0" y="108.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="384.0" y="124.0" text-anchor="middle">b</text><text class="smL" x="410.0" y="124.0">a writes five a, b or c merges b b c by 010</text><path class="arrg" d="M290.0 136.0 L290.0 162.0"/><path class="arrg" d="M287.4 156.6 L290.0 162.0 L292.6 156.6"/><text class="smL" x="20.0" y="182.0">depth 0</text><text class="ttl" x="84.0" y="182.0">lane buffer</text><rect class="out" x="190.0" y="166.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="202.0" y="182.0" text-anchor="middle">a</text><rect class="out" x="216.0" y="166.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="228.0" y="182.0" text-anchor="middle">b</text><rect class="out" x="242.0" y="166.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="254.0" y="182.0" text-anchor="middle">a</text><rect class="out" x="268.0" y="166.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="280.0" y="182.0" text-anchor="middle">c</text><rect class="out" x="294.0" y="166.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="306.0" y="182.0" text-anchor="middle">a</text><rect class="out" x="320.0" y="166.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="332.0" y="182.0" text-anchor="middle">b</text><rect class="out" x="346.0" y="166.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="358.0" y="182.0" text-anchor="middle">a</text><rect class="out" x="372.0" y="166.0" width="24.0" height="24.0" rx="3"/><text class="vs" x="384.0" y="182.0" text-anchor="middle">a</text><text class="smL" x="410.0" y="182.0">the root merges by 01010100, the lane is done</text><text class="note" x="20.0" y="232.0">A node writes over the range its children used. Reading one buffer and writing</text><text class="note" x="20.0" y="248.0">the other keeps a parent from overwriting symbols its threads still need.</text><text class="good" x="20.0" y="264.0">Scratch is borrowed from the output, so neither buffer costs an extra allocation.</text></svg>
