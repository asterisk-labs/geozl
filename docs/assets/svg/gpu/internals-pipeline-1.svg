<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 292" width="700" height="292" role="img" aria-label="Step 1 of 3. before, one staging area, the CPU and the GPU take turns."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">1</tspan>  before, one staging area, the CPU and the GPU take turns</text><text class="ttl" x="20.0" y="46.0">one staging area</text><text class="smL" x="20.0" y="69.0">CPU</text><line class="rule" x1="130.0" y1="77.0" x2="677.2" y2="77.0"/><rect class="hot" x="130.0" y="54.0" width="70.0" height="22.0" rx="3"/><text class="vs" x="165.0" y="69.0" text-anchor="middle">plan N</text><rect class="cell" x="202.0" y="54.0" width="106.0" height="22.0" rx="3"/><text class="vs" x="255.0" y="69.0" text-anchor="middle">waits</text><rect class="hot" x="310.0" y="54.0" width="70.0" height="22.0" rx="3"/><text class="vs" x="345.0" y="69.0" text-anchor="middle">plan N+1</text><rect class="cell" x="382.0" y="54.0" width="106.0" height="22.0" rx="3"/><text class="vs" x="435.0" y="69.0" text-anchor="middle">waits</text><rect class="hot" x="490.0" y="54.0" width="70.0" height="22.0" rx="3"/><text class="vs" x="525.0" y="69.0" text-anchor="middle">plan N+2</text><text class="smL" x="20.0" y="97.0">GPU</text><line class="rule" x1="130.0" y1="105.0" x2="677.2" y2="105.0"/><rect class="val" x="202.0" y="82.0" width="106.0" height="22.0" rx="3"/><text class="vs" x="255.0" y="97.0" text-anchor="middle">decode N</text><rect class="val" x="382.0" y="82.0" width="106.0" height="22.0" rx="3"/><text class="vs" x="435.0" y="97.0" text-anchor="middle">decode N+1</text><rect class="val" x="562.0" y="82.0" width="106.0" height="22.0" rx="3"/><text class="vs" x="615.0" y="97.0" text-anchor="middle">decode N+2</text><line class="bar" x1="669.0" y1="50.0" x2="669.0" y2="108.0"/><text class="note" x="20.0" y="140.0">A call could not plan into the staging until the GPU had finished with it,</text><text class="note" x="20.0" y="156.0">so each call started by waiting for the one before, and the two sides were never busy together.</text></svg>
