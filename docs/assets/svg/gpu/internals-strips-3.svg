><rect class="cell" x="165" y="225" width="22" height="22" rx="2"/><rect class="cell" x="189" y="225" width="22" height="22" rx="2"/><rect class="cell" x="213" y="225" width="22" height="22" rx="2"/><rect class="cell" x="237" y="225" width="22" height="22" rx="2"/><rect class="cell" x="261" y="225" width="22" height="22" rx="2"/><rect class="cell" x="285" y="225" width="22" height="22" rx="2"/><rect class="cell" x="309" y="225" width="22" height="22" rx="2"/><rect class="cell" x="333" y="225" width="22" height="22" rx="2"/><rect class="cell" x="357" y="225" width="22" height="22" rx="2"/><rect class="cell" x="381" y="225" width="22" height="22" rx="2"/><circle cx="26" cy="62" r="3.2" fill="#492AE8"/><text class="note" x="432" y="70">Undoing planar makes each pixel</text><text class="note" x="432" y="86">the sum of every residual above</text><text class="note" x="432" y="102">it and to its left.</text><text class="note" x="432" y="136">The yellow pixel needs all</text><text class="note" x="432" y="152">83 red ones, back to the</text><text class="note" x="432" y="168">corner of the plane.</text><text class="bad" x="432" y="202">Across a real plane that chain</text><text class="bad" x="432" y="218">is thousands of pixels long,</text><text class="bad" x="432" y="234">so the GPU ran it as separate</text><text class="bad" x="432" y="250">scans over the whole plane.</text></svg>