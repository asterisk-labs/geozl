<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" role="img" aria-label="Threads t0 to t7 each start at bit t × 3 of the body at the same moment and produce 3 5 2 7 4 6 1 2. The exception mask has only bit 7 set, so t7 counts the 1s before it, a popcount of 0, reads its high bits 1011 from bit 0 of the list and ORs them in above its body bits, so 010 | 1011 shifted by 3 is 1011010, 90.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    svg{ background:transparent; font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    text{ font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    .cap{ fill:#111111; font-size:13px; font-weight:500; }
    .capn{ fill:#492AE8; font-weight:600; }
    .lab{ fill:#5C6370; font-size:11px; font-weight:500; }
    .faint{ fill:#9AA1AB; font-size:11px; font-weight:500; }
    .note{ fill:#111111; font-size:11px; font-weight:500; }
    .num{ fill:#111111; font-size:12px; font-weight:500; text-anchor:middle; dominant-baseline:central; }
    .numf{ fill:#9AA1AB; font-size:11px; font-weight:500; text-anchor:middle; dominant-baseline:central; }
    .tag{ fill:#FFFFFF; stroke:#492AE8; stroke-width:1; }
    .tagt{ fill:#492AE8; font-size:11px; font-weight:500; text-anchor:middle; dominant-baseline:central; }
    .cell{ fill:#ECE9FD; stroke:#492AE8; stroke-width:.8; }
    .tile{ fill:#F3F3F1; stroke:#E6E6E3; stroke-width:.8; }
    .exc{ fill:#FEF6D3; stroke:#F7CC09; stroke-width:1; }
    .exct{ fill:#7A5D00; }
    .done{ fill:#C4FFC2; stroke:#1D7A3E; stroke-width:.8; }
    .hair{ stroke:#E6E6E3; stroke-width:1; fill:none; }
    .beat{ opacity:0; }

    /* 15 s loop: offsets, body values, mask and rank, then t7 patches the 90 */
    @keyframes k1{ 0%{opacity:0;} 2%{opacity:0;} 4.667%{opacity:1;} 18%{opacity:1;} 20%{opacity:0;} 100%{opacity:0;} }
    #cap1{ animation:k1 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k2{ 0%{opacity:0;} 20%{opacity:0;} 22.667%{opacity:1;} 36.667%{opacity:1;} 38.667%{opacity:0;} 100%{opacity:0;} }
    #cap2{ animation:k2 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k3{ 0%{opacity:0;} 38.667%{opacity:0;} 41.333%{opacity:1;} 56.667%{opacity:1;} 58.667%{opacity:0;} 100%{opacity:0;} }
    #cap3{ animation:k3 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k4{ 0%{opacity:0;} 58.667%{opacity:0;} 61.333%{opacity:1;} 96%{opacity:1;} 100%{opacity:0;} }
    #cap4{ animation:k4 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k5{ 0%{opacity:0} 100%{opacity:0} }
    #capsum{ animation:k5 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k6{ 0%{opacity:0;} 5.333%{opacity:0;} 8%{opacity:1;} 28%{opacity:1;} 31.333%{opacity:0;} 100%{opacity:0;} }
    #reads{ animation:k6 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k7{ 0%{opacity:0;transform:translate(0px,-16px)} 21.333%{opacity:0;transform:translate(0px,-16px)} 24%{opacity:1;transform:translate(0px,-6.4px)} 27.333%{opacity:1;transform:translate(0px,0px)} 96%{opacity:1;transform:translate(0px,0px)} 100%{opacity:0;transform:translate(0px,0px)} }
    #outs{ animation:k7 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k8{ 0%{opacity:1} 20%{opacity:1} 72.667%{opacity:1} 75.333%{opacity:0} 99.933%{opacity:0} 100%{opacity:1} }
    #o2{ animation:k8 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k9{ 0%{opacity:0} 72.667%{opacity:0} 75.333%{opacity:1} 96%{opacity:1} 100%{opacity:0} }
    #o90{ animation:k9 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k10{ 0%{opacity:0;transform:translate(0px,-8px)} 3.333%{opacity:0;transform:translate(0px,-8px)} 6.667%{opacity:1;transform:translate(0px,0px)} 96%{opacity:1;transform:translate(0px,0px)} 100%{opacity:0;transform:translate(0px,0px)} }
    #tags{ animation:k10 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k11{ 0%{opacity:0;} 40%{opacity:0;} 42.667%{opacity:1;} 96%{opacity:1;} 100%{opacity:0;} }
    #mask{ animation:k11 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k12{ 0%{opacity:0;} 44.667%{opacity:0;} 47.333%{opacity:1;} 96%{opacity:1;} 100%{opacity:0;} }
    #rank{ animation:k12 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k13{ 0%{opacity:0;} 60%{opacity:0;} 62.667%{opacity:1;} 96%{opacity:1;} 100%{opacity:0;} }
    #list{ animation:k13 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k14{ 0%{opacity:0;} 72%{opacity:0;} 74.667%{opacity:1;} 96%{opacity:1;} 100%{opacity:0;} }
    #plab{ animation:k14 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k15{ 0%{opacity:0;transform:translate(-410px,0px)} 64.667%{opacity:0;transform:translate(-410px,0px)} 65.333%{opacity:1;transform:translate(-410px,0px)} 72%{opacity:1;transform:translate(0px,0px)} 96%{opacity:1;transform:translate(0px,0px)} 100%{opacity:0;transform:translate(0px,0px)} }
    #phi{ animation:k15 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k16{ 0%{opacity:0;transform:translate(0px,-208px)} 64.667%{opacity:0;transform:translate(0px,-208px)} 65.333%{opacity:1;transform:translate(0px,-208px)} 72%{opacity:1;transform:translate(0px,0px)} 96%{opacity:1;transform:translate(0px,0px)} 100%{opacity:0;transform:translate(0px,0px)} }
    #plo{ animation:k16 15.0s cubic-bezier(.4,0,.2,1) infinite; }

    @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
  ]]></style>
  <text id="cap1" class="cap beat" x="16" y="24"><tspan class="capn">1</tspan>  thread t starts at bit t × 3, all at the same moment</text>
  <text id="cap2" class="cap beat" x="16" y="24"><tspan class="capn">2</tspan>  the body alone gives 3 5 2 7 4 6 1 2</text>
  <text id="cap3" class="cap beat" x="16" y="24"><tspan class="capn">3</tspan>  t7 is an exception, rank = 1s in the mask before it</text>
  <text id="cap4" class="cap beat" x="16" y="24"><tspan class="capn">4</tspan>  value = body | (high &lt;&lt; b) = 010 | 1011 &lt;&lt; 3 = 90</text>
  <text id="capsum" class="cap" x="16" y="24">every thread reads its own 3 bits at once; t7 adds 1011 &lt;&lt; 3 to get 90</text>
  <text class="lab" x="16" y="57">body</text><text class="lab" x="16" y="94">thread</text><text class="lab" x="16" y="151">out</text>
  <g><rect class="cell" x="70" y="42" width="20" height="22" rx="2"/><text class="num" x="80" y="53">0</text><rect class="cell" x="90" y="42" width="20" height="22" rx="2"/><text class="num" x="100" y="53">1</text><rect class="cell" x="110" y="42" width="20" height="22" rx="2"/><text class="num" x="120" y="53">1</text><rect class="cell" x="140" y="42" width="20" height="22" rx="2"/><text class="num" x="150" y="53">1</text><rect class="cell" x="160" y="42" width="20" height="22" rx="2"/><text class="num" x="170" y="53">0</text><rect class="cell" x="180" y="42" width="20" height="22" rx="2"/><text class="num" x="190" y="53">1</text><rect class="cell" x="210" y="42" width="20" height="22" rx="2"/><text class="num" x="220" y="53">0</text><rect class="cell" x="230" y="42" width="20" height="22" rx="2"/><text class="num" x="240" y="53">1</text><rect class="cell" x="250" y="42" width="20" height="22" rx="2"/><text class="num" x="260" y="53">0</text><rect class="cell" x="280" y="42" width="20" height="22" rx="2"/><text class="num" x="290" y="53">1</text><rect class="cell" x="300" y="42" width="20" height="22" rx="2"/><text class="num" x="310" y="53">1</text><rect class="cell" x="320" y="42" width="20" height="22" rx="2"/><text class="num" x="330" y="53">1</text><rect class="cell" x="350" y="42" width="20" height="22" rx="2"/><text class="num" x="360" y="53">1</text><rect class="cell" x="370" y="42" width="20" height="22" rx="2"/><text class="num" x="380" y="53">0</text><rect class="cell" x="390" y="42" width="20" height="22" rx="2"/><text class="num" x="400" y="53">0</text><rect class="cell" x="420" y="42" width="20" height="22" rx="2"/><text class="num" x="430" y="53">1</text><rect class="cell" x="440" y="42" width="20" height="22" rx="2"/><text class="num" x="450" y="53">1</text><rect class="cell" x="460" y="42" width="20" height="22" rx="2"/><text class="num" x="470" y="53">0</text><rect class="cell" x="490" y="42" width="20" height="22" rx="2"/><text class="num" x="500" y="53">0</text><rect class="cell" x="510" y="42" width="20" height="22" rx="2"/><text class="num" x="520" y="53">0</text><rect class="cell" x="530" y="42" width="20" height="22" rx="2"/><text class="num" x="540" y="53">1</text><rect class="cell" x="560" y="42" width="20" height="22" rx="2"/><text class="num" x="570" y="53">0</text><rect class="cell" x="580" y="42" width="20" height="22" rx="2"/><text class="num" x="590" y="53">1</text><rect class="cell" x="600" y="42" width="20" height="22" rx="2"/><text class="num" x="610" y="53">0</text></g>
  <g id="reads" class="beat"><rect x="67" y="39" width="66" height="28" rx="4" fill="none" stroke="#492AE8" stroke-width="1.2"/><rect x="137" y="39" width="66" height="28" rx="4" fill="none" stroke="#492AE8" stroke-width="1.2"/><rect x="207" y="39" width="66" height="28" rx="4" fill="none" stroke="#492AE8" stroke-width="1.2"/><rect x="277" y="39" width="66" height="28" rx="4" fill="none" stroke="#492AE8" stroke-width="1.2"/><rect x="347" y="39" width="66" height="28" rx="4" fill="none" stroke="#492AE8" stroke-width="1.2"/><rect x="417" y="39" width="66" height="28" rx="4" fill="none" stroke="#492AE8" stroke-width="1.2"/><rect x="487" y="39" width="66" height="28" rx="4" fill="none" stroke="#492AE8" stroke-width="1.2"/><rect x="557" y="39" width="66" height="28" rx="4" fill="none" stroke="#492AE8" stroke-width="1.2"/></g>
  <g id="outs"><rect class="done" x="78" y="136" width="44" height="22" rx="3"/><text class="num" x="100" y="147">3</text><rect class="done" x="148" y="136" width="44" height="22" rx="3"/><text class="num" x="170" y="147">5</text><rect class="done" x="218" y="136" width="44" height="22" rx="3"/><text class="num" x="240" y="147">2</text><rect class="done" x="288" y="136" width="44" height="22" rx="3"/><text class="num" x="310" y="147">7</text><rect class="done" x="358" y="136" width="44" height="22" rx="3"/><text class="num" x="380" y="147">4</text><rect class="done" x="428" y="136" width="44" height="22" rx="3"/><text class="num" x="450" y="147">6</text><rect class="done" x="498" y="136" width="44" height="22" rx="3"/><text class="num" x="520" y="147">1</text><rect class="done" x="568" y="136" width="44" height="22" rx="3"/><text id="o2" class="num beat" x="590" y="147">2</text><text id="o90" class="num" x="590" y="147" style="font-weight:600">90</text></g>
  <g id="tags"><rect class="tag" x="84" y="80" width="32" height="20" rx="4"/><text class="tagt" x="100" y="90">t0</text><text class="numf" x="100" y="112">bit 0</text><rect class="tag" x="154" y="80" width="32" height="20" rx="4"/><text class="tagt" x="170" y="90">t1</text><text class="numf" x="170" y="112">bit 3</text><rect class="tag" x="224" y="80" width="32" height="20" rx="4"/><text class="tagt" x="240" y="90">t2</text><text class="numf" x="240" y="112">bit 6</text><rect class="tag" x="294" y="80" width="32" height="20" rx="4"/><text class="tagt" x="310" y="90">t3</text><text class="numf" x="310" y="112">bit 9</text><rect class="tag" x="364" y="80" width="32" height="20" rx="4"/><text class="tagt" x="380" y="90">t4</text><text class="numf" x="380" y="112">bit 12</text><rect class="tag" x="434" y="80" width="32" height="20" rx="4"/><text class="tagt" x="450" y="90">t5</text><text class="numf" x="450" y="112">bit 15</text><rect class="tag" x="504" y="80" width="32" height="20" rx="4"/><text class="tagt" x="520" y="90">t6</text><text class="numf" x="520" y="112">bit 18</text><rect class="tag" x="574" y="80" width="32" height="20" rx="4"/><text class="tagt" x="590" y="90">t7</text><text class="numf" x="590" y="112">bit 21</text></g>
  <g id="mask"><text class="lab" x="16" y="207">mask</text><rect class="tile" x="89" y="192" width="22" height="22" rx="2"/><text class="num" x="100" y="203">0</text><rect class="tile" x="159" y="192" width="22" height="22" rx="2"/><text class="num" x="170" y="203">0</text><rect class="tile" x="229" y="192" width="22" height="22" rx="2"/><text class="num" x="240" y="203">0</text><rect class="tile" x="299" y="192" width="22" height="22" rx="2"/><text class="num" x="310" y="203">0</text><rect class="tile" x="369" y="192" width="22" height="22" rx="2"/><text class="num" x="380" y="203">0</text><rect class="tile" x="439" y="192" width="22" height="22" rx="2"/><text class="num" x="450" y="203">0</text><rect class="tile" x="509" y="192" width="22" height="22" rx="2"/><text class="num" x="520" y="203">0</text><rect class="exc" x="579" y="192" width="22" height="22" rx="2"/><text class="num exct" x="590" y="203">1</text></g>
  <g id="rank"><path d="M89 218 V222 H531 V218" fill="none" stroke="#492AE8" stroke-width="1.2"/><text x="89" y="238" fill="#492AE8" style="font-size:11px;font-weight:500">1s before bit 7, popcount = 0, so t7 has rank 0</text></g>
  <g id="list"><text class="lab" x="16" y="265">list</text><rect class="exc" x="70" y="250" width="20" height="22" rx="2"/><text class="num exct" x="80" y="261">1</text><rect class="exc" x="90" y="250" width="20" height="22" rx="2"/><text class="num exct" x="100" y="261">0</text><rect class="exc" x="110" y="250" width="20" height="22" rx="2"/><text class="num exct" x="120" y="261">1</text><rect class="exc" x="130" y="250" width="20" height="22" rx="2"/><text class="num exct" x="140" y="261">1</text><text class="faint" x="70" y="290">t7 reads at rank × 4 = bit 0</text></g>
  <g id="plab"><text class="faint" x="520" y="290" text-anchor="middle">high &lt;&lt; 3</text><text class="faint" x="590" y="290" text-anchor="middle">body</text><text class="note" x="620" y="312" text-anchor="end">1011010 = 90</text></g>
  <g id="phi"><rect class="exc" x="480" y="250" width="20" height="22" rx="2"/><text class="num exct" x="490" y="261">1</text><rect class="exc" x="500" y="250" width="20" height="22" rx="2"/><text class="num exct" x="510" y="261">0</text><rect class="exc" x="520" y="250" width="20" height="22" rx="2"/><text class="num exct" x="530" y="261">1</text><rect class="exc" x="540" y="250" width="20" height="22" rx="2"/><text class="num exct" x="550" y="261">1</text></g>
  <g id="plo"><rect class="cell" x="560" y="250" width="20" height="22" rx="2"/><text class="num" x="570" y="261">0</text><rect class="cell" x="580" y="250" width="20" height="22" rx="2"/><text class="num" x="590" y="261">1</text><rect class="cell" x="600" y="250" width="20" height="22" rx="2"/><text class="num" x="610" y="261">0</text></g>
</svg>
