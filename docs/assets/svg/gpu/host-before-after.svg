<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="Before, a host thread copied frames 0, 3 and 6 before planning frame 0, so frame 0 had left the core cache and was read from memory a second time. After, the thread plans frame 0 right after copying it, while it is still in the cache."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="bad" x="20" y="30">BEFORE</text><text class="ttl" x="76" y="30">copy every frame, then plan them all</text><text class="lab" x="20" y="60">thread 0</text><rect class="val" x="90" y="44" width="92" height="24" rx="3"/><text class="vs" x="136.0" y="60.0">copy frame 0</text><rect class="val" x="186" y="44" width="92" height="24" rx="3"/><text class="vs" x="232.0" y="60.0">copy frame 3</text><rect class="val" x="282" y="44" width="92" height="24" rx="3"/><text class="vs" x="328.0" y="60.0">copy frame 6</text><text class="lab" x="382" y="60">&#8230;</text><rect class="hot" x="408" y="44" width="92" height="24" rx="3"/><text class="vs" x="454.0" y="60.0">plan frame 0</text><text class="lab" x="20" y="104">core cache</text><rect class="dim" x="90" y="88" width="180" height="26" rx="3"/><text class="vs" x="180.0" y="105.0">frame 6, frame 0 is gone</text><text class="lab" x="296" y="104">memory</text><rect class="dim" x="352" y="88" width="150" height="26" rx="3"/><text class="vs" x="427.0" y="105.0">frames 0, 3, 6, ...</text><path class="arr" d="M427 86 L444 70"/><path class="arr" d="M442.1 75.7 L444 70 L438.2 71.5"/><text class="bad" x="524" y="98">frame 0 is read</text><text class="bad" x="524" y="114">from memory again</text><path class="rule" d="M20 142 H680"/><text class="good" x="20" y="172">AFTER</text><text class="ttl" x="76" y="172">plan each frame right after copying it</text><text class="lab" x="20" y="202">thread 0</text><rect class="val" x="90" y="186" width="92" height="24" rx="3"/><text class="vs" x="136.0" y="202.0">copy frame 0</text><rect class="hot" x="186" y="186" width="92" height="24" rx="3"/><text class="vs" x="232.0" y="202.0">plan frame 0</text><rect class="val" x="282" y="186" width="92" height="24" rx="3"/><text class="vs" x="328.0" y="202.0">copy frame 3</text><rect class="dim" x="378" y="186" width="92" height="24" rx="3"/><text class="vs" x="424.0" y="202.0">plan frame 3</text><text class="lab" x="20" y="246">core cache</text><rect class="dim" x="90" y="230" width="180" height="26" rx="3"/><text class="vs" x="180.0" y="247.0">frame 0, just copied</text><text class="lab" x="296" y="246">memory</text><rect class="dim" x="352" y="230" width="150" height="26" rx="3"/><text class="vs" x="427.0" y="247.0">frames 0, 3, 6, ...</text><path class="arr" d="M180 228 L222 212"/><path class="arr" d="M218.1 216.6 L222 212 L216.1 211.2"/><text class="good" x="524" y="240">frame 0 is read</text><text class="good" x="524" y="256">from the cache</text><text class="note" x="20" y="290">Each thread copies the compressed frames it was given. The cache holds only the most</text><text class="note" x="20" y="306">recent bytes, so planning right away reads each frame from memory once instead of twice.</text></svg>