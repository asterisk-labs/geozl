<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-label="Before, host threads captured every frame first, and planning ran afterwards as a separate pass that read every payload again from memory. After, each thread plans the frame it has just captured, while the payload is still in the core's cache."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.tag{fill:#5C6370;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.tagA{fill:#492AE8;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.ttl{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.c{fill:#111111;font:600 11px "IBM Plex Mono",monospace;text-anchor:middle}
.cs{fill:#111111;font:500 10.5px "IBM Plex Mono",monospace;text-anchor:middle}
.bx{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.2}
.ok{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.q{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.2}
.grey{fill:#F3F3F1;stroke:#9AA1AB;stroke-width:1.1}
.bad{fill:#FDE8E8;stroke:#C0392B;stroke-width:1.1}
.badt{fill:#C0392B;font:600 10.5px "IBM Plex Mono",monospace}
.okt{fill:#1D7A3E;font:600 10.5px "IBM Plex Mono",monospace}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.bar{stroke:#C0392B;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}]]></style><text class="tag" x="20" y="20">BEFORE</text><text class="ttl" x="84" y="20">capture every frame, then plan them in a second pass</text><text class="lab" x="20" y="51">thread 0</text><rect class="bx" x="96" y="36" width="42" height="22" rx="4"/><text class="cs" x="117.0" y="51.0">cap 0</text><rect class="bx" x="142" y="36" width="42" height="22" rx="4"/><text class="cs" x="163.0" y="51.0">cap 3</text><rect class="q" x="234" y="36" width="42" height="22" rx="4"/><text class="cs" x="255.0" y="51.0">plan 0</text><rect class="q" x="280" y="36" width="42" height="22" rx="4"/><text class="cs" x="301.0" y="51.0">plan 3</text><text class="lab" x="20" y="79">thread 1</text><rect class="bx" x="96" y="64" width="42" height="22" rx="4"/><text class="cs" x="117.0" y="79.0">cap 1</text><rect class="bx" x="142" y="64" width="42" height="22" rx="4"/><text class="cs" x="163.0" y="79.0">cap 4</text><rect class="q" x="234" y="64" width="42" height="22" rx="4"/><text class="cs" x="255.0" y="79.0">plan 1</text><rect class="q" x="280" y="64" width="42" height="22" rx="4"/><text class="cs" x="301.0" y="79.0">plan 4</text><text class="lab" x="20" y="107">thread 2</text><rect class="bx" x="96" y="92" width="42" height="22" rx="4"/><text class="cs" x="117.0" y="107.0">cap 2</text><rect class="bx" x="142" y="92" width="42" height="22" rx="4"/><text class="cs" x="163.0" y="107.0">cap 5</text><rect class="q" x="234" y="92" width="42" height="22" rx="4"/><text class="cs" x="255.0" y="107.0">plan 2</text><rect class="q" x="280" y="92" width="42" height="22" rx="4"/><text class="cs" x="301.0" y="107.0">plan 5</text><line class="bar" x1="209.0" y1="32" x2="209.0" y2="120"/><text class="badt" x="96" y="134">wait for every capture, then read every payload again from memory</text><line class="rule" x1="20" y1="136" x2="620" y2="136"/><text class="tagA" x="20" y="156">AFTER</text><text class="ttl" x="84" y="156">each thread plans the frame it just captured</text><text class="lab" x="20" y="183">thread 0</text><rect class="bx" x="96" y="168" width="42" height="22" rx="4"/><text class="cs" x="117.0" y="183.0">cap 0</text><rect class="q" x="142" y="168" width="42" height="22" rx="4"/><text class="cs" x="163.0" y="183.0">plan 0</text><rect class="bx" x="188" y="168" width="42" height="22" rx="4"/><text class="cs" x="209.0" y="183.0">cap 3</text><rect class="q" x="234" y="168" width="42" height="22" rx="4"/><text class="cs" x="255.0" y="183.0">plan 3</text><text class="lab" x="20" y="211">thread 1</text><rect class="bx" x="96" y="196" width="42" height="22" rx="4"/><text class="cs" x="117.0" y="211.0">cap 1</text><rect class="q" x="142" y="196" width="42" height="22" rx="4"/><text class="cs" x="163.0" y="211.0">plan 1</text><rect class="bx" x="188" y="196" width="42" height="22" rx="4"/><text class="cs" x="209.0" y="211.0">cap 4</text><rect class="q" x="234" y="196" width="42" height="22" rx="4"/><text class="cs" x="255.0" y="211.0">plan 4</text><text class="lab" x="20" y="239">thread 2</text><rect class="bx" x="96" y="224" width="42" height="22" rx="4"/><text class="cs" x="117.0" y="239.0">cap 2</text><rect class="q" x="142" y="224" width="42" height="22" rx="4"/><text class="cs" x="163.0" y="239.0">plan 2</text><rect class="bx" x="188" y="224" width="42" height="22" rx="4"/><text class="cs" x="209.0" y="239.0">cap 5</text><rect class="q" x="234" y="224" width="42" height="22" rx="4"/><text class="cs" x="255.0" y="239.0">plan 5</text><text class="okt" x="96" y="264">the payload is still in the core's cache when it is planned</text></svg>
