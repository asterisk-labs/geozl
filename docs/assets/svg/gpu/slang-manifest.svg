<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-label="Before, editing stages/pivco.slang without a rebuild left pivco2.ptx unchanged, nothing compared the modules with the source, CI passed and the old kernel shipped. After, sources.sha256 records one hash per module, such as metal:pfor2.metal and ptx:pfor2.ptx, and one digest of the compiler inputs per target. Editing stages/pivco.slang changes the sources digest, so build_gpu_modules.py --check in CI fails with stale metal and ptx modules, rebuild them."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.tag{fill:#5C6370;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.tagA{fill:#492AE8;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 10px "IBM Plex Mono",monospace}
.c{fill:#111111;font:600 11px "IBM Plex Mono",monospace;text-anchor:middle}
.cs{fill:#111111;font:500 10.5px "IBM Plex Mono",monospace;text-anchor:middle}
.cl{fill:#111111;font:500 10.5px "IBM Plex Mono",monospace}
.code{fill:#111111;font:500 11px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 13px "IBM Plex Mono",monospace;text-anchor:middle}
.vg{fill:#B9BEC6;font:600 13px "IBM Plex Mono",monospace;text-anchor:middle}
.bx{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.2}
.ok{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.q{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.2}
.grey{fill:#F3F3F1;stroke:#9AA1AB;stroke-width:1.1}
.plan{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1.1;stroke-dasharray:4 3}
.bad{fill:#FDE8E8;stroke:#C0392B;stroke-width:1.2}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:1}
.hl{fill:none;stroke:#E0A800;stroke-width:2.4}
.badt{fill:#C0392B;font:600 10.5px "IBM Plex Mono",monospace}
.okt{fill:#1D7A3E;font:600 10.5px "IBM Plex Mono",monospace}
.pt{fill:#492AE8;font:600 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 12px "IBM Plex Mono",monospace}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 3}
.arrr{fill:none;stroke:#C0392B;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#B9BEC6;stroke-width:1.1}
.lnh{stroke:#E0A800;stroke-width:2.2}
.rule{stroke:#E3E5E8;stroke-width:1}]]></style><text class="tag" x="20" y="20">BEFORE</text><text class="ttl" x="88" y="20">a kernel edit without a rebuild</text><rect class="bx" x="20" y="36" width="170" height="34" rx="4"/><text class="cs" x="105.0" y="57.0">edit stages/pivco.slang</text><rect class="grey" x="230" y="36" width="170" height="34" rx="4"/><text class="cs" x="315.0" y="57.0">pivco2.ptx unchanged</text><rect class="bad" x="440" y="36" width="200" height="34" rx="4"/><text class="cs" x="540.0" y="57.0">the old kernel ships</text><path class="arr" d="M190 53 L228 53"/><path class="arr" d="M222.6 55.6 L228 53 L222.6 50.4"/><path class="arr" d="M400 53 L438 53"/><path class="arr" d="M432.6 55.6 L438 53 L432.6 50.4"/><text class="badt" x="20" y="92">nothing compares the modules with the source, so CI passes</text><line class="rule" x1="20" y1="108" x2="640" y2="108"/><text class="tagA" x="20" y="132">AFTER</text><text class="ttl" x="88" y="132">sources.sha256 records what went in and what came out</text><text class="code" x="20" y="162">metal:pfor2.metal</text><text class="code" x="190" y="162">ccafb79e…</text><text class="sm" x="290" y="162">one hash per module</text><text class="code" x="20" y="182">metal:sources</text><text class="code" x="190" y="182">222818d7…</text><text class="sm" x="290" y="182">digest of the compiler inputs</text><text class="code" x="20" y="202">ptx:pfor2.ptx</text><text class="code" x="190" y="202">6b6062d3…</text><text class="code" x="20" y="222">ptx:sources</text><text class="code" x="190" y="222">1c6f4e28…</text><rect class="bx" x="20" y="246" width="170" height="34" rx="4"/><text class="cs" x="105.0" y="267.0">edit stages/pivco.slang</text><rect class="q" x="230" y="246" width="170" height="34" rx="4"/><text class="cs" x="315.0" y="267.0">--check in CI</text><rect class="bad" x="440" y="238" width="200" height="50" rx="4"/><text class="cs" x="540.0" y="260.0">stale metal and ptx</text><text class="cs" x="540.0" y="274.0">modules, rebuild them</text><path class="arr" d="M190 263 L228 263"/><path class="arr" d="M222.6 265.6 L228 263 L222.6 260.4"/><path class="arr" d="M400 263 L438 263"/><path class="arr" d="M432.6 265.6 L438 263 L432.6 260.4"/><text class="okt" x="20" y="306">the sources digest no longer matches, so CI names the stale targets</text></svg>
