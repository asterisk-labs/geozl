<rect class="red" x="424" y="140" width="60" height="18" rx="2"/><text class="vb" x="454" y="153">idle</text><text class="lab" x="300" y="176">t3 c</text><rect class="in" x="360" y="162" width="60" height="18" rx="2"/><text class="vb" x="390" y="175">walk</text><rect class="in" x="424" y="162" width="60" height="18" rx="2"/><text class="vb" x="454" y="175">walk</text><text class="lab" x="300" y="198">t4 a</text><rect class="in" x="360" y="184" width="60" height="18" rx="2"/><text class="vb" x="390" y="197">walk</text><rect class="red" x="424" y="184" width="60" height="18" rx="2"/><text class="vb" x="454" y="197">idle</text><text class="lab" x="300" y="220">t5 b</text><rect class="in" x="360" y="206" width="60" height="18" rx="2"/><text class="vb" x="390" y="219">walk</text><rect class="in" x="424" y="206" width="60" height="18" rx="2"/><text class="vb" x="454" y="219">walk</text><text class="lab" x="300" y="242">t6 a</text><rect class="in" x="360" y="228" width="60" height="18" rx="2"/><text class="vb" x="390" y="241">walk</text><rect class="red" x="424" y="228" width="60" height="18" rx="2"/><text class="vb" x="454" y="241">idle</text><text class="lab" x="300" y="264">t7 a</text><rect class="in" x="360" y="250" width="60" height="18" rx="2"/><text class="vb" x="390" y="263">walk</text><rect class="red" x="424" y="250" width="60" height="18" rx="2"/><text class="vb" x="454" y="263">idle</text><text class="bad" x="500" y="110">five of eight threads</text><text class="bad" x="500" y="126">idle in step 2</text><text class="note" x="500" y="160">a code of 12 bits keeps</text><text class="note" x="500" y="176">its thread walking while</text><text class="note" x="500" y="192">the rest of the wave waits</text></svg>