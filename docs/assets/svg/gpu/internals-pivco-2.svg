<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" role="img" aria-label="Step 2 of 6. the levels run from the deepest to the root, a barrier between them."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">2</tspan>  the levels run from the deepest to the root, a barrier between them</text><line class="ln" x1="280.0" y1="76.0" x2="210.0" y2="102.0"/><line class="ln" x1="280.0" y1="76.0" x2="350.0" y2="102.0"/><line class="ln" x1="350.0" y1="132.0" x2="300.0" y2="158.0"/><line class="ln" x1="350.0" y1="132.0" x2="400.0" y2="158.0"/><rect class="val" x="234.0" y="46.0" width="92.0" height="30.0" rx="3"/><text class="vs" x="280.0" y="58.5" text-anchor="middle">root</text><text class="vs" x="280.0" y="71.5" text-anchor="middle">01010100</text><rect class="out" x="187.0" y="102.0" width="46.0" height="30.0" rx="3"/><text class="vs" x="210.0" y="121.0" text-anchor="middle">a</text><rect class="val" x="304.0" y="102.0" width="92.0" height="30.0" rx="3"/><text class="vs" x="350.0" y="114.5" text-anchor="middle">b or c</text><text class="vs" x="350.0" y="127.5" text-anchor="middle">010</text><rect class="out" x="277.0" y="158.0" width="46.0" height="30.0" rx="3"/><text class="vs" x="300.0" y="177.0" text-anchor="middle">b</text><rect class="out" x="377.0" y="158.0" width="46.0" height="30.0" rx="3"/><text class="vs" x="400.0" y="177.0" text-anchor="middle">c</text><text class="smL" x="20.0" y="177.0">depth 2</text><text class="smL" x="470.0" y="177.0">wave 0 takes b, wave 1 takes c</text><text class="smL" x="20.0" y="121.0">depth 1</text><text class="smL" x="470.0" y="121.0">wave 0 takes a, wave 1 takes b or c</text><text class="smL" x="20.0" y="65.0">depth 0</text><text class="smL" x="470.0" y="65.0">wave 0 takes the root</text><line class="bar" x1="20.0" y1="93.0" x2="680.0" y2="93.0"/><line class="bar" x1="20.0" y1="149.0" x2="680.0" y2="149.0"/><text class="bad" x="470.0" y="208.0">dashed lines are barriers</text><text class="note" x="20.0" y="230.0">A parent can only merge once both children have written, so every level waits for the one below.</text></svg>
