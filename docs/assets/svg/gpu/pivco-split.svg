  <text class="cap ps1" x="16" y="22" style="opacity:0"><tspan class="num">1</tspan>  each symbol has a Huffman code, a = 0, b = 10 and c = 11</text>
  <text class="cap ps2" x="16" y="22" style="opacity:0"><tspan class="num">2</tspan>  the root takes the first bit of every symbol, all at once</text>
  <text class="cap ps3" x="16" y="22" style="opacity:0"><tspan class="num">3</tspan>  only b, c and b reach the next node; their second bits fill it</text>
  <text class="cap ps4" x="16" y="22" style="opacity:0"><tspan class="num">4</tspan>  8 + 3 = 11 bits, the same bits as before, grouped by node</text>
  <text class="cap ps5" x="16" y="22">the same 11 bits, grouped by the tree node that reads them</text>
