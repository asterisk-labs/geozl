    #bline{ animation:k15 13.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k16{ 0%{opacity:1} 21.538%{opacity:1} 24.615%{opacity:0} 99.923%{opacity:0} 100%{opacity:1} }
    #bl7{ animation:k16 13.0s cubic-bezier(.4,0,.2,1) infinite; }
