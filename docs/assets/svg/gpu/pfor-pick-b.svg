  <text id="cap1" class="cap beat" x="16" y="24"><tspan class="capn">1</tspan>  at b = 7 nothing sticks out, but every value pays 7 bits</text>
  <text id="cap2" class="cap beat" x="16" y="24"><tspan class="capn">2</tspan>  at b = 2 the body is thin, but five values stick out</text>
  <text id="cap3" class="cap beat" x="16" y="24"><tspan class="capn">3</tspan>  at b = 3 only the 90 sticks out</text>
  <text id="cap4" class="cap beat" x="16" y="24"><tspan class="capn">4</tspan>  the 90 keeps 010 in the body, 1011 goes to the list</text>
  <text id="capsum" class="cap" x="16" y="24">at b = 3 every value keeps 3 bits, the 90 sends 1011 to the list</text>
