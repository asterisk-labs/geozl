<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" width="640" height="268" role="img" aria-label="The values 3 5 2 7 4 6 1 90 drawn as stacks of bits. A line at b = 7 leaves no exceptions but costs 56 bits of body; at b = 2 the body is 16 bits but five values stick out; at b = 3 only the 90 sticks out, so it keeps 010 in the body and its high bits 1011 move to the exception list.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    svg{ background:transparent; font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    text{ font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    .cap{ fill:#111111; font-size:13px; font-weight:500; }
    .capn{ fill:#492AE8; font-weight:600; }
    .lab{ fill:#5C6370; font-size:11px; font-weight:500; }
    .faint{ fill:#9AA1AB; font-size:11px; font-weight:500; }
