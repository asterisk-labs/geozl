    .num{ fill:#111111; font-size:12px; font-weight:500; text-anchor:middle; dominant-baseline:central; }
    .numf{ fill:#9AA1AB; font-size:11px; font-weight:500; text-anchor:middle; dominant-baseline:central; }
    .tag{ fill:#FFFFFF; stroke:#492AE8; stroke-width:1; }
