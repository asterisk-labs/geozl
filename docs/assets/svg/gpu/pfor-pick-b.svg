    .done{ fill:#C4FFC2; stroke:#1D7A3E; stroke-width:.8; }
    .hair{ stroke:#E6E6E3; stroke-width:1; fill:none; }
    .beat{ opacity:0; }

    /* 13 s loop: the line at b moves from 7 to 2 to 3, then the 90 sends its high bits to the list */
    @keyframes k1{ 0%{opacity:0;} 2.308%{opacity:0;} 5.385%{opacity:1;} 19.231%{opacity:1;} 21.538%{opacity:0;} 100%{opacity:0;} }
