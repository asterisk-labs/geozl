<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 398" width="660" height="398" role="img" aria-label="Without the check, if two buffer declarations of the pfor program were swapped, the kernel would bind strips at 4 and bandFrames at 5 while the host still passes bandFrames at 4 and strips at 5. Both hold 32-byte records, so the kernel would read strip tasks as band frames with no error. With the check, every build has slangc write reflection JSON and check_slang_layout.py compares the binding order with the host order, so the swap fails the build with unexpected pfor buffer layout."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
