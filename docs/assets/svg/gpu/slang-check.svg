.pt{fill:#492AE8;font:600 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 12px "IBM Plex Mono",monospace}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 3}
.arrr{fill:none;stroke:#C0392B;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#B9BEC6;stroke-width:1.1}
.lnh{stroke:#E0A800;stroke-width:2.2}
.rule{stroke:#E3E5E8;stroke-width:1}]]></style><text class="tag" x="20" y="20">WITHOUT</text><text class="ttl" x="96" y="20">if two buffer declarations of the pfor program were swapped</text><text class="lab" x="20" y="40">kernel binds</text><rect class="grey" x="20" y="48" width="150" height="20" rx="3"/><text class="sm" x="28" y="62">0</text><text class="cl" x="48" y="62">payload</text><rect class="grey" x="20" y="72" width="150" height="20" rx="3"/><text class="sm" x="28" y="86">1</text><text class="cl" x="48" y="86">blocks</text><rect class="grey" x="20" y="96" width="150" height="20" rx="3"/><text class="sm" x="28" y="110">2</text><text class="cl" x="48" y="110">output</text><rect class="grey" x="20" y="120" width="150" height="20" rx="3"/><text class="sm" x="28" y="134">3</text><text class="cl" x="48" y="134">outputBytes</text><rect class="bad" x="20" y="144" width="150" height="20" rx="3"/><text class="sm" x="28" y="158">4</text><text class="cl" x="48" y="158">strips</text><rect class="bad" x="20" y="168" width="150" height="20" rx="3"/><text class="sm" x="28" y="182">5</text><text class="cl" x="48" y="182">bandFrames</text><rect class="grey" x="20" y="192" width="150" height="20" rx="3"/><text class="sm" x="28" y="206">6</text><text class="cl" x="48" y="206">bandBlocks</text><rect class="grey" x="20" y="216" width="150" height="20" rx="3"/><text class="sm" x="28" y="230">7</text><text class="cl" x="48" y="230">status</text><rect class="grey" x="20" y="240" width="150" height="20" rx="3"/><text class="sm" x="28" y="254">8</text><text class="cl" x="48" y="254">rawValues</text><rect class="grey" x="20" y="264" width="150" height="20" rx="3"/><text class="sm" x="28" y="278">9</text><text class="cl" x="48" y="278">rawCopies</text><text class="lab" x="250" y="40">host passes</text><rect class="grey" x="250" y="48" width="150" height="20" rx="3"/><text class="sm" x="258" y="62">0</text><text class="cl" x="278" y="62">payload</text><rect class="grey" x="250" y="72" width="150" height="20" rx="3"/><text class="sm" x="258" y="86">1</text><text class="cl" x="278" y="86">blocks</text><rect class="grey" x="250" y="96" width="150" height="20" rx="3"/><text class="sm" x="258" y="110">2</text><text class="cl" x="278" y="110">output</text><rect class="grey" x="250" y="120" width="150" height="20" rx="3"/><text class="sm" x="258" y="134">3</text><text class="cl" x="278" y="134">outputBytes</text><rect class="bad" x="250" y="144" width="150" height="20" rx="3"/><text class="sm" x="258" y="158">4</text><text class="cl" x="278" y="158">bandFrames</text><rect class="bad" x="250" y="168" width="150" height="20" rx="3"/><text class="sm" x="258" y="182">5</text><text class="cl" x="278" y="182">strips</text><rect class="grey" x="250" y="192" width="150" height="20" rx="3"/><text class="sm" x="258" y="206">6</text><text class="cl" x="278" y="206">bandBlocks</text><rect class="grey" x="250" y="216" width="150" height="20" rx="3"/><text class="sm" x="258" y="230">7</text><text class="cl" x="278" y="230">status</text><rect class="grey" x="250" y="240" width="150" height="20" rx="3"/><text class="sm" x="258" y="254">8</text><text class="cl" x="278" y="254">rawValues</text><rect class="grey" x="250" y="264" width="150" height="20" rx="3"/><text class="sm" x="258" y="278">9</text><text class="cl" x="278" y="278">rawCopies</text><text class="badt" x="430" y="152">the kernel reads strip tasks</text><text class="badt" x="430" y="168">as band frames, both 32 bytes,</text><text class="badt" x="430" y="184">and nothing reports an error</text><line class="rule" x1="20" y1="304" x2="640" y2="304"/><text class="tagA" x="20" y="328">WITH</text><text class="ttl" x="96" y="328">the check, every build compares the two orders</text><rect class="bx" x="20" y="344" width="150" height="40" rx="4"/><text class="cs" x="95.0" y="361.0">slangc writes</text><text class="cs" x="95.0" y="375.0">reflection JSON</text><rect class="q" x="210" y="344" width="190" height="40" rx="4"/><text class="cs" x="305.0" y="361.0">check_slang_layout.py</text><text class="cs" x="305.0" y="375.0">against the host order</text><path class="arr" d="M170 364 L208 364"/><path class="arr" d="M202.6 366.6 L208 364 L202.6 361.4"/><rect class="bad" x="440" y="344" width="200" height="40" rx="4"/><text class="cs" x="540.0" y="361.0">build fails, unexpected</text><text class="cs" x="540.0" y="375.0">pfor buffer layout</text><path class="arr" d="M400 364 L438 364"/><path class="arr" d="M432.6 366.6 L438 364 L432.6 361.4"/></svg>
