.rule{stroke:#E3E5E8;stroke-width:1}]]></style><text class="ttl" x="20" y="20">gpu/kernels</text><text class="lab" x="20" y="42">common/</text><rect class="grey" x="20" y="50" width="150" height="24" rx="4"/><text class="cs" x="95.0" y="66.0">payload.slang</text><text class="lab" x="20" y="112">stages/</text><rect class="q" x="20" y="120" width="150" height="24" rx="4"/><text class="cs" x="95.0" y="136.0">pfor.slang</text><rect class="q" x="20" y="150" width="150" height="24" rx="4"/><text class="cs" x="95.0" y="166.0">pfor_bands.slang</text><rect class="q" x="20" y="180" width="150" height="24" rx="4"/><text class="cs" x="95.0" y="196.0">pivco.slang</text><rect class="q" x="20" y="210" width="150" height="24" rx="4"/><text class="cs" x="95.0" y="226.0">planar_scan.slang</text><rect class="q" x="20" y="240" width="150" height="24" rx="4"/><text class="cs" x="95.0" y="256.0">planar_zigzag.slang</text><text class="lab" x="250" y="42">programs/</text><rect class="bx" x="250" y="50" width="150" height="24" rx="4"/><text class="cs" x="325.0" y="66.0">pfor.slang</text><rect class="bx" x="250" y="80" width="150" height="24" rx="4"/><text class="cs" x="325.0" y="96.0">pivco.slang</text><rect class="bx" x="250" y="110" width="150" height="24" rx="4"/><text class="cs" x="325.0" y="126.0">place.slang</text><path class="ln" d="M170 62 L250 62"/><path class="ln" d="M170 62 L250 92"/><path class="ln" d="M170 132 L250 62"/><path class="ln" d="M170 132 L250 92"/><path class="ln" d="M170 162 L250 62"/><path class="ln" d="M170 192 L250 92"/><path class="ln" d="M170 222 L250 92"/><path class="ln" d="M170 252 L250 62"/><path class="ln" d="M170 252 L250 92"/><text class="sm" x="250" y="164">lines are #include</text><text class="lab" x="440" y="42">× sample width, ELT_BYTES</text><path class="arr" d="M400 62 L436 62"/><path class="arr" d="M430.6 64.6 L436 62 L430.6 59.4"/><rect class="ok" x="440" y="50" width="48" height="24" rx="4"/><text class="cs" x="464.0" y="66.0">pfor1</text><rect 