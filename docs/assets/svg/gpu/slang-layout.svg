<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="720" height="284" role="img" aria-label="The kernel sources in gpu/kernels. common/payload.slang holds the shared payload loads. stages/ holds pfor.slang, pfor_bands.slang, pivco.slang, planar_scan.slang and planar_zigzag.slang. programs/ holds pfor.slang, pivco.slang and place.slang, which include the payload helpers and the stages they need. Each program is compiled once per sample width, pfor and pivco for 1 and 2 bytes and place for 1, 2, 4, 8 and 16 bytes, which gives nine modules per target, pfor1, pfor2, pivco1, pivco2 and place1 to place16."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
