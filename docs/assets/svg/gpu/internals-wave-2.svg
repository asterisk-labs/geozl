234">76</text><rect class="hot" x="330" y="194" width="30" height="26" rx="3"/><text class="v" x="345.0" y="211.0">5</text><text class="lab" x="334" y="234">77</text><rect class="val" x="364" y="194" width="30" height="26" rx="3"/><text class="v" x="379.0" y="211.0">5</text><text class="lab" x="368" y="234">78</text><rect class="val" x="398" y="194" width="30" height="26" rx="3"/><text class="v" x="413.0" y="211.0">1</text><text class="lab" x="402" y="234">79</text><text class="note" x="20" y="262">All 32 threads read the 3 low bits of their 8 values at once.</text><text class="bad" x="20" y="278">Value 77 reads 5, but it is really 61. Its other bits are not here yet.</text></svg>