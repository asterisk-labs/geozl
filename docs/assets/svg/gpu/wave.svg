<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 266" width="640" height="266" role="img" aria-label="One GPU wave of 32 threads, t0 to t31. One instruction is sent to all of them and each runs it on its own value. Neighbouring threads can pass a value with a shuffle for about the cost of an add. Each thread computes where its own data starts in the compressed block, so no thread waits for another. A GPU runs thousands of such waves."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.ttl{fill:#111111;font:600 13px "IBM Plex Mono",monospace}
.cap{fill:#111111;font:500 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.mid{text-anchor:middle}
.grey{fill:#F3F3F1;stroke:#9AA1AB}
.ind{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.3}
.yel{fill:#FEF6D3;stroke:#F7CC09;stroke-width:1.3}.yelt{fill:#7A5D00}
.mintt{fill:#1D7A3E;font-weight:600}
.arr{fill:none;stroke:#492AE8;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.1;stroke-linecap:round}
.arrm{fill:none;stroke:#1D7A3E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="ttl" x="20" y="26">one wave</text><text class="lab" x="20" y="44">32 threads, one instruction at a time</text><text class="lab" x="640" y="26" text-anchor="end" dx="-20">a GPU runs thousands of waves like this</text><rect class="yel" x="20" y="54" width="250" height="24" rx="4"/><text class="cap yelt" x="30" y="71">v = data[offset(t)] &amp; mask</text><path class="arrg" d="M27.5 88 H585.5"/><path class="arrg" d="M145 78 V88"/><path class="arrg" d="M27.5 88 V102"/><path class="arrg" d="M45.5 88 V102"/><path class="arrg" d="M63.5 88 V102"/><path class="arrg" d="M81.5 88 V102"/><path class="arrg" d="M99.5 88 V102"/><path class="arrg" d="M117.5 88 V102"/><path class="arrg" d="M135.5 88 V102"/><path class="arrg" d="M153.5 88 V102"/><path class="arrg" d="M171.5 88 V102"/><path class="arrg" d="M189.5 88 V102"/><path class="arrg" d="M207.5 88 V102"/><path class="arrg" d="M225.5 88 V102"/><path class="arrg" d="M243.5 88 V102"/><path class="arrg" d="M261.5 88 V102"/><path class="arrg" d="M279.5 88 V102"/><path class="arrg" d="M297.5 88 V102"/><path class="arrg" d="M315.5 88 V102"/><path class="arrg" d="M333.5 88 V102"/><path class="arrg" d="M351.5 88 V102"/><path class="arrg" d="M369.5 88 V102"/><path class="arrg" d="M387.5 88 V102"/><path class="arrg" d="M405.5 88 V102"/><path class="arrg" d="M423.5 88 V102"/><path class="arrg" d="M441.5 88 V102"/><path class="arrg" d="M459.5 88 V102"/><path class="arrg" d="M477.5 88 V102"/><path class="arrg" d="M495.5 88 V102"/><path class="arrg" d="M513.5 88 V102"/><path class="arrg" d="M531.5 88 V102"/><path class="arrg" d="M549.5 88 V102"/><path class="arrg" d="M567.5 88 V102"/><path class="arrg" d="M585.5 88 V102"/><rect class="ind" x="20" y="104" width="15" height="20" rx="3"/><rect class="ind" x="38" y="104" width="15" height="20" rx="3"/><rect class="ind" x="56" y="104" width="15" height="20" rx="3"/><rect class="ind" x=