<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" width="640" height="304" role="img" aria-label="One Slang source in gpu/kernels, with programs, stages and common files, is compiled by slangc once per target. The Metal target gives Metal source that the Metal runtime compiles for the device. The PTX target goes through NVRTC 12.2 and the CUDA driver JIT compiles the PTX for the device. A WGSL target for a WebGPU backend is planned. Every target yields nine modules, one per program and sample width, hashed in sources.sha256 and embedded in the library."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.ttl{fill:#111111;font:600 13px "IBM Plex Mono",monospace}
.cap{fill:#111111;font:500 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.mid{text-anchor:middle}
.grey{fill:#F3F3F1;stroke:#9AA1AB}
.ind{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.3}
.yel{fill:#FEF6D3;stroke:#F7CC09;stroke-width:1.3}.yelt{fill:#7A5D00}
.mint{fill:#E6F4EA;stroke:#1D7A3E;stroke-width:1.3}.mintt{fill:#1D7A3E}
.plan{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:4 3}
.arr{fill:none;stroke:#492AE8;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 3}]]></style>
<text class="ttl" x="20" y="26">one source</text>
<text class="ttl" x="222" y="26">compiled once per target</text>
<text class="ttl" x="452" y="26">loaded on the device</text>
<text class="lab" x="20" y="44">gpu/kernels</text>
<text class="lab" x="222" y="44">tools/build_gpu_modules.py</text>
<text class="lab" x="452" y="44">core/src/gpu/runtime_*</text>
<rect class="yel" x="20" y="58" width="168" height="196" rx="5"/>
<text class="cap yelt" x="32" y="80">programs/</text>
<text class="lab" x="44" y="98">pfor.slang</text>
<text class="lab" x="44" y="114">pivco.slang</text>
<text class="lab" x="44" y="130">place.slang</text>
<text class="cap yelt" x="32" y="156">stages/</text>
<text class="lab" x="44" y="174">pfor.slang</text>
<text class="lab" x="44" y="190">pivco.slang</text>
<text class="lab" x="44" y="206">planar_zigzag.slang</text>
<text class="cap yelt" x="32" y="230">common/</text>
<text class="lab" x="44" y="246">payload.slang</text>
<rect class="ind" x="222" y="58" width="178" height="52" rx="5"/>
<text class="cap" x="234" y="80">slangc -target metal</text>
<text class="lab" x="234" y="98">pfor1.metal … place16</text>
<rect class="ind" x="222" y="130" width="178" height="52" rx="5"/>
<text class="cap" x="234" y="152">slangc -target ptx</text>
<text class="lab" x="234" y="170">via NVRTC 12.2, PTX 8.2</text>
<rect class="plan" x="222" y="202" width="178" height="52" rx="5"/>
<text class="cap" x="234" y="224" fill="#5C6370">slangc -target wgsl</text>
<text class="lab" x="234" y="242">planned</text>
<rect class="mint" x="452" y="58" width="168" height="52" rx="5"/>
<text class="cap mintt" x="464" y="80">Metal</text>
<text class="lab" x="464" y="98">compiles the source</text>
<rect class="mint" x="452" y="130" width="168" height="52" rx="5"/>
<text class="cap mintt" x="464" y="152">CUDA</text>
<text class="lab" x="464" y="170">driver JITs the PTX</text>
<rect class="plan" x="452" y="202" width="168" height="52" rx="5"/>
<text class="cap" x="464" y="224" fill="#5C6370">WebGPU and others</text>
<text class="lab" x="464" y="242">one runtime file each</text>
