.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">2</tspan>  after, two arenas, the CPU plans call N+1 while the GPU decodes N</text><text class="ttl" x="20.0" y="46.0">two staging arenas, CUDA, one stream</text><text class="smL" x="20.0" y="69.0">CPU</text><line class="rule" x1="130.0" y1="77.0" x2="677.2" y2="77.0"/><rect class="hot" x="130.0" y="54.0" width="70.0" height="22.0" rx="3"/><text class="vs" x="165.0" y="69.0" text-anchor="middle">plan N</text><rect class="hot" x="202.0" y="54.0" width="70.0" height="22.0" rx="3"/><text class="vs" x="237.0" y="69.0" text-anchor="middle">plan N+1</text><text class="smL" x="20.0" y="97.0">GPU</text><line class="rule" x1="130.0" y1="105.0" x2="677.2" y2="105.0"/><rect class="val" x="202.0" y="82.0" width="106.0" height="22.0" rx="3"/><text class="vs" x="255.0" y="97.0" text-anchor="middle">decode N</text><rect class="val" x="310.0" y="82.0" width="106.0" height="22.0" rx="3"/><text class="vs" x="363.0" y="97.0" text-anchor="middle">decode N+1</text><text class="smL" x="20.0" y="125.0">arena 0</text><line class="rule" x1="130.0" y1="133.0" x2="677.2" y2="133.0"/><rect class="dim" x="130.0" y="110.0" width="178.0" height="22.0" rx="3"/><text class="vs" x="219.0" y="125.0" text-anchor="middle">N</text><text class="smL" x="20.0" y="153.0">arena 1</text><line class="rule" x1="130.0" y1="161.0" x2="677.2" y2="161.0"/><rect class="dim" x="202.0" y="138.0" width="214.0" height="22.0" rx="3"/><text class="vs" x="309.0" y="153.0" text-anchor="middle">N+1</text><line class="bar" x1="417.0" y1="50.0" x2="417.0" y2="164.0"/><text class="note" x="20.0" y="186.0">Arena 0 holds call N until its decode ends, and call N+1 plans into arena 1 meanwhile.</text><text class="note" x="20.0" y="202.0">The model's kernels on the same stream still run after each decode.</text></svg>
