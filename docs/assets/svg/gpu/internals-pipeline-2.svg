.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">2</tspan>  two arenas, the CPU prepares N+1 while the GPU decodes N</text><text class="lab" x="20" y="67">CPU prepares</text><path class="rule" d="M120 76 H680"/><text class="lab" x="20" y="95">GPU decodes</text><path class="rule" d="M120 104 H680"/><text class="lab" x="20" y="131">arena A holds</text><path class="rule" d="M120 140 H680"/><text class="lab" x="20" y="159">arena B holds</text><path class="rule" d="M120 168 H680"/><rect class="hot" x="120.0" y="52" width="68.0" height="22" rx="3"/><text class="vs" x="154.0" y="67.0">N</text><rect class="val" x="190.0" y="80" width="98.0" height="22" rx="3"/><text class="vs" x="239.0" y="95.0">N</text><rect class="val2" x="120.0" y="116" width="168.0" height="22" rx="3"/><text class="vs" x="204.0" y="131.0">call N</text><rect class="hot" x="190.0" y="52" width="68.0" height="22" rx="3"/><text class="vs" x="224.0" y="67.0">N+1</text><rect class="val" x="290.0" y="80" width="98.0" height="22" rx="3"/><text class="vs" x="339.0" y="95.0">N+1</text><rect class="val2" x="190.0" y="144" width="198.0" height="22" rx="3"/><text class="vs" x="289.0" y="159.0">call N+1</text><text class="note" x="20" y="204">Call N+1 goes into arena B, so the CPU does not wait for decode N.</text><text class="note" x="20" y="220">The GPU starts decode N+1 as soon as decode N ends.</text></svg>