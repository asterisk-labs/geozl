<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" width="640" height="272" role="img" aria-label="The example tree, rebuilt by both sides from the Huffman weights. The root is an internal node with bitmap 01010100, its left child a is a constant leaf and its right child b or c is an internal node with bitmap 010 and constant leaves b and c. In the block the nodes are written in pre-order, the root bitmap, its count of 1s, 3, and the b or c bitmap without a count because both its children are leaves. The leaves store nothing. A real lane is cut into blocks of 32768 symbols.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
    svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .lab{fill:#5C6370;font:500 11.5px "IBM Plex Mono",monospace;letter-spacing:.03em}
    .k{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace;text-anchor:middle}
    .k2{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
    .v{fill:#492AE8;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
    .note{fill:#5C6370;font:500 10.5px "IBM Plex Mono",monospace}
    .el{fill:#5C6370;font:600 11px "IBM Plex Mono",monospace}
    .int{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.3}
    .leaf{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
    .cnt{fill:#FEF6D3;stroke:#7A5D00;stroke-width:1.2}
    .edge{stroke:#9AA1AB;stroke-width:1.3}
    .brace{fill:none;stroke:#9AA1AB;stroke-width:1}
  ]]></style>
  <text class="lab" x="20" y="20">the tree, rebuilt from the weights</text><rect class="int" x="70" y="32" width="110" height="40" rx="5"/><text class="k" x="125.0" y="49">root</text><text class="v" x="125.0" y="64">01010100</text><rect class="leaf" x="20" y="112" width="60" height="40" rx="5"/><text class="k" x="50.0" y="129">a</text><rect class="int" x="150" y="112" width="110" height="40" rx="5"/><text class="k" x="205.0" y="129">b or c</text><text class="v" x="205.0" y="144">010</text><rect class="leaf" x="110" y="192" width="60" height="40" rx="5"/><text class="k" x="140.0" y="209">b</text><rect class="leaf" x="200" y="192" width="60" height="40" rx="5"/><text class="k" x="230.0" y="209">c</text><path class="edge" d="M105 72 L55 112"/><text class="el" x="70.0" y="92.0">0</text><path class="edge" d="M150 72 L195 112"/><text class="el" x="178.5" y="92.0">1</text><path class="edge" d="M185 152 L145 192"/><text class="el" x="155.0" y="172.0">0</text><path class="edge" d="M225 152 L235 192"/><text class="el" x="236.0" y="172.0">1</text><rect class="int" x="20" y="252" width="12" height="10" rx="2"/><text class="note" x="38" y="261">internal node, bitmap</text><rect class="leaf" x="180" y="252" width="12" height="10" rx="2"/><text class="note" x="198" y="261">constant leaf, stores nothing</text><text class="lab" x="320" y="20">the block, nodes in pre-order</text><rect class="int" x="320" y="44" width="90" height="34" rx="4"/><text class="k" x="365" y="66">01010100</text><text class="k2" x="424" y="59">root bitmap</text><text class="note" x="424" y="73">1 bit per symbol, 1 byte</text><rect class="cnt" x="320" y="88" width="90" height="34" rx="4"/><text class="k" x="365" y="110">3</text><text class="k2" x="424" y="103">count of 1s</text><text class="note" x="424" y="117">locates the b or c data</text><rect class="int" x="320" y="132" width="90" height="34" rx="4"/><text class="k" x="365" y="154">010·····</text><text class="k2" x="424" y="147">b or c bitmap</text><text class="note" x="424" y="161">no count, its children are leaves</text><text class="note" x="320" y="184">a, b and c add nothing</text><path class="brace" d="M312 44 H306 V166 H312"/><text class="note" x="320" y="216">a real lane: blocks of 32768 symbols,</text><text class="note" x="320" y="230">each with its own bitmaps</text>
</svg>
