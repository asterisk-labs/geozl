<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-label="Step 5 of 5. after, one wave decodes one strip, block after block."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">5</tspan>  <tspan class="good" style="font-size:13px">after</tspan>  one wave decodes one strip, block after block</text><text class="smL" x="20" y="44">one strip, the wave walks its blocks from left to right</text><text class="lab" x="20" y="68">block 0, done</text><rect class="out" x="21" y="77" width="12" height="12" rx="2"/><rect class="out" x="35" y="77" width="12" height="12" rx="2"/><rect class="out" x="49" y="77" width="12" height="12" rx="2"/><rect class="hot" x="63" y="77" width="12" height="12" rx="2"/><rect class="out" x="21" y="91" width="12" height="12" rx="2"/><rect class="out" x="35" y="91" width="12" height="12" rx="2"/><rect class="out" x="49" y="91" width="12" height="12" rx="2"/><rect class="hot" x="63" y="91" width="12" height="12" rx="2"/><rect class="out" x="21" y="105" width="12" height="12" rx="2"/><rect class="out" x="35" y="105" width="12" height="12" rx="2"/><rect class="out" x="49" y="105" width="12" height="12" rx="2"/><rect class="hot" x="63" y="105" width="12" height="12" rx="2"/><rect class="out" x="21" y="119" width="12" height="12" rx="2"/><rect class="out" x="35" y="119" width="12" height="12" rx="2"/><rect class="out" x="49" y="119" width="12" height="12" rx="2"/><rect class="hot" x="63" y="119" width="12" height="12" rx="2"/><text class="lab" x="120" y="68">block 1, now</text><rect class="val" x="121" y="77" width="12" height="12" rx="2"/><rect class="val" x="135" y="77" width="12" height="12" rx="2"/><rect class="val" x="149" y="77" width="12" height="12" rx="2"/><rect class="val" x="163" y="77" width="12" height="12" rx="2"/><rect class="val" x="121" y="91" width="12" height="12" rx="2"/><rect class="val" x="135" y="91" width="12" height="12" rx="2"/><rect class="val" x="149" y="91" width="12" height="12" rx="2"/><rect class="val" x="163" y="91" width="12" height="12" rx="2"/><rect class="val" x="121" y="105" width="12" height="12" rx="2"/><rect class="val" x="135" y="105" width="12" height="12" rx="2"/><rect class="val" x="149" y="105" width="12" height="12" rx="2"/><rect class="val" x="163" y="105" width="12" height="12" rx="2"/><rect class="val" x="121" y="119" width="12" height="12" rx="2"/><rect class="val" x="135" y="119" width="12" height="12" rx="2"/><rect class="val" x="149" y="119" width="12" height="12" rx="2"/><rect class="val" x="163" y="119" width="12" height="12" rx="2"/><text class="lab" x="220" y="68">block 2, next</text><rect class="dim" x="221" y="77" width="12" height="12" rx="2"/><rect class="dim" x="235" y="77" width="12" height="12" rx="2"/><rect class="dim" x="249" y="77" width="12" height="12" rx="2"/><rect class="dim" x="263" y="77" width="12" height="12" rx="2"/><rect class="dim" x="221" y="91" width="12" height="12" rx="2"/><rect class="dim" x="235" y="91" width="12" height="12" rx="2"/><rect class="dim" x="249" y="91" width="12" height="12" rx="2"/><rect class="dim" x="263" y="91" width="12" height="12" rx="2"/><rect class="dim" x="221" y="105" width="12" height="12" rx="2"/><rect class="dim" x="235" y="105" width="12" height="12" rx="2"/><rect class="dim" x="249" y="105" width="12" height="12" rx="2"/><rect class="dim" x="263" y="105" width="12" height="12" rx="2"/><rect class="dim" x="221" y="119" width="12" height="12" rx="2"/><rect class="dim" x="235" y="119" width="12" height="12" rx="2"/><rect class="dim" x="249" y="119" width="12" height="12" rx="2"/><rect class="dim" x="263" y="119" width="12" height="12" rx="2"/><text class="lab" x="360" y="68">block 63</text><rect class="dim" x="361" y="77" width="12" height="12" rx="2"/><rect class="dim" x="375" y="77" width="12" height="12" rx="2"/><rect class="dim" x="389" y="77" width="12" height="12" rx="2"/><rect class="dim" x="403" y="77" width="12" height="12" rx="2"/><rect class="dim" x="361" y="91" width="12" height="12" rx="2"/><rect class="dim" x="375" y="91" width="12" height="12" rx="2"/><rect class="dim" x="389" y="91" width="12" height="12" rx="2"/><rect class="dim" x="403" y="91" width="12" height="12" rx="2"/><rect class="dim" x="361" y="105" width="12" height="12" rx="2"/><rect class="dim" x="375" y="105" width="12" height="12" rx="2"/><rect class="dim" x="389" y="105" width="12" height="12" rx="2"/><rect class="dim" x="403" y="105" width="12" height="12" rx="2"/><rect class="dim" x="361" y="119" width="12" height="12" rx="2"/><rect class="dim" x="375" y="119" width="12" height="12" rx="2"/><rect class="dim" x="389" y="119" width="12" height="12" rx="2"/><rect class="dim" x="403" y="119" width="12" height="12" rx="2"/><text class="vs" x="314" y="108">&#8230;</text><path class="arry" d="M78 83 H117"/><path class="arry" d="M113 87 L117 83 L113 79"/><path class="arry" d="M78 97 H117"/><path class="arry" d="M113 101 L117 97 L113 93"/><path class="arry" d="M78 111 H117"/><path class="arry" d="M113 115 L117 111 L113 107"/><path class="arry" d="M78 125 H117"/><path class="arry" d="M113 129 L117 125 L113 121"/><text class="note" x="432" y="76">A block is 16 rows by 16</text><text class="note" x="432" y="92">columns, drawn here as 4 by 4.</text><text class="eq" x="432" y="124">Block 1 adds the last value</text><text class="eq" x="432" y="140">of each row of block 0 to</text><text class="eq" x="432" y="156">the same row.</text><text class="smL" x="20" y="196">what the wave does with block 1, without leaving its registers</text><rect class="val" x="20" y="204" width="120" height="36" rx="3"/><text class="vs" x="80.0" y="219.5">read the 256</text><text class="vs" x="80.0" y="232.5">residuals</text><path class="arr" d="M141 222 H152"/><path class="arr" d="M147 227 L152 222 L147 217"/><rect class="val" x="154" y="204" width="120" height="36" rx="3"/><text class="vs" x="214.0" y="219.5">undo</text><text class="vs" x="214.0" y="232.5">zigzag</text><path class="arr" d="M275 222 H286"/><path class="arr" d="M281 227 L286 222 L281 217"/><rect class="val" x="288" y="204" width="120" height="36" rx="3"/><text class="vs" x="348.0" y="219.5">sum inside</text><text class="vs" x="348.0" y="232.5">the block</text><path class="arr" d="M409 222 H420"/><path class="arr" d="M415 227 L420 222 L415 217"/><rect class="val" x="422" y="204" width="120" height="36" rx="3"/><text class="vs" x="482.0" y="219.5">add the last</text><text class="vs" x="482.0" y="232.5">values of block 0</text><path class="arr" d="M543 222 H554"/><path class="arr" d="M549 227 L554 222 L549 217"/><rect class="out" x="556" y="204" width="120" height="36" rx="3"/><text class="vs" x="616.0" y="219.5">write the</text><text class="vs" x="616.0" y="232.5">finished pixels</text><text class="good" x="20" y="272">the residuals never reach GPU memory. Each pixel is written to the</text><text class="good" x="20" y="288">tensor once, already finished, with no scan afterwards</text></svg>