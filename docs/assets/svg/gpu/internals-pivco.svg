<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-label="Four waves of 32 threads take one PivCo block and share its tree through shared memory. They decode the levels from the deepest to the root, with a barrier between each level and the next."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}.num{fill:#492AE8;font-weight:700}
.ttl{fill:#111111;font:600 12px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.sm{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace;text-anchor:middle;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
.smL{fill:#5C6370;font:500 9.5px "IBM Plex Mono",monospace}
.v{fill:#111111;font:600 11.5px "IBM Plex Mono",monospace;text-anchor:middle}
.vs{fill:#111111;font:600 10px "IBM Plex Mono",monospace;text-anchor:middle}
.note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.eq{fill:#7A5D00;font:600 11.5px "IBM Plex Mono",monospace}
.op{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
.good{fill:#1D7A3E;font:600 11px "IBM Plex Mono",monospace}
.bad{fill:#B42318;font:600 11px "IBM Plex Mono",monospace}
.panel{fill:#FAFAF8;stroke:#D3D6DB;stroke-width:1}
.val{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.1}
.val2{fill:#E3F2FF;stroke:#2B6CB0;stroke-width:1.1}
.dim{fill:#F3F3F1;stroke:#D3D6DB;stroke-width:1}
.cell{fill:#FFFFFF;stroke:#D3D6DB;stroke-width:.8}
.hot{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.6}
.out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.busy{fill:#492AE8;stroke:#492AE8;stroke-width:1}
.idle{fill:#FFFFFF;stroke:#9AA1AB;stroke-width:1}
.red{fill:#FDE8E8;stroke:#B42318;stroke-width:1.1}
.ln{stroke:#B9BEC6;stroke-width:1;fill:none}
.lnh{stroke:#E0A800;stroke-width:2;fill:none}
.bar{stroke:#B42318;stroke-width:1.6;stroke-dasharray:4 3}
.rule{stroke:#E3E5E8;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="smL" x="20" y="44">one PivCo block, one byte lane of up to 32 768 symbols, is too big for one wave</text><rect class="val" x="20" y="52" width="136" height="28" rx="3"/><text class="vs" x="88.0" y="70.0">wave 0, 32 threads</text><path class="arr" d="M88 82 V104"/><path class="arr" d="M84 99 L88 104 L92 99"/><path class="arr" d="M88 104 V82"/><path class="arr" d="M84 77 L88 82 L92 77"/><rect class="val" x="168" y="52" width="136" height="28" rx="3"/><text class="vs" x="236.0" y="70.0">wave 1, 32 threads</text><path class="arr" d="M236 82 V104"/><path class="arr" d="M232 99 L236 104 L240 99"/><path class="arr" d="M236 104 V82"/><path class="arr" d="M232 77 L236 82 L240 77"/><rect class="val" x="316" y="52" width="136" height="28" rx="3"/><text class="vs" x="384.0" y="70.0">wave 2, 32 threads</text><path class="arr" d="M384 82 V104"/><path class="arr" d="M380 99 L384 104 L388 99"/><path class="arr" d="M384 104 V82"/><path class="arr" d="M380 77 L384 82 L388 77"/><rect class="val" x="464" y="52" width="136" height="28" rx="3"/><text class="vs" x="532.0" y="70.0">wave 3, 32 threads</text><path class="arr" d="M532 82 V104"/><path class="arr" d="M528 99 L532 104 L536 99"/><path class="arr" d="M532 104 V82"/><path class="arr" d="M528 77 L532 82 L536 77"/><rect class="hot" x="20" y="106" width="580" height="30" rx="3"/><text class="vs" x="310.0" y="125.0">shared memory, the block's tree, read and written by all four waves</text><text class="smL" x="20" y="172">the levels, from the deepest to the root</text><rect class="out" x="20" y="180" width="112" height="28" rx="3"/><text class="vs" x="76.0" y="198.0">deepest level</text><path class="bar" d="M148 174 V214"/><text class="bad" x="135" y="228">barrier</text><rect class="out" x="164" y="180" width="112" height="28" rx="3"/><text class="vs" x="220.0" y="198.0">level 2</text><path class="bar" d="M292 174 V214"/><text class="bad" x="279" y="228">barrier</text><rect class="out" x="308" y="180" width="112" height="28" rx="3"/><text class="vs" x="364.0" y="198.0">level 1</text><path class="bar" d="M436 174 V214"/><text class="bad" x="423" y="228">barrier</text><rect class="out" x="452" y="180" width="112" height="28" rx="3"/><text class="vs" x="508.0" y="198.0">root</text><text class="note" x="20" y="258">A wave shares values through registers, but four waves can only share through</text><text class="note" x="20" y="274">memory. Each level waits at a barrier until all four waves have written the level below.</text></svg>