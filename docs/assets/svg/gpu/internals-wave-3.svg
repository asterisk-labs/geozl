.arry{fill:none;stroke:#E0A800;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}]]></style><text class="cap" x="20" y="20"><tspan class="num">3</tspan>  the wave shares where the exceptions are</text><text class="smL" x="20" y="44">the block as it is stored</text><rect class="val" x="20" y="52" width="56" height="28" rx="3"/><text class="vs" x="48.0" y="70.0">b = 3</text><rect class="val" x="76" y="52" width="100" height="28" rx="3"/><text class="vs" x="126.0" y="70.0">3 exceptions</text><rect class="hot" x="176" y="52" width="110" height="28" rx="3"/><text class="vs" x="231.0" y="70.0">at 18 77 200</text><rect class="val" x="286" y="52" width="124" height="28" rx="3"/><text class="vs" x="348.0" y="70.0">their high bits</text><rect class="val2" x="410" y="52" width="270" height="28" rx="3"/><text class="vs" x="545.0" y="70.0">3 low bits of each of the 256 values</text><text class="smL" x="300" y="112">the wave, 32 threads, each owns 8 values</text><rect class="hot" x="20" y="120" width="17" height="22" rx="3"/><rect class="hot" x="40" y="120" width="17" height="22" rx="3"/><rect class="hot" x="60" y="120" width="17" height="22" rx="3"/><rect class="dim" x="80" y="120" width="17" height="22" rx="3"/><rect class="dim" x="100" y="120" width="17" height="22" rx="3"/><rect class="dim" x="120" y="120" width="17" height="22" rx="3"/><rect class="dim" x="140" y="120" width="17" height="22" rx="3"/><rect class="dim" x="160" y="120" width="17" height="22" rx="3"/><rect class="dim" x="180" y="120" width="17" height="22" rx="3"/><rect class="dim" x="200" y="120" width="17" height="22" rx="3"/><rect class="dim" x="220" y="120" width="17" height="22" rx="3"/><rect class="dim" x="240" y="120" width="17" height="22" rx="3"/><rect class="dim" x="260" y="120" width="17" height="22" rx="3"/><rect class="dim" x="280" y="120" width="17" height="22" rx="3"/><rect class="dim" x="300" y="120" width="17" height="22" rx="3"/><rect class="dim" x="320" y="120" width="17" height="22" rx="3"/><rect class="dim" x="340" y="120" width="17" height="22" rx="3"/><rect class="dim" x="360" y="120" width="17" height="22" rx="3"/><rect class="dim" x="380" y="120" width="17" height="22" rx="3"/><rect class="dim" x="400" y="120" width="17" height="22" rx="3"/><rect class="dim" x="420" y="120" width="17" height="22" rx="3"/><rect class="dim" x="440" y="120" width="17" height="22" rx="3"/><rect class="dim" x="460" y="120" width="17" height="22" rx="3"/><rect class="dim" x="480" y="120" width="17" height="22" rx="3"/><rect class="dim" x="500" y="120" width="17" height="22" rx="3"/><rect class="dim" x="520" y="120" width="17" height="22" rx="3"/><rect class="dim" x="540" y="120" width="17" height="22" rx="3"/><rect class="dim" x="560" y="120" width="17" height="22" rx="3"/><rect class="dim" x="580" y="120" width="17" height="22" rx="3"/><rect class="dim" x="600" y="120" width="17" height="22" rx="3"/><rect class="dim" x="620" y="120" width="17" height="22" rx="3"/><rect class="dim" x="640" y="120" width="17" height="22" rx="3"/><text class="lab" x="20" y="156">t0</text><text class="lab" x="200" y="156">t9</text><text class="lab" x="640" y="156">t31</text><path class="arr" d="M190 82 L28 118"/><path class="arr" d="M32.5 114.0 L28 118 L33.8 119.7"/><path class="arr" d="M226 82 L48 118"/><path class="arr" d="M52.6 114.1 L48 118 L53.7 119.8"/><path class="arr" d="M262 82 L68 118"/><path class="arr" d="M72.7 114.2 L68 118 L73.7 119.9"/><text class="op" x="20" y="186">wave OR</text><rect class="out" x="96" y="172" width="300" height="24" rx="3"/><text class="vs" x="246.0" y="188.0">every thread now knows: 18, 77, 200</text><text class="note" x="20" y="222">Threads 0, 1 and 2 each read one exception position, and one wave</text><text class="note" x="20" y="238">operation shares them with all 32 threads, as a 256-bit mask in</text><text class="note" x="20" y="254">registers. Thread 9 sees that 77 is one of its values.</text></svg>