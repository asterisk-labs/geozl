<svg xmlns="http://www.w3.org/2000/svg" width="472" height="104" viewBox="64 48 472 104" role="img" aria-label="GeoZL — Geospatial codec extensions for OpenZL">
<style>
.sq{animation:source 6s ease-in-out infinite}
.sq-purple,.signal-nw{--mark-color:#7457FF}
.sq-green,.signal-n{--mark-color:#91F2BC}
.sq-yellow,.signal-w{--mark-color:#FFD54A}
.tgt{fill:#222B38;animation:target 6s ease-in-out infinite}
.arr{stroke:#E6EDF3;animation:af 6s ease-in-out infinite}
.signal{fill:var(--mark-color);opacity:0;transform-box:fill-box;transform-origin:center}
.signal-nw{animation:flow-nw 6s ease-in-out infinite}
.signal-n{animation:flow-n 6s ease-in-out infinite}
.signal-w{animation:flow-w 6s ease-in-out infinite}
@keyframes source{0%,14%,86%,100%{fill:#222B38}22%,78%{fill:var(--mark-color)}}
@keyframes target{0%,57%,86%,100%{fill:#222B38}63%,78%{fill:#FF7A4F}}
@keyframes af{0%,18%,72%,100%{opacity:.1}27%,60%{opacity:.95}}
@keyframes flow-nw{0%,25%{opacity:0;transform:translate(0,0)}29%{opacity:1}58%{opacity:1;transform:translate(100px,100px)}61%,100%{opacity:0;transform:translate(100px,100px)}}
@keyframes flow-n{0%,25%{opacity:0;transform:translate(0,0)}29%{opacity:1}58%{opacity:1;transform:translate(0,100px)}61%,100%{opacity:0;transform:translate(0,100px)}}
@keyframes flow-w{0%,25%{opacity:0;transform:translate(0,0)}29%{opacity:1}58%{opacity:1;transform:translate(100px,0)}61%,100%{opacity:0;transform:translate(100px,0)}}
.wm{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-weight:500;fill:#E6EDF3}
.tag{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-weight:400;fill:#8B949E}
@media (prefers-reduced-motion:reduce){.sq,.tgt,.arr,.signal{animation:none}.sq{fill:var(--mark-color)}.tgt{fill:#FF7A4F}.arr{opacity:.95}.signal{display:none}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g transform="translate(58,42) scale(0.58)">
  <rect class="sq sq-purple" x="18" y="18" width="44" height="44" rx="6" fill="#222B38"/>
  <rect class="sq sq-green" x="118" y="18" width="44" height="44" rx="6" fill="#222B38"/>
  <rect class="sq sq-yellow" x="18" y="118" width="44" height="44" rx="6" fill="#222B38"/>
  <rect class="tgt" x="118" y="118" width="44" height="44" rx="6" stroke="#30363D" stroke-width="3.5"/>
  <line class="arr" x1="140" y1="66" x2="140" y2="113" stroke-width="2.6" marker-end="url(#ah)"/>
  <line class="arr" x1="66" y1="140" x2="113" y2="140" stroke-width="2.6" marker-end="url(#ah)"/>
  <line class="arr" x1="64" y1="64" x2="112" y2="112" stroke-width="2.6" marker-end="url(#ah)"/>
  <circle class="signal signal-nw" cx="40" cy="40" r="5"/>
  <circle class="signal signal-n" cx="140" cy="40" r="5"/>
  <circle class="signal signal-w" cx="40" cy="140" r="5"/>
</g>
<text class="wm" x="205" y="112" font-size="78" letter-spacing="-3">GeoZL</text>
<text class="tag" x="208" y="144" font-size="16">Geospatial codec extensions for OpenZL</text>
</svg>
