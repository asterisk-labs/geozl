<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 242" width="680" height="242" role="img" aria-label="Before, the serial loop of average computes the whole mean for each sample, half of N, half of W, the shared low bit W and N and 1, and the residual, one sample at a time, although half of N does not need W. After, half of N plus the residual, B, and the low bit of N, L, are computed for every column at once in lanes before the row starts, and the serial loop keeps only the three steps that need W, half of W, W and L, and plus B."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.tag{fill:#5C6370;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.tagA{fill:#492AE8;font:600 10.5px "IBM Plex Mono",monospace;letter-spacing:.06em}
.ttl{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.c{fill:#111111;font:600 10.5px "IBM Plex Mono",monospace;text-anchor:middle}
.ct{fill:#7A5D00;font:600 9.5px "IBM Plex Mono",monospace;text-anchor:middle}
.cell{fill:#F3F3F1;stroke:#C4C8CE;stroke-width:1}
.test{fill:#FEF6D3;stroke:#E0A800;stroke-width:1.1}
.free{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.1}
.chip{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.2}
.chipN{fill:#F3F3F1;stroke:#9AA1AB;stroke-width:1.1}
.lane{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
.arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rule{stroke:#E3E5E8;stroke-width:1}]]></style><text class="tag" x="20" y="20">BEFORE</text><text class="ttl" x="84" y="20">everything inside the serial loop</text><text class="lab" x="20" y="34">sample 1</text><rect class="chipN" x="20" y="38" width="40" height="26" rx="3"/><text class="c" x="40.0" y="55">N/2</text><rect class="chip" x="64" y="38" width="40" height="26" rx="3"/><text class="c" x="84.0" y="55">W/2</text><rect class="chip" x="108" y="38" width="58" height="26" rx="3"/><text class="c" x="137.0" y="55">W&amp;N&amp;1</text><rect class="chip" x="170" y="38" width="36" height="26" rx="3"/><text class="c" x="188.0" y="55">+ r</text><path class="arr" d="M210 51 H228"/><path class="arr" d="M223 46 L229 51 L223 56"/><text class="lab" x="234" y="34">sample 2</text><rect class="chipN" x="234" y="38" width="40" height="26" rx="3"/><text class="c" x="254.0" y="55">N/2</text><rect class="chip" x="278" y="38" width="40" height="26" rx="3"/><text class="c" x="298.0" y="55">W/2</text><rect class="chip" x="322" y="38" width="58" height="26" rx="3"/><text class="c" x="351.0" y="55">W&amp;N&amp;1</text><rect class="chip" x="384" y="38" width="36" height="26" rx="3"/><text class="c" x="402.0" y="55">+ r</text><path class="arr" d="M424 51 H442"/><path class="arr" d="M437 46 L443 51 L437 56"/><text class="lab" x="448" y="34">sample 3</text><rect class="chipN" x="448" y="38" width="40" height="26" rx="3"/><text class="c" x="468.0" y="55">N/2</text><rect class="chip" x="492" y="38" width="40" height="26" rx="3"/><text class="c" x="512.0" y="55">W/2</text><rect class="chip" x="536" y="38" width="58" height="26" rx="3"/><text class="c" x="565.0" y="55">W&amp;N&amp;1</text><rect class="chip" x="598" y="38" width="36" height="26" rx="3"/><text class="c" x="616.0" y="55">+ r</text><text class="lab" x="20" y="84">the loop runs one sample at a time, the grey step does not even need W</text><line class="rule" x1="20" y1="98" x2="660" y2="98"/><text class="tagA" x="20" y="118">AFTER</text><text class="ttl" x="84" y="118">the N half moves ahead of the row</text><rect class="lane" x="20" y="130" width="640" height="26" rx="3"/><text class="c" x="340" y="147">ahead of the row, in lanes, B = r + N/2 and L = N &amp; 1 for every column at once</text><text class="lab" x="20" y="180">sample 1</text><rect class="chip" x="20" y="184" width="40" height="26" rx="3"/><text class="c" x="40.0" y="201">W/2</text><rect class="chip" x="64" y="184" width="44" height="26" rx="3"/><text class="c" x="86.0" y="201">W&amp;L</text><rect class="chip" x="112" y="184" width="36" height="26" rx="3"/><text class="c" x="130.0" y="201">+ B</text><path class="arr" d="M152 197 H170"/><path class="arr" d="M165 192 L171 197 L165 202"/><text class="lab" x="176" y="180">sample 2</text><rect class="chip" x="176" y="184" width="40" height="26" rx="3"/><text class="c" x="196.0" y="201">W/2</text><rect class="chip" x="220" y="184" width="44" height="26" rx="3"/><text class="c" x="242.0" y="201">W&amp;L</text><rect class="chip" x="268" y="184" width="36" height="26" rx="3"/><text class="c" x="286.0" y="201">+ B</text><path class="arr" d="M308 197 H326"/><path class="arr" d="M321 192 L327 197 L321 202"/><text class="lab" x="332" y="180">sample 3</text><rect class="chip" x="332" y="184" width="40" height="26" rx="3"/><text class="c" x="352.0" y="201">W/2</text><rect class="chip" x="376" y="184" width="44" height="26" rx="3"/><text class="c" x="398.0" y="201">W&amp;L</text><rect class="chip" x="424" y="184" width="36" height="26" rx="3"/><text class="c" x="442.0" y="201">+ B</text><text class="lab" x="20" y="230">only the steps that need W stay in the loop, the arrow passes each sample on as the next W</text></svg>
