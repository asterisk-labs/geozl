<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-label="Before, planar decoded as written, x equals W plus N minus NW plus r, so each of eight pixels waits for the one on its left, eight steps one after another. After, the row step c equals r plus N minus NW is computed for all eight lanes with one instruction, because N and NW come from the finished row above, and a prefix sum of c in three steps gives the row."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.ttl{fill:#111111;font:600 13px "IBM Plex Mono",monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}
.tag{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.06em}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.num{font:600 13px "IBM Plex Mono",monospace;text-anchor:middle}
.sm{font:500 10.5px "IBM Plex Mono",monospace;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.grey{fill:#F3F3F1;stroke:#9AA1AB}.greyt{fill:#5C6370}
.ink{fill:#FFFFFF;stroke:#111111}.inkt{fill:#111111}
.ind{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.3}.indt{fill:#492AE8}
.mint{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.3}.mintt{fill:#1D7A3E}
.yel{fill:#FEF6D3;stroke:#F7CC09;stroke-width:1.3}.yelt{fill:#7A5D00}
.faint{fill:#FFFFFF;stroke:#E6E6E3}.faintt{fill:#C4C8CE}
.rule{stroke:#E6E6E3;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#C9A400;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arrm{fill:none;stroke:#1D7A3E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
]]></style><text class="tag greyt" x="20" y="24">BEFORE</text><text class="cap" x="84" y="24">the formula as written</text><text class="lab" x="20" y="42">x = W + N &#8722; NW + r, each pixel waits for the one on its left</text><rect class="grey" x="120" y="58" width="52" height="34" rx="4"/><text class="num greyt" x="146.0" y="80">x0</text><rect class="grey" x="180" y="58" width="52" height="34" rx="4"/><text class="num greyt" x="206.0" y="80">x1</text><path class="arry" d="M170.0 75.0 L183.0 75.0 M177.5 71.9 L183.0 75.0 L177.5 78.1"/><rect class="grey" x="240" y="58" width="52" height="34" rx="4"/><text class="num greyt" x="266.0" y="80">x2</text><path class="arry" d="M230.0 75.0 L243.0 75.0 M237.5 71.9 L243.0 75.0 L237.5 78.1"/><rect class="grey" x="300" y="58" width="52" height="34" rx="4"/><text class="num greyt" x="326.0" y="80">x3</text><path class="arry" d="M290.0 75.0 L303.0 75.0 M297.5 71.9 L303.0 75.0 L297.5 78.1"/><rect class="grey" x="360" y="58" width="52" height="34" rx="4"/><text class="num greyt" x="386.0" y="80">x4</text><path class="arry" d="M350.0 75.0 L363.0 75.0 M357.5 71.9 L363.0 75.0 L357.5 78.1"/><rect class="grey" x="420" y="58" width="52" height="34" rx="4"/><text class="num greyt" x="446.0" y="80">x5</text><path class="arry" d="M410.0 75.0 L423.0 75.0 M417.5 71.9 L423.0 75.0 L417.5 78.1"/><rect class="grey" x="480" y="58" width="52" height="34" rx="4"/><text class="num greyt" x="506.0" y="80">x6</text><path class="arry" d="M470.0 75.0 L483.0 75.0 M477.5 71.9 L483.0 75.0 L477.5 78.1"/><rect class="grey" x="540" y="58" width="52" height="34" rx="4"/><text class="num greyt" x="566.0" y="80">x7</text><path class="arry" d="M530.0 75.0 L543.0 75.0 M537.5 71.9 L543.0 75.0 L537.5 78.1"/><text class="lab" x="20" y="80">one row</text><text class="lab" x="120" y="112">8 pixels, 8 steps, one after another</text><line class="rule" x1="20" y1="134" x2="620" y2="134"/><text class="tag indt" x="20" y="162">AFTER</text><text class="cap" x="84" y="162">a row step, then a prefix sum</text><text class="lab" x="20" y="180">N and NW are in the finished row above, so that part needs no W</text><rect class="ind" x="120" y="196" width="52" height="34" rx="4"/><text class="sm indt" x="146.0" y="217">c0</text><rect class="ind" x="180" y="196" width="52" height="34" rx="4"/><text class="sm indt" x="206.0" y="217">c1</text><rect class="ind" x="240" y="196" width="52" height="34" rx="4"/><text class="sm indt" x="266.0" y="217">c2</text><rect class="ind" x="300" y="196" width="52" height="34" rx="4"/><text class="sm indt" x="326.0" y="217">c3</text><rect class="ind" x="360" y="196" width="52" height="34" rx="4"/><text class="sm indt" x="386.0" y="217">c4</text><rect class="ind" x="420" y="196" width="52" height="34" rx="4"/><text class="sm indt" x="446.0" y="217">c5</text><rect class="ind" x="480" y="196" width="52" height="34" rx="4"/><text class="sm indt" x="506.0" y="217">c6</text><rect class="ind" x="540" y="196" width="52" height="34" rx="4"/><text class="sm indt" x="566.0" y="217">c7</text><text class="lab" x="20" y="210">row step</text><text class="lab" x="20" y="224">1 instruction</text><rect fill="none" stroke="#111111" stroke-width="1.4" x="116" y="192" width="480" height="42" rx="6"/><text class="lab" x="120" y="250">c = r + N &#8722; NW for all 8 lanes at once</text><path class="arrm" d="M146.0 256.0 L146.0 272.0 M149.1 266.5 L146.0 272.0 L142.9 266.5"/><rect class="mint" x="120" y="276" width="52" height="34" rx="4"/><text class="num mintt" x="146.0" y="298">x0</text><path class="arrm" d="M206.0 256.0 L206.0 272.0 M209.1 266.5 L206.0 272.0 L202.9 266.5"/><rect class="mint" x="180" y="276" width="52" height="34" rx="4"/><text class="num mintt" x="206.0" y="298">x1</text><path class="arrm" d="M266.0 256.0 L266.0 272.0 M269.1 266.5 L266.0 272.0 L262.9 266.5"/><rect class="mint" x="240" y="276" width="52" height="34" rx="4"/><text class="num mintt" x="266.0" y="298">x2</text><path class="arrm" d="M326.0 256.0 L326.0 272.0 M329.1 266.5 L326.0 272.0 L322.9 266.5"/><rect class="mint" x="300" y="276" width="52" height="34" rx="4"/><text class="num mintt" x="326.0" y="298">x3</text><path class="arrm" d="M386.0 256.0 L386.0 272.0 M389.1 266.5 L386.0 272.0 L382.9 266.5"/><rect class="mint" x="360" y="276" width="52" height="34" rx="4"/><text class="num mintt" x="386.0" y="298">x4</text><path class="arrm" d="M446.0 256.0 L446.0 272.0 M449.1 266.5 L446.0 272.0 L442.9 266.5"/><rect class="mint" x="420" y="276" width="52" height="34" rx="4"/><text class="num mintt" x="446.0" y="298">x5</text><path class="arrm" d="M506.0 256.0 L506.0 272.0 M509.1 266.5 L506.0 272.0 L502.9 266.5"/><rect class="mint" x="480" y="276" width="52" height="34" rx="4"/><text class="num mintt" x="506.0" y="298">x6</text><path class="arrm" d="M566.0 256.0 L566.0 272.0 M569.1 266.5 L566.0 272.0 L562.9 266.5"/><rect class="mint" x="540" y="276" width="52" height="34" rx="4"/><text class="num mintt" x="566.0" y="298">x7</text><text class="lab" x="20" y="290">prefix sum</text><text class="lab" x="20" y="304">3 steps</text><text class="lab" x="120" y="330">the running total of c is the row, x = W + c</text></svg>
