    #d10{ animation:k12 15.0s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes k13{ 0%{opacity:0;transform:translate(138px,-110px)} 3.333%{opacity:1;transform:translate(138px,-110px)} 22%{opacity:1;transform:translate(138px,-110px)} 28.667%{opacity:1;transform:translate(0px,0px)} 96%{opacity:1;transform:translate(0px,0px)} 100%{opacity:0;transform:translate(0px,0px)} }
    #d11{ animation:k13 15.0s cubic-bezier(.4,0,.2,1) infinite; }
