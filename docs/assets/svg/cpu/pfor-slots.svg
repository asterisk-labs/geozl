  <text id="cap1" class="cap beat" x="16" y="24"><tspan class="capn">1</tspan>  value i goes to lane i mod 8, slot i div 8</text>
  <text id="cap2" class="cap beat" x="16" y="24"><tspan class="capn">2</tspan>  the next eight values fill slot 1, and so on</text>
  <text id="cap3" class="cap beat" x="16" y="24"><tspan class="capn">3</tspan>  one 16-byte load brings 2 bytes of every lane</text>
  <text id="cap4" class="cap beat" x="16" y="24"><tspan class="capn">4</tspan>  slot 0 is bits 0 to 2 of every lane, one shift and one mask</text>
  <text id="cap5" class="cap beat" x="16" y="24"><tspan class="capn">5</tspan>  slot 1 is bits 3 to 5 of every lane, the same shift for all</text>
  <text id="capsum" class="cap" x="16" y="24">one 16-byte load holds the same slot of all 8 lanes at one bit offset</text>
  <text class="lab" x="16" y="63">body</text><text class="lab" x="16" y="85">i</text>
