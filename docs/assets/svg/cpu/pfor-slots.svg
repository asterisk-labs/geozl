    text{ font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace; }
    .cap{ fill:#111111; font-size:13px; font-weight:500; }
    .capn{ fill:#492AE8; font-weight:600; }
    .lab{ fill:#5C6370; font-size:11px; font-weight:500; }
