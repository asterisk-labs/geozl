<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img" aria-label="Values of the body are dealt into eight lanes. Value i goes to lane i mod 8 at slot i div 8, so 3 5 2 7 4 6 1 90 fill slot 0 and the next eight fill slot 1. One 16-byte load brings 2 bytes of every lane, so slot 0 sits at bits 0 to 2 and slot 1 at bits 3 to 5 in every lane, and one shift and mask recovers a slot for all lanes at once.">
  <style><![CDATA[
