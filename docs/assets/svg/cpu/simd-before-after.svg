<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 214" width="690" height="214" role="img" aria-label="Before, decoding eight samples of delta_n takes eight add instructions of one value each, 3 plus 1520 is 1523, 2 plus 1522 is 1524, and so on. After, the eight residuals sit in one 128-bit register and the eight samples of the row above in another, and a single add instruction adds them lane by lane and gives all eight results at once.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
    svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .ttl{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace}
    .step{fill:#492AE8;font:600 11px "IBM Plex Mono",monospace}
    .v{fill:#111111;font:500 11.5px "IBM Plex Mono",monospace}
    .note{fill:#5C6370;font:500 10.5px "IBM Plex Mono",monospace}
    .lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
    .c{fill:#111111;font:600 11px "IBM Plex Mono",monospace;text-anchor:middle}
    .in{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.2}
    .out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
    .op{fill:#492AE8;font:700 15px "IBM Plex Mono",monospace}
    .one{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
    .arr{fill:none;stroke:#492AE8;stroke-width:1.6;stroke-linecap:round}
  ]]></style>
  <text class="ttl" x="20" y="24">before, one value per instruction</text><text class="step" x="20" y="53">add 1</text><text class="v" x="78" y="53">3 + 1520 = 1523</text><text class="step" x="20" y="72">add 2</text><text class="v" x="78" y="72">2 + 1522 = 1524</text><text class="step" x="20" y="91">add 3</text><text class="v" x="78" y="91">1 + 1525 = 1526</text><text class="step" x="20" y="110">add 4</text><text class="v" x="78" y="110">0 + 1530 = 1530</text><text class="step" x="20" y="129">add 5</text><text class="v" x="78" y="129">4 + 1531 = 1535</text><text class="step" x="20" y="148">add 6</text><text class="v" x="78" y="148">1 + 1529 = 1530</text><text class="step" x="20" y="167">add 7</text><text class="v" x="78" y="167">2 + 1527 = 1529</text><text class="step" x="20" y="186">add 8</text><text class="v" x="78" y="186">0 + 1526 = 1526</text><text class="note" x="20" y="204">8 add instructions, one value each</text><text class="ttl" x="318" y="24">after, eight values per instruction</text><text class="lab" x="318" y="56">res</text><rect class="in" x="360" y="40" width="38" height="24" rx="3"/><text class="c" x="379" y="56">3</text><rect class="in" x="400" y="40" width="38" height="24" rx="3"/><text class="c" x="419" y="56">2</text><rect class="in" x="440" y="40" width="38" height="24" rx="3"/><text class="c" x="459" y="56">1</text><rect class="in" x="480" y="40" width="38" height="24" rx="3"/><text class="c" x="499" y="56">0</text><rect class="in" x="520" y="40" width="38" height="24" rx="3"/><text class="c" x="539" y="56">4</text><rect class="in" x="560" y="40" width="38" height="24" rx="3"/><text class="c" x="579" y="56">1</text><rect class="in" x="600" y="40" width="38" height="24" rx="3"/><text class="c" x="619" y="56">2</text><rect class="in" x="640" y="40" width="38" height="24" rx="3"/><text class="c" x="659" y="56">0</text><text class="op" x="514" y="86">+</text><text class="lab" x="318" y="108">up</text><rect class="in" x="360" y="92" width="38" height="24" rx="3"/><text class="c" x="379" y="108">1520</text><rect class="in" x="400" y="92" width="38" height="24" rx="3"/><text class="c" x="419" y="108">1522</text><rect class="in" x="440" y="92" width="38" height="24" rx="3"/><text class="c" x="459" y="108">1525</text><rect class="in" x="480" y="92" width="38" height="24" rx="3"/><text class="c" x="499" y="108">1530</text><rect class="in" x="520" y="92" width="38" height="24" rx="3"/><text class="c" x="539" y="108">1531</text><rect class="in" x="560" y="92" width="38" height="24" rx="3"/><text class="c" x="579" y="108">1529</text><rect class="in" x="600" y="92" width="38" height="24" rx="3"/><text class="c" x="619" y="108">1527</text><rect class="in" x="640" y="92" width="38" height="24" rx="3"/><text class="c" x="659" y="108">1526</text><path class="arr" d="M520 122 V146"/><path class="arr" d="M516 140 L520 146 L524 140"/><text class="one" x="532" y="140">one add, all 8 lanes</text><text class="lab" x="318" y="166">row</text><rect class="out" x="360" y="150" width="38" height="24" rx="3"/><text class="c" x="379" y="166">1523</text><rect class="out" x="400" y="150" width="38" height="24" rx="3"/><text class="c" x="419" y="166">1524</text><rect class="out" x="440" y="150" width="38" height="24" rx="3"/><text class="c" x="459" y="166">1526</text><rect class="out" x="480" y="150" width="38" height="24" rx="3"/><text class="c" x="499" y="166">1530</text><rect class="out" x="520" y="150" width="38" height="24" rx="3"/><text class="c" x="539" y="166">1535</text><rect class="out" x="560" y="150" width="38" height="24" rx="3"/><text class="c" x="579" y="166">1530</text><rect class="out" x="600" y="150" width="38" height="24" rx="3"/><text class="c" x="619" y="166">1529</text><rect class="out" x="640" y="150" width="38" height="24" rx="3"/><text class="c" x="659" y="166">1526</text><text class="note" x="318" y="196">one 128-bit register, 8 lanes of 16 bits</text>
</svg>
