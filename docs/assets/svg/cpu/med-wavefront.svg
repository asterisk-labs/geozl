<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" width="640" height="508" role="img" aria-label="Before, med decodes one row at a time, a single serial chain through the west neighbour, and the next row starts only when this one ends. After, med decodes four rows at once, row 2 one column behind row 1, row 3 behind row 2 and row 4 behind row 3, so the four chains are independent and the lower rows read N and NW from registers."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
