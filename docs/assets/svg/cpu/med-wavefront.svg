<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="med decodes four rows at once. Each row is a serial chain through its west neighbour, but row 2 runs one column behind row 1, row 3 behind row 2 and row 4 behind row 3, so the four chains are independent and the lower rows read N and NW from registers."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.ttl{fill:#111111;font:600 13px "IBM Plex Mono",monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}
.n{fill:#492AE8;font-weight:600}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.num{font:600 13px "IBM Plex Mono",monospace;text-anchor:middle}
.mid{text-anchor:middle}
.grey{fill:#F3F3F1;stroke:#9AA1AB}.greyt{fill:#5C6370}
.ink{fill:#FFFFFF;stroke:#111111}.inkt{fill:#111111}
.ind{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.3}.indt{fill:#492AE8}
.mint{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.3}.mintt{fill:#1D7A3E}
.yel{fill:#FEF6D3;stroke:#F7CC09;stroke-width:1.3}.yelt{fill:#7A5D00}
.faint{fill:#FFFFFF;stroke:#E6E6E3}.faintt{fill:#C4C8CE}
.reg{fill:none;stroke:#111111;stroke-width:1.4}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.arrm{fill:none;stroke:#1D7A3E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.in{animation:in .45s cubic-bezier(.4,0,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none}}]]></style><text class="lab" x="110" y="61" text-anchor="end">row above</text><rect class="grey" x="121" y="41" width="32" height="32" rx="3"/><rect class="grey" x="155" y="41" width="32" height="32" rx="3"/><rect class="grey" x="189" y="41" width="32" height="32" rx="3"/><rect class="grey" x="223" y="41" width="32" height="32" rx="3"/><rect class="grey" x="257" y="41" width="32" height="32" rx="3"/><rect class="grey" x="291" y="41" width="32" height="32" rx="3"/><rect class="grey" x="325" y="41" width="32" height="32" rx="3"/><rect class="grey" x="359" y="41" width="32" height="32" rx="3"/><rect class="grey" x="393" y="41" width="32" height="32" rx="3"/><rect class="grey" x="427" y="41" width="32" height="32" rx="3"/><rect class="grey" x="461" y="41" width="32" height="32" rx="3"/><rect class="grey" x="495" y="41" width="32" height="32" rx="3"/><rect class="grey" x="529" y="41" width="32" height="32" rx="3"/><rect class="grey" x="563" y="41" width="32" height="32" rx="3"/><text class="lab" x="110" y="95" text-anchor="end">row 1</text><rect class="grey" x="121" y="75" width="32" height="32" rx="3"/><rect class="grey" x="155" y="75" width="32" height="32" rx="3"/><rect class="grey" x="189" y="75" width="32" height="32" rx="3"/><rect class="grey" x="223" y="75" width="32" height="32" rx="3"/><rect class="grey" x="257" y="75" width="32" height="32" rx="3"/><rect class="grey" x="291" y="75" width="32" height="32" rx="3"/><rect class="grey" x="325" y="75" width="32" height="32" rx="3"/><rect class="grey" x="359" y="75" width="32" height="32" rx="3"/><rect class="grey" x="393" y="75" width="32" height="32" rx="3"/><rect class="ind" x="427" y="75" width="32" height="32" rx="3"/><rect class="faint" x="461" y="75" width="32" height="32" rx="3"/><rect class="faint" x="495" y="75" width="32" height="32" rx="3"/><rect class="faint" x="529" y="75" width="32" height="32" rx="3"/><rect class="faint" x="563" y="75" width="3