<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" role="img" aria-label="Two ways to pack 3-bit values. Packed one after another, values cut across byte boundaries at different places, so each needs its own shift. In GeoZL PFOR each lane is its own bit stream, so one 16-byte load holds the same slot of every lane at the same bits, and one shift, and and or unpack all eight."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
