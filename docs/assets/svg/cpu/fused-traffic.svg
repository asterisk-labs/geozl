<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Before, a 2 MiB uint16 tile decoded by three separate nodes. pfor writes 2 MiB of codes, zigzag reads them and writes 2 MiB of residuals, planar reads those and writes the 2 MiB tile, about 10 MiB through memory besides the frame. After, the fused planar_zigzag_pfor codec unpacks, unzigzags and reconstructs 256 values at a time in registers and a small buffer that stays in cache, so only the frame is read and only the tile is written."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.ttl{fill:#111111;font:600 13px "IBM Plex Mono",monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}
.tag{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.06em}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.num{font:600 13px "IBM Plex Mono",monospace;text-anchor:middle}
.sm{font:500 10.5px "IBM Plex Mono",monospace;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.grey{fill:#F3F3F1;stroke:#9AA1AB}.greyt{fill:#5C6370}
.ink{fill:#FFFFFF;stroke:#111111}.inkt{fill:#111111}
.ind{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.3}.indt{fill:#492AE8}
.mint{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.3}.mintt{fill:#1D7A3E}
.yel{fill:#FEF6D3;stroke:#F7CC09;stroke-width:1.3}.yelt{fill:#7A5D00}
.faint{fill:#FFFFFF;stroke:#E6E6E3}.faintt{fill:#C4C8CE}
.rule{stroke:#E6E6E3;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#C9A400;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arrm{fill:none;stroke:#1D7A3E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
]]></style><text class="tag greyt" x="20" y="24">BEFORE</text><text class="cap" x="84" y="24">three nodes, a whole stream between each</text><rect class="grey" x="24" y="44" width="70" height="42" rx="4"/><text class="sm greyt" x="59.0" y="62.0">frame</text><text class="sm greyt" x="59.0" y="76.0">1.5 MiB</text><path class="arrg" d="M97.0 65.0 L109.0 65.0 M103.5 61.9 L109.0 65.0 L103.5 68.1"/><rect class="ink" x="112" y="44" width="56" height="42" rx="4"/><text class="sm inkt" x="140.0" y="69.0">pfor</text><path class="arrg" d="M171.0 65.0 L183.0 65.0 M177.5 61.9 L183.0 65.0 L177.5 68.1"/><rect class="yel" x="186" y="44" width="80" height="42" rx="4"/><text class="sm yelt" x="226.0" y="62.0">codes</text><text class="sm yelt" x="226.0" y="76.0">2 MiB</text><path class="arrg" d="M269.0 65.0 L281.0 65.0 M275.5 61.9 L281.0 65.0 L275.5 68.1"/><rect class="ink" x="284" y="44" width="64" height="42" rx="4"/><text class="sm inkt" x="316.0" y="69.0">zigzag</text><path class="arrg" d="M351.0 65.0 L363.0 65.0 M357.5 61.9 L363.0 65.0 L357.5 68.1"/><rect class="yel" x="366" y="44" width="80" height="42" rx="4"/><text class="sm yelt" x="406.0" y="62.0">residuals</text><text class="sm yelt" x="406.0" y="76.0">2 MiB</text><path class="arrg" d="M449.0 65.0 L461.0 65.0 M455.5 61.9 L461.0 65.0 L455.5 68.1"/><rect class="ink" x="464" y="44" width="60" height="42" rx="4"/><text class="sm inkt" x="494.0" y="69.0">planar</text><path class="arrg" d="M527.0 65.0 L539.0 65.0 M533.5 61.9 L539.0 65.0 L533.5 68.1"/><rect class="mint" x="542" y="44" width="70" height="42" rx="4"/><text class="sm mintt" x="577.0" y="62.0">tile</text><text class="sm mintt" x="577.0" y="76.0">2 MiB</text><text class="lab" x="24" y="112">each stream is written whole, then read whole by the next node,</text><text class="lab" x="24" y="128">about 10 MiB through memory besides the frame</text><line class="rule" x1="20" y1="148" x2="620" y2="148"/><text class="tag indt" x="20" y="176">AFTER</text><text class="cap" x="84" y="176">one fused codec, one block at a time</text><rect class="grey" x="24" y="210" width="70" height="42" rx="4"/><text class="sm greyt" x="59.0" y="228.0">frame</text><text class="sm greyt" x="59.0" y="242.0">1.5 MiB</text><path class="arrg" d="M97.0 231.0 L109.0 231.0 M103.5 227.9 L109.0 231.0 L103.5 234.1"/><rect class="ink" x="112" y="196" width="412" height="70" rx="6"/><text class="sm inkt" x="318.0" y="213">planar_zigzag_pfor</text><rect class="ind" x="126" y="226" width="112" height="30" rx="4"/><text class="sm indt" x="182.0" y="245.0">unpack</text><path class="arr" d="M241.0 241.0 L254.0 241.0 M248.5 237.9 L254.0 241.0 L248.5 244.1"/><rect class="ind" x="256" y="226" width="112" height="30" rx="4"/><text class="sm indt" x="312.0" y="245.0">unzigzag</text><path class="arr" d="M371.0 241.0 L384.0 241.0 M378.5 237.9 L384.0 241.0 L378.5 244.1"/><rect class="ind" x="386" y="226" width="128" height="30" rx="4"/><text class="sm indt" x="450.0" y="245.0">row step + prefix</text><path class="arrg" d="M527.0 231.0 L539.0 231.0 M533.5 227.9 L539.0 231.0 L533.5 234.1"/><rect class="mint" x="542" y="210" width="70" height="42" rx="4"/><text class="sm mintt" x="577.0" y="228.0">tile</text><text class="sm mintt" x="577.0" y="242.0">2 MiB</text><text class="lab" x="24" y="290">256 values at a time, in registers and a small buffer that stays</text><text class="lab" x="24" y="306">in cache, so only the frame is read and only the tile is written</text></svg>
