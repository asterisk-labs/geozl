.yel{fill:#FEF6D3;stroke:#F7CC09;stroke-width:1.3}.yelt{fill:#7A5D00}
.faint{fill:#FFFFFF;stroke:#E6E6E3}.faintt{fill:#C4C8CE}
.reg{fill:none;stroke:#111111;stroke-width:1.4}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.arrm{fill:none;stroke:#1D7A3E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.in{animation:in .45s cubic-bezier(.4,0,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none}}]]></style><text class="ttl" x="20" y="26">a CPU core with SIMD</text><text class="lab" x="20" y="44">walks the row, 8 lanes per step</text><rect class="grey" x="20" y="60" width="64" height="26" rx="4"/><path class="arrg" d="M28 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M36 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M44 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M52 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M60 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M68 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M76 63 V83" style="stroke:#D5D8DC"/><path class="arrm" d="M78 90 Q89 104 100 90"/><rect class="ind" x="94" y="60" width="64" height="26" rx="4"/><path class="arrg" d="M102 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M110 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M118 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M126 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M134 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M142 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M150 63 V83" style="stroke:#D5D8DC"/><path class="arrm" d="M152 90 Q163 104 174 90"/><rect class="grey" x="168" y="60" width="64" height="26" rx="4"/><path class="arrg" d="M176 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M184 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M192 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M200 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M208 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M216 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M224 63 V83" style="stroke:#D5D8DC"/><path class="arrm" d="M226 90 Q237 104 248 90"/><rect class="grey" x="242" y="60" width="64" height="26" rx="4"/><path class="arrg" d="M250 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M258 63 V83" style="stroke:#D5D8DC"/><path class="arrg" d="M266 63 V83" style="stroke:#D5