<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-label="Before, the carry for the next register was the last lane of the finished output, so the chain from one register to the next was an add followed by a lane copy, two steps per register. After, the carry grows by the last lane of the register's own prefix sum, which is ready early, so the chain from register to register is a single add."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
.ttl{fill:#111111;font:600 13px "IBM Plex Mono",monospace}
.cap{fill:#111111;font:500 13px "IBM Plex Mono",monospace}
.tag{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.06em}
.lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
.num{font:600 13px "IBM Plex Mono",monospace;text-anchor:middle}
.sm{font:500 10.5px "IBM Plex Mono",monospace;text-anchor:middle}
.mid{text-anchor:middle}.end{text-anchor:end}
.grey{fill:#F3F3F1;stroke:#9AA1AB}.greyt{fill:#5C6370}
.ink{fill:#FFFFFF;stroke:#111111}.inkt{fill:#111111}
.ind{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.3}.indt{fill:#492AE8}
.mint{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.3}.mintt{fill:#1D7A3E}
.yel{fill:#FEF6D3;stroke:#F7CC09;stroke-width:1.3}.yelt{fill:#7A5D00}
.faint{fill:#FFFFFF;stroke:#E6E6E3}.faintt{fill:#C4C8CE}
.rule{stroke:#E6E6E3;stroke-width:1}
.arr{fill:none;stroke:#492AE8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.arrg{fill:none;stroke:#9AA1AB;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.arry{fill:none;stroke:#C9A400;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arrm{fill:none;stroke:#1D7A3E;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
]]></style><text class="tag greyt" x="20" y="24">BEFORE</text><text class="cap" x="84" y="24">carry = last lane of the output</text><text class="lab mid" x="202" y="48">register k</text><text class="lab mid" x="358" y="48">register k+1</text><text class="lab mid" x="514" y="48">register k+2</text><rect class="grey" x="150" y="58" width="104" height="28" rx="4"/><text class="sm greyt" x="202" y="76">prefix of x</text><path class="arrg" d="M180.0 87.0 L180.0 104.0 M183.1 98.5 L180.0 104.0 L176.9 98.5"/><rect class="ind" x="150" y="106" width="60" height="28" rx="4"/><text class="sm indt" x="180" y="124">+ carry</text><path class="arry" d="M211.0 120.0 L222.0 120.0 M216.5 116.9 L222.0 120.0 L216.5 123.1"/><rect class="yel" x="224" y="106" width="70" height="28" rx="4"/><text class="sm yelt" x="259" y="124">last lane</text><path class="arry" d="M295.0 120.0 L305.0 120.0 M299.5 116.9 L305.0 120.0 L299.5 123.1"/><rect class="grey" x="306" y="58" width="104" height="28" rx="4"/><text class="sm greyt" x="358" y="76">prefix of x</text><path class="arrg" d="M336.0 87.0 L336.0 104.0 M339.1 98.5 L336.0 104.0 L332.9 98.5"/><rect class="ind" x="306" y="106" width="60" height="28" rx="4"/><text class="sm indt" x="336" y="124">+ carry</text><path class="arry" d="M367.0 120.0 L378.0 120.0 M372.5 116.9 L378.0 120.0 L372.5 123.1"/><rect class="yel" x="380" y="106" width="70" height="28" rx="4"/><text class="sm yelt" x="415" y="124">last lane</text><path class="arry" d="M451.0 120.0 L461.0 120.0 M455.5 116.9 L461.0 120.0 L455.5 123.1"/><rect class="grey" x="462" y="58" width="104" height="28" rx="4"/><text class="sm greyt" x="514" y="76">prefix of x</text><path class="arrg" d="M492.0 87.0 L492.0 104.0 M495.1 98.5 L492.0 104.0 L488.9 98.5"/><rect class="ind" x="462" y="106" width="60" height="28" rx="4"/><text class="sm indt" x="492" y="124">+ carry</text><path class="arry" d="M523.0 120.0 L534.0 120.0 M528.5 116.9 L534.0 120.0 L528.5 123.1"/><rect class="yel" x="536" y="106" width="70" height="28" rx="4"/><text class="sm yelt" x="571" y="124">last lane</text><text class="lab" x="20" y="116">on the chain</text><text class="lab" x="20" y="130">2 steps each</text><text class="lab" x="150" y="156">the next carry waits for the add and then for the lane copy</text><line class="rule" x1="20" y1="174" x2="620" y2="174"/><text class="tag indt" x="20" y="200">AFTER</text><text class="cap" x="84" y="200">carry = carry + last lane of the prefix</text><text class="lab mid" x="202" y="224">register k</text><text class="lab mid" x="358" y="224">register k+1</text><text class="lab mid" x="514" y="224">register k+2</text><rect class="grey" x="150" y="234" width="104" height="28" rx="4"/><text class="sm greyt" x="202" y="252">prefix of x</text><path class="arrg" d="M230.0 263.0 L230.0 280.0 M233.1 274.5 L230.0 280.0 L226.9 274.5"/><rect class="grey" x="196" y="282" width="70" height="26" rx="4"/><text class="sm greyt" x="231" y="299">last lane</text><path class="arrg" d="M231.0 309.0 L231.0 322.0 M234.1 316.5 L231.0 322.0 L227.9 316.5"/><rect class="ind" x="196" y="324" width="70" height="28" rx="4"/><text class="sm indt" x="231" y="342">carry +</text><path class="arry" d="M267.0 338.0 L351.0 338.0 M345.5 334.9 L351.0 338.0 L345.5 341.1"/><rect class="grey" x="306" y="234" width="104" height="28" rx="4"/><text class="sm greyt" x="358" y="252">prefix of x</text><path class="arrg" d="M386.0 263.0 L386.0 280.0 M389.1 274.5 L386.0 280.0 L382.9 274.5"/><rect class="grey" x="352" y="282" width="70" height="26" rx="4"/><text class="sm greyt" x="387" y="299">last lane</text><path class="arrg" d="M387.0 309.0 L387.0 322.0 M390.1 316.5 L387.0 322.0 L383.9 316.5"/><rect class="ind" x="352" y="324" width="70" height="28" rx="4"/><text class="sm indt" x="387" y="342">carry +</text><path class="arry" d="M423.0 338.0 L507.0 338.0 M501.5 334.9 L507.0 338.0 L501.5 341.1"/><rect class="grey" x="462" y="234" width="104" height="28" rx="4"/><text class="sm greyt" x="514" y="252">prefix of x</text><path class="arrg" d="M542.0 263.0 L542.0 280.0 M545.1 274.5 L542.0 280.0 L538.9 274.5"/><rect class="grey" x="508" y="282" width="70" height="26" rx="4"/><text class="sm greyt" x="543" y="299">last lane</text><path class="arrg" d="M543.0 309.0 L543.0 322.0 M546.1 316.5 L543.0 322.0 L539.9 316.5"/><rect class="ind" x="508" y="324" width="70" height="28" rx="4"/><text class="sm indt" x="543" y="342">carry +</text><text class="lab" x="20" y="334">on the chain</text><text class="lab" x="20" y="348">1 add each</text><text class="lab" x="150" y="376">the prefix and its last lane are ready before the carry arrives</text></svg>
