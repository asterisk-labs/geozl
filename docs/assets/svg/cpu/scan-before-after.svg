97"/><text class="op" x="522" y="196">shift 4, add all 8 lanes</text><text class="w" x="318" y="224">wait 3</text><rect class="out" x="374" y="208" width="32" height="24" rx="3"/><text class="c" x="390.0" y="224">11</text><rect class="out" x="409" y="208" width="32" height="24" rx="3"/><text class="c" x="425.0" y="224">13</text><rect class="out" x="444" y="208" width="32" height="24" rx="3"/><text class="c" x="460.0" y="224">15</text><rect class="out" x="479" y="208" width="32" height="24" rx="3"/><text class="c" x="495.0" y="224">17</text><rect class="out" x="514" y="208" width="32" height="24" rx="3"/><text class="c" x="530.0" y="224">18</text><rect class="out" x="549" y="208" width="32" height="24" rx="3"/><text class="c" x="565.0" y="224">21</text><rect class="out" x="584" y="208" width="32" height="24" rx="3"/><text class="c" x="600.0" y="224">20</text><rect class="out" x="619" y="208" width="32" height="24" rx="3"/><text class="c" x="635.0" y="224">19</text><text class="tot" x="318" y="246">3 waits for the same 8 samples</text>
