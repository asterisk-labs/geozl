    .c{fill:#111111;font:600 11px "IBM Plex Mono",monospace;text-anchor:middle}
    .in{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.2}
    .out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
    .arr{fill:none;stroke:#492AE8;stroke-width:1.5;stroke-linecap:round}
  ]]></style>
  <text class="ttl" x="20" y="22">before, one add at a time</text><text class="w" x="20" y="56">wait 1</text><text class="v" x="84" y="56">11</text><text class="w" x="20" y="80">wait 2</text><text class="v" x="84" y="80">11 + 2 = 13</text><text class="w" x="20" y="104">wait 3</text><text class="v" x="84" y="104">13 + 2 = 15</text><text class="w" x="20" y="128">wait 4</text><text class="v" x="84" y="128">15 + 2 = 17</text><text class="w" x="20" y="152">wait 5</text><text class="v" x="84" y="152">17 + 1 = 18</text><text class="w" x="20" y="176">wait 6</text><text class="v" x="84" y="176">18 + 3 = 21</text><text class="w" x="20" y="200">wait 7</text><text class="v" x="84" y="200">21 &#8722; 1 = 20</text><text class="w" x="20" y="224">wait 8</text><text class="v" x="84" y="224">20 &#8722; 1 = 19</text><text class="tot" x="20" y="246">8 waits, one per sample</text><text class="ttl" x="318" y="22">after, eight adds at a time</text><text class="lab" x="318" y="56">start</text><rect class="in" x="374" y="40" width="32" height="24" rx="3"/><text class="c" x="390.0" y="56">11</text><rect class="in" x="409" y="40" width="32" height="24" rx="3"/><text class="c" x="425.0" y="56">2</text><rect class="in" x="444" y="40" width="32" height="24" rx="3"/><text class="c" x="460.0" y="56">2</text><rect class="in" x="479" y="40" width="32" height="24" rx="3"/><text class="c" x="495.0" y="56">2</text><rect class="in" x="514" y="40" width="32" height="24" rx="3"/><text class="c" x="530.0" y="56">1</text><rect class="in" x="549" y="40" width="32" height="24" rx="3"/><text class="c" x="565.0" y="56">3</text><rect class="in" x="584" y="40" width="32" height="24" rx="3"/><text class="c" x="600.0" y="56">&#8722;1</text><rect class="in" x="619" y="40" width="32" height="24" rx="3"/><text class="c" x="635.0" y="56">&#8722;1</text><path class="arr" d="M512 68 V90"/><path class="arr" d="M508 85 L512 91 L516 85"/><text class="op" x="522" y="84">shift 1, add all 8 lanes</text><text class="w" x="318" 