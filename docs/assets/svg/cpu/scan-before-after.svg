<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 258" width="690" height="258" role="img" aria-label="Before, the running total of 11 2 2 2 1 3 -1 -1 is eight adds one after another, 11, then 11 + 2 = 13, 13 + 2 = 15, up to 20 - 1 = 19, eight waits. After, the eight values sit in one register and three instructions each add all eight lanes at once, shifted by one, two and four lanes, giving 11 13 4 4 3 4 2 -2, then 11 13 15 17 7 8 5 2, then 11 13 15 17 18 21 20 19. Three waits for the same eight samples.">
