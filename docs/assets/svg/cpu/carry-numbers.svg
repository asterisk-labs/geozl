<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img" aria-label="A row of sixteen samples spans two registers. Register 1 sums its own lanes to 11 13 15 17 18 21 20 19, and nothing came before it, so that is the row. Register 2 sums its own lanes to 2 3 5 5 6 7 7 10, as if the row started there. The carry, 19, the total of everything before register 2, is added to every lane and gives 21 22 24 24 25 26 26 29. The carry for register 3 is 29. Before, it was copied from the last lane of the row, which has to wait for the add of 19. After, it is 19 plus the last of the register's own sums, 10, which is ready before 19 arrives, so only one add waits.">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
    svg{background:transparent;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .ttl{fill:#111111;font:600 12.5px "IBM Plex Mono",monospace}
    .step{fill:#492AE8;font:600 11.5px "IBM Plex Mono",monospace}
    .v{fill:#111111;font:500 11.5px "IBM Plex Mono",monospace}
    .note{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
    .lab{fill:#5C6370;font:500 11px "IBM Plex Mono",monospace}
    .add{fill:#492AE8;font:600 11px "IBM Plex Mono",monospace}
    .c{fill:#111111;font:600 11px "IBM Plex Mono",monospace;text-anchor:middle}
    .in{fill:#ECE9FD;stroke:#492AE8;stroke-width:1.2}
    .out{fill:#C4FFC2;stroke:#1D7A3E;stroke-width:1.2}
    .hl{stroke-width:2.4}
    .one{fill:#492AE8;font:700 11.5px "IBM Plex Mono",monospace}
    .arr{fill:none;stroke:#492AE8;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .rule{stroke:#D9DCE1;stroke-width:1}
  ]]></style>
  <text class="ttl" x="86" y="22">register 1, samples 1 to 8</text><text class="ttl" x="406" y="22">register 2, samples 9 to 16</text><text class="lab" x="20" y="54">own sums</text><rect class="in" x="86" y="38" width="30" height="24" rx="3"/><text class="c" x="101.0" y="54">11</text><rect class="in" x="119" y="38" width="30" height="24" rx="3"/><text class="c" x="134.0" y="54">13</text><rect class="in" x="152" y="38" width="30" height="24" rx="3"/><text class="c" x="167.0" y="54">15</text><rect class="in" x="185" y="38" width="30" height="24" rx="3"/><text class="c" x="200.0" y="54">17</text><rect class="in" x="218" y="38" width="30" height="24" rx="3"/><text class="c" x="233.0" y="54">18</text><rect class="in" x="251" y="38" width="30" height="24" rx="3"/><text class="c" x="266.0" y="54">21</text><rect class="in" x="284" y="38" width="30" height="24" rx="3"/><text class="c" x="299.0" y="54">20</text><rect class="in" x="317" y="38" width="30" height="24" rx="3"/><text class="c" x="332.0" y="54">19</text><rect class="in" x="406" y="38" width="30" height="24" rx="3"/><text class="c" x="421.0" y="54">2</text><rect class="in" x="439" y="38" width="30" height="24" rx="3"/><text class="c" x="454.0" y="54">3</text><rect class="in" x="472" y="38" width="30" height="24" rx="3"/><text class="c" x="487.0" y="54">5</text><rect class="in" x="505" y="38" width="30" height="24" rx="3"/><text class="c" x="520.0" y="54">5</text><rect class="in" x="538" y="38" width="30" height="24" rx="3"/><text class="c" x="553.0" y="54">6</text><rect class="in" x="571" y="38" width="30" height="24" rx="3"/><text class="c" x="586.0" y="54">7</text><rect class="in" x="604" y="38" width="30" height="24" rx="3"/><text class="c" x="619.0" y="54">7</text><rect class="in hl" x="637" y="38" width="30" height="24" rx="3"/><text class="c" x="652.0" y="54">10</text><text class="lab" x="20" y="94">+ carry</text><text class="add" x="86" y="94">+ 0, nothing came before</text><text class="add" x="406" y="94">+ 19 to every lane</text><text class="lab" x="20" y="134">row</text><rect class="out" x="86" y="118" width="30" height="24" rx="3"/><text class="c" x="101.0" y="134">11</text><rect class="out" x="119" y="118" width="30" height="24" rx="3"/><text class="c" x="134.0" y="134">13</text><rect class="out" x="152" y="118" width="30" height="24" rx="3"/><text class="c" x="167.0" y="134">15</text><rect class="out" x="185" y="118" width="30" height="24" rx="3"/><text class="c" x="200.0" y="134">17</text><rect class="out" x="218" y="118" width="30" height="24" rx="3"/><text class="c" x="233.0" y="134">18</text><rect class="out" x="251" y="118" width="30" height="24" rx="3"/><text class="c" x="266.0" y="134">21</text><rect class="out" x="284" y="118" width="30" height="24" rx="3"/><text class="c" x="299.0" y="134">20</text><rect class="out hl" x="317" y="118" width="30" height="24" rx="3"/><text class="c" x="332.0" y="134">19</text><rect class="out" x="406" y="118" width="30" height="24" rx="3"/><text class="c" x="421.0" y="134">21</text><rect class="out" x="439" y="118" width="30" height="24" rx="3"/><text class="c" x="454.0" y="134">22</text><rect class="out" x="472" y="118" width="30" height="24" rx="3"/><text class="c" x="487.0" y="134">24</text><rect class="out" x="505" y="118" width="30" height="24" rx="3"/><text class="c" x="520.0" y="134">24</text><rect class="out" x="538" y="118" width="30" height="24" rx="3"/><text class="c" x="553.0" y="134">25</text><rect class="out" x="571" y="118" width="30" height="24" rx="3"/><text class="c" x="586.0" y="134">26</text><rect class="out" x="604" y="118" width="30" height="24" rx="3"/><text class="c" x="619.0" y="134">26</text><rect class="out hl" x="637" y="118" width="30" height="24" rx="3"/><text class="c" x="652.0" y="134">29</text><path class="arr" d="M350 128 C377 128, 372 90, 398 90"/><path class="arr" d="M392 85 L399 90 L392 95"/><text class="one" x="332.0" y="162" text-anchor="middle">carry</text><line class="rule" x1="20" y1="184" x2="660" y2="184"/><text class="ttl" x="20" y="208">the carry for register 3</text><text class="step" x="20" y="232">before</text><text class="v" x="86" y="232">copy the last lane of the row, 29</text><text class="note" x="86" y="250">waits for the + 19, then for the copy, two steps</text><text class="step" x="20" y="278">after</text><text class="v" x="86" y="278">19 + the last of its own sums, 19 + 10 = 29</text><text class="note" x="86" y="296">the 10 is ready before the 19 arrives, one add waits</text>
</svg>
