<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" width="640" height="326" role="img" aria-label="Adding residuals to the row above one value at a time takes eight instructions in a row. A SIMD register holds eight uint16 lanes, so one instruction adds all eight at once. NEON and SSE2 registers are 128 bits, eight uint16 lanes; AVX2 registers are 256 bits, sixteen lanes."><style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
