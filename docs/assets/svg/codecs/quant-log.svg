<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="quant_log holds a relative bound. The grid of levels around 8 and the grid around 8000 have the same shape, so a sample at either end comes back within the same one per cent, and in log2 the two grids share one uniform step">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

    svg{
      --paper:#F1EDE4; --ink:#17161C; --ink-2:#625D53; --orange:#FE6B37; --page:var(--orange); --ease:cubic-bezier(.22,.7,.2,1);
      font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    }

    .lab{ fill:var(--ink-2); font:500 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.05em; }
    .fx{ fill:var(--ink); font:600 12px/1 "IBM Plex Mono",monospace; }
    .fx2{ fill:var(--ink-2); font:500 11.5px/1 "IBM Plex Mono",monospace; }
    .dot{ fill:var(--paper); stroke:var(--ink); stroke-width:1.3; }
    .cap{ fill:var(--ink-2); font:500 10.5px/1 "IBM Plex Mono",monospace; opacity:0; }
    .axlab{ fill:var(--ink-2); font:500 10px/1 "IBM Plex Mono",monospace; text-anchor:middle; }
    .pct{ fill:var(--page); font:600 10px/1 "IBM Plex Mono",monospace; text-anchor:middle; }
    .axrow{ fill:var(--ink-2); font:600 10px/1 "IBM Plex Mono",monospace; text-anchor:middle; }

    #qg-grid{ animation:s1op 10s var(--ease) infinite; }
    #qg-snap{ animation:s2op 10s var(--ease) infinite; }
    #qg-band{ animation:s3op 10s var(--ease) infinite; }
    #qg-log{ animation:s4op 10s var(--ease) infinite; }
    #dot1{ animation:dot1 10s var(--ease) infinite; }
    #dot2{ animation:dot2 10s var(--ease) infinite; }
    #dot3{ animation:dot3 10s var(--ease) infinite; }
    #dot4{ animation:dot4 10s var(--ease) infinite; }
    #cap1{ animation:cap1 10s var(--ease) infinite; }
    #cap2{ animation:cap2 10s var(--ease) infinite; }
    #cap3{ animation:cap3 10s var(--ease) infinite; }
    #cap4{ animation:cap4 10s var(--ease) infinite; }

    @keyframes s1op{ 0%,2%{opacity:0} 7%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes s2op{ 0%,25%{opacity:0} 30%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes s3op{ 0%,48%{opacity:0} 53%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes s4op{ 0%,71%{opacity:0} 76%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes dot1{ 0%,3%{fill:var(--paper)} 7%,92%{fill:var(--page)} 97%,100%{fill:var(--paper)} }
    @keyframes dot2{ 0%,26%{fill:var(--paper)} 30%,92%{fill:var(--page)} 97%,100%{fill:var(--paper)} }
    @keyframes dot3{ 0%,49%{fill:var(--paper)} 53%,92%{fill:var(--page)} 97%,100%{fill:var(--paper)} }
    @keyframes dot4{ 0%,72%{fill:var(--paper)} 76%,92%{fill:var(--page)} 97%,100%{fill:var(--paper)} }
    @keyframes cap1{ 0%,3%{opacity:0} 7%,22%{opacity:1} 25%,100%{opacity:0} }
    @keyframes cap2{ 0%,26%{opacity:0} 30%,45%{opacity:1} 48%,100%{opacity:0} }
    @keyframes cap3{ 0%,49%{opacity:0} 53%,68%{opacity:1} 71%,100%{opacity:0} }
    @keyframes cap4{ 0%,72%{opacity:0} 76%,92%{opacity:1} 97%,100%{opacity:0} }

    @media (prefers-reduced-motion:reduce){
      *{ animation:none !important; }
      #qg-grid,#qg-snap,#qg-band,#qg-log{ opacity:1; }
      #dot1,#dot2,#dot3,#dot4{ fill:var(--page); }
      #cap1,#cap2,#cap3{ opacity:0; } #cap4{ opacity:1; }
    }
  ]]></style>

          <text x="20" y="16" class="lab">the same slack at 8 and at 8000</text>
          <text x="20" y="34" class="fx">LOG:MAX_ERROR=1% &#8594; 2^step = 1.0201</text>

          <!-- rounding interval, half a level either side, drawn behind the axis -->
          <g id="qg-band">
            <rect x="68"  y="95" width="60" height="16" fill="var(--page)" opacity="0.20"/>
            <rect x="236" y="95" width="60" height="16" fill="var(--page)" opacity="0.20"/>
            <text class="pct" x="98"  y="91">&#177;1%</text>
            <text class="pct" x="266" y="91">&#177;1%</text>
          </g>

          <!-- three consecutive levels at each end. Multiply by 1.0201 to walk
               right, divide to walk left, which is why both ends look alike. -->
          <g id="qg-grid">
            <text x="30"  y="54" class="lab">around 8</text>
            <text x="198" y="54" class="lab">around 8000</text>

            <line x1="30"  y1="103" x2="166" y2="103" stroke="var(--ink)" stroke-width="1.4"/>
            <line x1="198" y1="103" x2="334" y2="103" stroke="var(--ink)" stroke-width="1.4"/>
            <g stroke="var(--ink)" stroke-width="1.4">
              <line x1="38"  y1="96" x2="38"  y2="110"/>
              <line x1="98"  y1="96" x2="98"  y2="110"/>
              <line x1="158" y1="96" x2="158" y2="110"/>
              <line x1="206" y1="96" x2="206" y2="110"/>
              <line x1="266" y1="96" x2="266" y2="110"/>
              <line x1="326" y1="96" x2="326" y2="110"/>
            </g>
            <text x="22"  y="124" class="axrow">x</text>
            <text x="190" y="124" class="axrow">x</text>
            <g class="axlab">
              <text x="38"  y="124">7.84</text><text x="98"  y="124">8.00</text><text x="158" y="124">8.16</text>
              <text x="206" y="124">7842</text><text x="266" y="124">8000</text><text x="326" y="124">8161</text>
            </g>
          </g>

          <!-- one sample at each end, both 0.625% off the level they land on -->
          <g id="qg-snap">
            <text class="fx" x="116" y="70" text-anchor="middle">8.05</text>
            <text class="fx" x="285" y="70" text-anchor="middle">8050</text>
            <line x1="116" y1="86" x2="116" y2="96" stroke="var(--ink)" stroke-width="1.1" stroke-dasharray="3 3"/>
            <line x1="285" y1="86" x2="285" y2="96" stroke="var(--ink)" stroke-width="1.1" stroke-dasharray="3 3"/>
            <circle cx="116" cy="80" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
            <circle cx="285" cy="80" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
            <circle cx="98"  cy="103" r="6.5" fill="var(--page)" stroke="var(--ink)" stroke-width="1.6"/>
            <circle cx="266" cy="103" r="6.5" fill="var(--page)" stroke="var(--ink)" stroke-width="1.6"/>
          </g>

          <!-- the payoff. q and r are nowhere near each other, the step between
               one level and the next is the same integer one at both ends. -->
          <g id="qg-log">
            <text x="22"  y="140" class="axrow" fill="var(--page)">q</text>
            <text x="190" y="140" class="axrow" fill="var(--page)">r</text>
            <g class="axlab" fill="var(--page)">
              <text x="38"  y="140">q&#8722;1</text><text x="98"  y="140">q</text><text x="158" y="140">q+1</text>
              <text x="206" y="140">r&#8722;1</text><text x="266" y="140">r</text><text x="326" y="140">r+1</text>
            </g>
            <text class="fx"  x="180" y="164" text-anchor="middle">one index step = &#215;1.0201, anywhere</text>
            <text class="fx2" x="180" y="182" text-anchor="middle">x&#770; = 2^(A + (|q| &#8722; 1) &#183; step)</text>
          </g>

          <!-- step indicator + captions -->
          <g id="qg-steps">
            <rect id="dot1" class="dot" x="20" y="199" width="9" height="9"/>
            <rect id="dot2" class="dot" x="33" y="199" width="9" height="9"/>
            <rect id="dot3" class="dot" x="46" y="199" width="9" height="9"/>
            <rect id="dot4" class="dot" x="59" y="199" width="9" height="9"/>
            <text id="cap1" class="cap" x="80" y="207">the grid at 8 and the grid at 8000</text>
            <text id="cap2" class="cap" x="80" y="207">each sample takes its nearest level</text>
            <text id="cap3" class="cap" x="80" y="207">one per cent of slack at both ends</text>
            <text id="cap4" class="cap" x="80" y="207">neighbouring levels, neighbouring index</text>
          </g>
        </svg>