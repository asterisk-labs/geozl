<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-label="quant_sqrt holds a bound that grows with the square root of the value. The levels sit further apart the higher the value goes, so the slack at 81 is three times the slack at 9, and the index behind them still steps by one throughout">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

    svg{
      --paper:#F1EDE4; --ink:#17161C; --ink-2:#625D53; --orange:#FE6B37; --page:var(--orange); --ease:cubic-bezier(.22,.7,.2,1);
      font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    }

    .lab{ fill:var(--ink-2); font:500 10.5px/1 "IBM Plex Mono",monospace; letter-spacing:.05em; }
    .fx{ fill:var(--ink); font:600 12px/1 "IBM Plex Mono",monospace; }
    .fx2{ fill:var(--ink-2); font:500 11.5px/1 "IBM Plex Mono",monospace; }
    .dot{ fill:var(--paper); stroke:var(--ink); stroke-width:1.3; }
    .cap{ fill:var(--ink-2); font:500 10.5px/1 "IBM Plex Mono",monospace; opacity:0; }
    .axlab{ fill:var(--ink-2); font:500 10px/1 "IBM Plex Mono",monospace; text-anchor:middle; }
    .amt{ fill:var(--page); font:600 10px/1 "IBM Plex Mono",monospace; text-anchor:middle; }
    .axrow{ fill:var(--ink-2); font:600 10px/1 "IBM Plex Mono",monospace; text-anchor:middle; }

    #qs-grid{ animation:s1op 10s var(--ease) infinite; }
    #qs-snap{ animation:s2op 10s var(--ease) infinite; }
    #qs-band{ animation:s3op 10s var(--ease) infinite; }
    #qs-index{ animation:s4op 10s var(--ease) infinite; }
    #dot1{ animation:dot1 10s var(--ease) infinite; }
    #dot2{ animation:dot2 10s var(--ease) infinite; }
    #dot3{ animation:dot3 10s var(--ease) infinite; }
    #dot4{ animation:dot4 10s var(--ease) infinite; }
    #cap1{ animation:cap1 10s var(--ease) infinite; }
    #cap2{ animation:cap2 10s var(--ease) infinite; }
    #cap3{ animation:cap3 10s var(--ease) infinite; }
    #cap4{ animation:cap4 10s var(--ease) infinite; }

    @keyframes s1op{ 0%,2%{opacity:0} 7%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes s2op{ 0%,25%{opacity:0} 30%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes s3op{ 0%,48%{opacity:0} 53%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes s4op{ 0%,71%{opacity:0} 76%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes dot1{ 0%,3%{fill:var(--paper)} 7%,92%{fill:var(--page)} 97%,100%{fill:var(--paper)} }
    @keyframes dot2{ 0%,26%{fill:var(--paper)} 30%,92%{fill:var(--page)} 97%,100%{fill:var(--paper)} }
    @keyframes dot3{ 0%,49%{fill:var(--paper)} 53%,92%{fill:var(--page)} 97%,100%{fill:var(--paper)} }
    @keyframes dot4{ 0%,72%{fill:var(--paper)} 76%,92%{fill:var(--page)} 97%,100%{fill:var(--paper)} }
    @keyframes cap1{ 0%,3%{opacity:0} 7%,22%{opacity:1} 25%,100%{opacity:0} }
    @keyframes cap2{ 0%,26%{opacity:0} 30%,45%{opacity:1} 48%,100%{opacity:0} }
    @keyframes cap3{ 0%,49%{opacity:0} 53%,68%{opacity:1} 71%,100%{opacity:0} }
    @keyframes cap4{ 0%,72%{opacity:0} 76%,92%{opacity:1} 97%,100%{opacity:0} }

    @media (prefers-reduced-motion:reduce){
      *{ animation:none !important; }
      #qs-grid,#qs-snap,#qs-band,#qs-index{ opacity:1; }
      #dot1,#dot2,#dot3,#dot4{ fill:var(--page); }
      #cap1,#cap2,#cap3{ opacity:0; } #cap4{ opacity:1; }
    }
  ]]></style>

  <text x="20" y="16" class="lab">three times the slack at nine times the value</text>
  <text x="20" y="34" class="fx">SQRT:MAX_ERROR=1N,A=0,B=1 &#8594; |x&#8722;x&#770;| &#8804; &#8730;x</text>

  <!-- the slack the bound allows, drawn behind the axis at two levels. Nine
       times the value buys three times the width, which is the whole curve. -->
  <g id="qs-band">
    <rect x="46.0"  y="95" width="18.1" height="16" fill="var(--page)" opacity="0.20"/>
    <rect x="245.4" y="95" width="54.4" height="16" fill="var(--page)" opacity="0.20"/>
    <text class="amt" x="55.1"  y="91">&#177;3</text>
    <text class="amt" x="272.6" y="91">&#177;9</text>
  </g>

  <!-- the grid. With this recipe the levels land on the perfect squares, so the
       gap from one to the next runs 5, 7, 9, 11 and the ticks visibly open out. -->
  <g id="qs-grid">
    <line x1="36" y1="103" x2="336" y2="103" stroke="var(--ink)" stroke-width="1.4"/>
    <g stroke="var(--ink)" stroke-width="1.4">
      <line x1="40.0"  y1="96" x2="40.0"  y2="110"/>
      <line x1="55.1"  y1="96" x2="55.1"  y2="110"/>
      <line x1="76.2"  y1="96" x2="76.2"  y2="110"/>
      <line x1="103.4" y1="96" x2="103.4" y2="110"/>
      <line x1="136.7" y1="96" x2="136.7" y2="110"/>
      <line x1="175.9" y1="96" x2="175.9" y2="110"/>
      <line x1="221.2" y1="96" x2="221.2" y2="110"/>
      <line x1="272.6" y1="96" x2="272.6" y2="110"/>
      <line x1="330.0" y1="96" x2="330.0" y2="110"/>
    </g>
    <text x="24" y="124" class="axrow">x</text>
    <g class="axlab">
      <text x="40.0"  y="124">4</text><text x="76.2"  y="124">16</text>
      <text x="136.7" y="124">36</text><text x="221.2" y="124">64</text>
      <text x="330.0" y="124">100</text>
    </g>
  </g>

  <!-- one sample, taken to the level nearest it in x rather than in the warped
       domain, which is where the cell boundaries actually sit -->
  <g id="qs-snap">
    <text class="fx" x="160.8" y="70" text-anchor="middle">44</text>
    <line x1="160.8" y1="86" x2="160.8" y2="96" stroke="var(--ink)" stroke-width="1.1" stroke-dasharray="3 3"/>
    <circle cx="160.8" cy="80" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
    <circle cx="175.9" cy="103" r="6.5" fill="var(--page)" stroke="var(--ink)" stroke-width="1.6"/>
  </g>

  <!-- the payoff. The values open out, the index behind them does not. -->
  <g id="qs-index">
    <text x="24" y="140" class="axrow" fill="var(--page)">q</text>
    <g class="axlab" fill="var(--page)">
      <text x="40.0"  y="140">2</text><text x="76.2"  y="140">4</text>
      <text x="136.7" y="140">6</text><text x="221.2" y="140">8</text>
      <text x="330.0" y="140">10</text>
    </g>
    <text class="fx"  x="180" y="164" text-anchor="middle">q steps by one, x by 2q+1</text>
    <text class="fx2" x="180" y="182" text-anchor="middle">x&#770; = (q &#183; step)&#178; &#8722; offset</text>
  </g>

  <!-- step indicator + captions -->
  <g id="qs-steps">
    <rect id="dot1" class="dot" x="20" y="199" width="9" height="9"/>
    <rect id="dot2" class="dot" x="33" y="199" width="9" height="9"/>
    <rect id="dot3" class="dot" x="46" y="199" width="9" height="9"/>
    <rect id="dot4" class="dot" x="59" y="199" width="9" height="9"/>
    <text id="cap1" class="cap" x="80" y="207">levels open out as the value grows</text>
    <text id="cap2" class="cap" x="80" y="207">each sample takes its nearest level</text>
    <text id="cap3" class="cap" x="80" y="207">the slack follows the square root</text>
    <text id="cap4" class="cap" x="80" y="207">one index step, wherever it sits</text>
  </g>
</svg>