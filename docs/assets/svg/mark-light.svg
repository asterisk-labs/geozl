  @keyframes m-t{0%{fill-opacity:0}10.5%{fill-opacity:0}13.0%{fill-opacity:1}21.5%{fill-opacity:1}24.0%{fill-opacity:0}35.5%{fill-opacity:0}38.0%{fill-opacity:1}46.5%{fill-opacity:1}49.0%{fill-opacity:0}60.5%{fill-opacity:0}63.0%{fill-opacity:1}71.5%{fill-opacity:1}74.0%{fill-opacity:0}85.5%{fill-opacity:0}88.0%{fill-opacity:1}96.5%{fill-opacity:1}99.0%{fill-opacity:0}100%{fill-opacity:0}}
