<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 226" width="940" height="226" role="img">
  <title>The graphs geozl profile proposes</title>
  <desc>geozl compresses a raster tile through a graph of codecs. Three graphs are shown in turn: entropy coding alone, a lossless predictor chain, and the same chain behind a logarithmic quantizer.</desc>
  <style><![CDATA[
svg{
  --paper:#F1EDE4; --paper-2:#EAE4D8; --ink:#17161C; --ink-2:#625D53;
  --line:rgba(23,22,28,.28); --purple:#4A2BE8; --gold:#F7CC0C;
  --orange:#FE6B37; --on:#F5F1E8;
  --tint:color-mix(in srgb,var(--orange) 16%,var(--paper));
  --ease:cubic-bezier(.22,.7,.2,1);
  --T:27s;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}

.lab{ fill:var(--ink-2); font:500 10px/1 monospace; letter-spacing:.03em; }
.lab-c{ text-anchor:middle; }
.rc{ font:600 18px/1 monospace; }
.rc-t{ fill:var(--ink); }
.rc-s{ fill:var(--line); }
.nl{ font:600 10.5px/1 monospace; text-anchor:middle; }
.nl-on{ fill:var(--on); } .nl-in{ fill:var(--ink); } .nl-dk{ fill:#17161C; }
.ct{ fill:var(--ink-2); font:500 7.5px/1 monospace; text-anchor:middle; }
.v{ fill:var(--ink); font:500 9px/1 monospace; text-anchor:middle; }
.pill{ fill:var(--line); } .pill-on{ fill:var(--ink); }

.k-gz{ fill:var(--purple); }
.k-lo{ fill:var(--orange); }
.k-bk{ fill:var(--gold); }
.k-oz{ fill:var(--paper); stroke:var(--ink); stroke-width:1.2; }
.f-gz{ fill:var(--purple); } .f-lo{ fill:var(--orange); }
.f-bk{ fill:var(--gold); }
.f-oz{ fill:var(--paper-2); stroke:var(--ink); stroke-width:1; }

.bd{ stroke:var(--ink); stroke-width:1; }
.b-plain{ fill:var(--paper-2); }
.b-tint{ fill:var(--tint); }
.pln{ stroke:var(--line); stroke-width:1; fill:none; }
.pln2{ stroke:var(--line); stroke-width:.8; fill:none; }
.wire{ stroke:var(--ink); stroke-width:1.2; fill:none; }
.wire-thin{ stroke:var(--line); stroke-width:1; fill:none; }
.tp{ fill:var(--ink); }
.tile-fr,.fr{ fill:none; stroke:var(--ink); stroke-width:1.4; }
.fp{ fill:var(--paper-2); stroke:var(--line); stroke-width:1; }
.ph{ fill:var(--purple); }

/* One 27s clock. Every delay is absolute seconds against it, so nothing drifts.
   A scene owns 9s and every element inside it fades out well before the
   scene comes round again, which is what stops the rebuild from blinking. */
.sc{ opacity:0; animation-duration:var(--T); animation-timing-function:step-end;
     animation-iteration-count:infinite; }
#gr-s1{ animation-name:v1 } #gr-s2{ animation-name:v2 } #gr-s3{ animation-name:v3 }
@keyframes v1{ 0%{opacity:1} 33.3333%{opacity:0} }
@keyframes v2{ 0%{opacity:0} 33.3333%{opacity:1} 66.6667%{opacity:0} }
@keyframes v3{ 0%{opacity:0} 66.6667%{opacity:1} 100%{opacity:0} }

.pp{ animation:pop var(--T) var(--ease) infinite backwards;
     transform-box:fill-box; transform-origin:center; }
.ppt{ animation:popt var(--T) var(--ease) infinite backwards; }
@keyframes pop{
  0%{ opacity:0; transform:translateY(6px) scale(.96) }
  1.66667%{ opacity:1; transform:translateY(0) scale(1.02) }
  2.96296%,33.3333%{ opacity:1; transform:none }
  34.8148%,100%{ opacity:0; transform:none }
}
@keyframes popt{
  0%{opacity:0} 1.66667%,33.3333%{opacity:1}
  34.8148%,100%{opacity:0}
}

/* The token that walks the graph once the nodes are up. --dx is set per
   element so one keyframe set covers every rail length. */
.pulse{ opacity:0; animation:travel var(--T) cubic-bezier(.4,0,.5,1) infinite backwards; }
@keyframes travel{
  0%{ transform:translateX(0); opacity:0 }
  0.555556%{ opacity:1 }
  7.40741%{ opacity:1 }
  8.14815%{ transform:translateX(var(--dx)); opacity:0 }
  100%{ transform:translateX(var(--dx)); opacity:0 }
}

/* The file has no background of its own, so on a dark README the ink would
   vanish. This flips the neutrals and lifts the darkest brand colour. It
   follows the browser preference, not GitHub's theme switch. */
@media (prefers-color-scheme:dark){
  svg{
    --paper:#1C1A17; --paper-2:#26231E; --ink:#F1EDE4; --ink-2:#9C958A;
    --line:rgba(241,237,228,.30); --purple:#7B5CFF; --gold:#E0BC18;
  }
}

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; }
  .sc{ opacity:0 }
  #gr-s2{ opacity:1 }
  .pp,.ppt{ opacity:1 }
  .pulse{ opacity:0 }
}
  ]]></style>

