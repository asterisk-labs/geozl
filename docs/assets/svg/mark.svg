<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="GeoZL planar prediction mark">
<style>
  .m-source,.m-target{fill:transparent;stroke:#DFE7EF;stroke-width:2.4}
  .m-source{animation:m-source 6s ease-in-out infinite}
  .m-purple,.m-signal-nw{--mark-color:#7457FF}
  .m-green,.m-signal-n{--mark-color:#91F2BC}
  .m-yellow,.m-signal-w{--mark-color:#FFD54A}
  .m-target{animation:m-target 6s ease-in-out infinite}
  .m-arrow{stroke:#DFE7EF;opacity:.15;animation:m-route 6s ease-in-out infinite}
  .m-signal{fill:var(--mark-color);opacity:0;transform-box:fill-box;transform-origin:center}
  .m-signal-nw{animation:m-flow-nw 6s ease-in-out infinite}
  .m-signal-n{animation:m-flow-n 6s ease-in-out infinite}
  .m-signal-w{animation:m-flow-w 6s ease-in-out infinite}
  @keyframes m-source{0%,14%,86%,100%{fill:transparent}22%,78%{fill:var(--mark-color)}}
  @keyframes m-target{0%,57%,86%,100%{fill:transparent}63%,78%{fill:#FF7A4F}}
  @keyframes m-route{0%,18%,72%,100%{opacity:.15}27%,60%{opacity:.85}}
  @keyframes m-flow-nw{0%,25%{opacity:0;transform:translate(0,0)}29%{opacity:1}58%{opacity:1;transform:translate(100px,100px)}61%,100%{opacity:0;transform:translate(100px,100px)}}
  @keyframes m-flow-n{0%,25%{opacity:0;transform:translate(0,0)}29%{opacity:1}58%{opacity:1;transform:translate(0,100px)}61%,100%{opacity:0;transform:translate(0,100px)}}
  @keyframes m-flow-w{0%,25%{opacity:0;transform:translate(0,0)}29%{opacity:1}58%{opacity:1;transform:translate(100px,0)}61%,100%{opacity:0;transform:translate(100px,0)}}
  @media (prefers-reduced-motion:reduce){
    .m-source,.m-target,.m-arrow,.m-signal{animation:none}
    .m-source{fill:var(--mark-color)}.m-target{fill:#FF7A4F}.m-arrow{opacity:.85}.m-signal{display:none}
  }
</style>
<defs><marker id="mah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="m-source m-purple" x="18" y="18" width="44" height="44"/>
<rect class="m-source m-green" x="118" y="18" width="44" height="44"/>
<rect class="m-source m-yellow" x="18" y="118" width="44" height="44"/>
<rect class="m-target" x="118" y="118" width="44" height="44"/>
<line class="m-arrow" x1="140" y1="66" x2="140" y2="113" stroke-width="2.6" marker-end="url(#mah)"/>
<line class="m-arrow" x1="66" y1="140" x2="113" y2="140" stroke-width="2.6" marker-end="url(#mah)"/>
<line class="m-arrow" x1="64" y1="64" x2="112" y2="112" stroke-width="2.6" marker-end="url(#mah)"/>
<circle class="m-signal m-signal-nw" cx="40" cy="40" r="5"/>
<circle class="m-signal m-signal-n" cx="140" cy="40" r="5"/>
<circle class="m-signal m-signal-w" cx="40" cy="140" r="5"/>
</svg>
