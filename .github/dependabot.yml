version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Lima
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
