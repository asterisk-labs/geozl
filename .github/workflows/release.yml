name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # build and import the wheels without publishing

permissions:
  contents: read

jobs:
  # The tag must match VERSION, the single source of the wheel version. On a
  # workflow_dispatch there is no tag, so the check is skipped and the build runs
  # as a dry run.
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          file="$(tr -d '[:space:]' < VERSION)"
          [ "$tag" = "$file" ] || { echo "::error::tag v$tag != VERSION $file"; exit 1; }

      - id: version
        run: |
          file="$(tr -d '[:space:]' < VERSION)"
          jl="$(sed -n 's/^version = "\(.*\)"$/\1/p' bindings/julia/Project.toml)"
          [ "$jl" = "$file" ] || { echo "::error::bindings/julia/Project.toml $jl != VERSION $file"; exit 1; }
          js="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' tools/wasm/js/package.json)"
          [ "$js" = "$file" ] || { echo "::error::tools/wasm/js/package.json $js != VERSION $file"; exit 1; }
          echo "version=$file" >> "$GITHUB_OUTPUT"

      # The R source package builds from the copy of the native sources it
      # carries, so a release must carry the current one.
      - name: Verify the R package's vendored sources
        run: |
          python3 tools/sync_r_vendor.py
          status="$(git status --porcelain --ignored -- bindings/r/src/ext bindings/r/inst/licenses bindings/r/DESCRIPTION)"
          [ -z "$status" ] || { echo "::error::bindings/r is out of date, run make r-vendor"; echo "$status"; exit 1; }

  linux:
    name: Wheel linux-x86_64
    needs: validate
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and check the wheel
        run: |
          set -euxo pipefail
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          pip install -q cmake ninja build wheel auditwheel
          # The manylinux x86_64 tag promises the base ISA. Faster kernels are
          # selected at runtime.
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DGEOZL_BUILD_FULL=ON -DGEOZL_BUILD_KERNELS_SHARED=ON
          cmake --build build
          mkdir -p bindings/python/geozl/_lib
          cp -v build/libgeozl_kernels*.so bindings/python/geozl/_lib/
          cp -v build/libgeozl.so bindings/python/geozl/_lib/
          python -m build --wheel --outdir raw bindings/python
          python -m wheel tags --python-tag py3 --abi-tag none --remove raw/*.whl
          auditwheel repair -w dist raw/*.whl
          python bindings/python/check_wheel.py dist/*.whl
          python -m venv /tmp/v && . /tmp/v/bin/activate
          pip install dist/*.whl
          LD_LIBRARY_PATH="" python -c "import geozl; print(geozl.__version__)"
          LD_LIBRARY_PATH="" python -c "import geozl, json; \
            i=geozl.simd_info(); print('simd', json.dumps(i)); \
            gap=[p for p in i['cpu'] if p not in i['built']]; \
            assert not gap, f'the wheel cannot use {gap} on a cpu that has it'"
          LD_LIBRARY_PATH="" python -c "import numpy as np, geozl; \
            t=(np.arange(256*256,dtype=np.uint16)%97).reshape(256,256); \
            best=geozl.profile(t, reps=1)[0]['graph']; \
            g=geozl.graph(t, best); \
            f=geozl.compress(t, graph=g); \
            d=geozl.decompress(f).view(np.uint16).reshape(t.shape); \
            assert (d == t).all(), 'round-trip mismatch'; \
            print('compress', len(f), 'bytes, round-trip ok')"
      # The same libgeozl, for the Julia package's artifact.
      - name: Package libgeozl
        run: |
          set -euxo pipefail
          name="libgeozl-$(tr -d '[:space:]' < VERSION)-linux-x86_64"
          mkdir -p "$name/lib" lib-dist
          cp build/libgeozl.so "$name/lib/"
          cp LICENSE "$name/"
          tar -czf "lib-dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: libgeozl-linux
          path: lib-dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: Wheel macos-arm64
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and check the wheel
        run: |
          set -euxo pipefail
          export MACOSX_DEPLOYMENT_TARGET=11.0
          pip install -q --upgrade pip cmake ninja build wheel delocate
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DGEOZL_BUILD_FULL=ON -DGEOZL_BUILD_KERNELS_SHARED=ON
          cmake --build build
          mkdir -p bindings/python/geozl/_lib
          cp -v build/libgeozl_kernels*.dylib bindings/python/geozl/_lib/
          cp -v build/libgeozl.dylib bindings/python/geozl/_lib/
          python -m build --wheel --outdir raw bindings/python
          delocate-wheel -w dist raw/*.whl
          python -m wheel tags --python-tag py3 --abi-tag none \
            --platform-tag macosx_11_0_arm64 --remove dist/*.whl
          python bindings/python/check_wheel.py dist/*.whl
          python -m venv /tmp/v && . /tmp/v/bin/activate
          pip install dist/*.whl
          python -c "import geozl; print(geozl.__version__)"
          python -c "import geozl, json; \
            i=geozl.simd_info(); print('simd', json.dumps(i)); \
            gap=[p for p in i['cpu'] if p not in i['built']]; \
            assert not gap, f'the wheel cannot use {gap} on a cpu that has it'"
          python -c "import numpy as np, geozl; \
            t=(np.arange(256*256,dtype=np.uint16)%97).reshape(256,256); \
            best=geozl.profile(t, reps=1)[0]['graph']; \
            g=geozl.graph(t, best); \
            f=geozl.compress(t, graph=g); \
            d=geozl.decompress(f).view(np.uint16).reshape(t.shape); \
            assert (d == t).all(), 'round-trip mismatch'; \
            print('compress', len(f), 'bytes, round-trip ok')"
      - name: Package libgeozl
        run: |
          set -euxo pipefail
          name="libgeozl-$(tr -d '[:space:]' < VERSION)-macos-arm64"
          mkdir -p "$name/lib" lib-dist
          cp build/libgeozl.dylib "$name/lib/"
          cp LICENSE "$name/"
          # No AppleDouble files or extended attributes, which would change the
          # tree Julia hashes.
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "lib-dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: libgeozl-macos
          path: lib-dist/*.tar.gz
          if-no-files-found: error

  # The npm package is the wasm build directory, packed after the tests the
  # platforms workflow runs. OpenZL needs a 64-bit size_t, so this is wasm64.
  wasm:
    name: npm package wasm64
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.19
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.19
          python3 -m pip install cmake ninja
          echo "CMAKE=$(command -v cmake)" >> "$GITHUB_ENV"
      - name: Build and test GeoZL wasm64
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make wasm-test
      - name: Pack and check the package
        run: |
          set -euxo pipefail
          mkdir -p npm-dist
          (cd core/build-wasm/wasm && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-dist")
          # Installed from the tarball, so a file missing from `files` fails here.
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/npm-dist/*.tgz
          node --input-type=module -e "
            import {createGeoZL, DType} from '@asterisk-labs/geozl';
            const geozl = await createGeoZL();
            const data = new Uint8Array(256 * 256 * 2).map((_, i) => i % 97);
            const frame = geozl.compress(data, {method: 'planar>zigzag>pfor', width: 256, dtype: DType.U16});
            const back = geozl.decompress(frame, {maxOutputSize: data.length});
            if (!back.every((v, i) => v === data[i])) throw new Error('round-trip mismatch');
            console.log('compress', frame.length, 'bytes, round-trip ok');"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: npm-dist/*.tgz
          if-no-files-found: error

  # Only on a tag. Every package must have built, so a failed platform blocks
  # the release. Trusted publishing over OIDC, no stored token.
  publish:
    name: Publish
    needs: [validate, linux, macos, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: libgeozl-*
          path: lib-dist
          merge-multiple: true
      # The tagged Julia package fetches this from the release, since the
      # tarball hashes do not exist when the tag is made. It is written before
      # anything is published, so a release never goes out without it.
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Write the Julia Artifacts.toml
        run: |
          set -euo pipefail
          julia bindings/julia/make-artifacts-toml.jl \
            "${{ needs.validate.outputs.version }}" lib-dist > Artifacts.toml
          cat Artifacts.toml
          mv Artifacts.toml lib-dist/
      - run: ls -l dist/ lib-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            lib-dist/*.tar.gz
            lib-dist/Artifacts.toml
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-') }}

  # After PyPI and the GitHub release, so npm never gets a version the other
  # registries lack. A rerun skips a version that is already there.
  npm:
    name: Publish to npm
    needs: [wasm, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-dist
      - run: |
          set -euo pipefail
          package=$(node -p "require('./tools/wasm/js/package.json').name")
          version=$(node -p "require('./tools/wasm/js/package.json').version")
          if npm view "$package@$version" version > /dev/null 2>&1; then
            echo "$package@$version is already published; skipping npm publish"
            exit 0
          fi
          # Trusted publishing cannot move latest back to a lower version, and
          # a prerelease is never latest.
          latest=$(npm view "$package" dist-tags.latest 2>/dev/null || true)
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)" != "$version" ]; then
            tag=next
          fi
          npm publish npm-dist/*.tgz --access public --tag "$tag"
