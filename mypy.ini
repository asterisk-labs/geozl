# One config for the whole tree, next to .ruff.toml. mypy does not walk up
# looking for a config the way ruff does, so without this a run from the root
# gets no settings at all and wanders into the submodule.
[mypy]
files     = bindings/python/geozl, bindings/python/hatch_build.py
mypy_path = bindings/python
exclude   = (?x)( ^\.?/?extern/ | ^\.?/?build/ | ^\.?/?fuzz/ | ^\.?/?docs/
                | ^\.?/?bindings/python/test/ | demo.py)

# 3.12 to parse numpy's stubs, which use PEP 695. The floor stays 3.11, held by
# requires-python and by ruff, which rejects newer syntax at target-version.
python_version         = 3.12
ignore_missing_imports = True

# py.typed covers the public entry points.
disallow_untyped_defs = True

# cffi plumbing, where every buffer is Any and a signature would claim more
# than it knows.
[mypy-geozl._codec,geozl._ffi,geozl.lossless.*,geozl.lossy.*]
disallow_untyped_defs = False
