[build-system]
requires      = ["hatchling>=1.25"]
build-backend = "hatchling.build"


[project]
name            = "geozl"
dynamic         = ["version"]
description     = "Python bindings to libgeozl, the geospatial codec extensions for OpenZL."
readme          = "README.md"
license         = { text = "BSD-3-Clause" }
requires-python = ">=3.11"

authors = [
    { name = "Cesar Aybar",     email = "cesar@asterisk.coop" }
]

dependencies = [
    "numpy>=1.24",
    "cffi>=1.17",
    # Only where OpenZL publishes a wheel; elsewhere geozl runs without it.
    "openzl>=0.3,<0.4; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
Homepage   = "https://github.com/asterisk-labs/geozl"
Repository = "https://github.com/asterisk-labs/geozl"
Issues     = "https://github.com/asterisk-labs/geozl/issues"


[tool.hatch.version]
path    = "../../VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages  = ["geozl"]
artifacts = [
    "geozl/py.typed",
    "geozl/_lib/*.so",
    "geozl/_lib/*.so.*",
    "geozl/_lib/*.dylib",
    "geozl/_lib/*.dll",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "geozl/**",
    "test/**",
    "hatch_build.py",
    "README.md",
]
exclude = [
    "geozl/_lib/*.so",
    "geozl/_lib/*.so.*",
    "geozl/_lib/*.dylib",
    "geozl/_lib/*.dll",
]


[tool.pytest.ini_options]
testpaths = ["test"]
addopts   = "-ra --strict-markers"
